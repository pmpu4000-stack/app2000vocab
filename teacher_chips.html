<script>
function initMasteredChipsComponent(words) {
  const list = Array.isArray(words) ? words : [];
  window._masteredViewer.words = Array.from(new Set(list.map(w => resolveWord(w)).filter(Boolean)));
  window._masteredViewer.levelFilter = 0;
  window._masteredViewer.searchQuery = "";
  window._masteredViewer.limit = 50;

  const searchInput = document.getElementById("stMasteredSearchInput");
  if (searchInput) searchInput.value = "";

  renderMasteredLevelTabs();
  renderMasteredChipsUI();
}

function renderMasteredLevelTabs() {
  const tabsWrap = document.getElementById("stMasteredLevelTabs");
  if (!tabsWrap) return;

  const words = window._masteredViewer.words || [];
  const levelCounts = [words.length, 0, 0, 0, 0, 0];
  words.forEach(w => {
    const lv = getWordLevel(w);
    if (lv >= 1 && lv <= 5) levelCounts[lv]++;
  });

  const lvNames = ["全部", "L1 入門", "L2 基礎", "L3 進階", "L4 挑戰", "L5 熟練"];
  const currentLv = window._masteredViewer.levelFilter;

  tabsWrap.innerHTML = lvNames.map((name, idx) => {
    const count = levelCounts[idx];
    const activeClass = (currentLv === idx) ? "active" : "";
    return `
      <button type="button" class="st-level-tab-btn ${activeClass}" onclick="setMasteredLevelFilter(${idx})">
        ${name} (${count})
      </button>
    `;
  }).join("");
}

function setMasteredLevelFilter(lv) {
  window._masteredViewer.levelFilter = lv;
  window._masteredViewer.limit = 50;
  renderMasteredLevelTabs();
  renderMasteredChipsUI();
}

function handleMasteredFilterChange() {
  const searchInput = document.getElementById("stMasteredSearchInput");
  window._masteredViewer.searchQuery = searchInput ? searchInput.value.trim().toLowerCase() : "";
  window._masteredViewer.limit = 50;
  renderMasteredChipsUI();
}

function renderMasteredChipsUI() {
  const wrap = document.getElementById("stMasteredChipsWrap");
  if (!wrap) return;

  const allWords = window._masteredViewer.words || [];
  const targetLv = window._masteredViewer.levelFilter;
  const q = window._masteredViewer.searchQuery;
  const limit = window._masteredViewer.limit;

  // 1. 條件篩選
  const filtered = allWords.filter(w => {
    if (targetLv > 0) {
      const lv = getWordLevel(w);
      if (lv !== targetLv) return false;
    }
    if (q) {
      const wLower = w.toLowerCase();
      const zh = getWordZh(w).toLowerCase();
      if (!wLower.includes(q) && !zh.includes(q)) return false;
    }
    return true;
  });

  // 2. 渲染單字晶片
  if (filtered.length === 0) {
    wrap.innerHTML = `<span style="font-size:13px; color:var(--text-muted); padding:6px 0;">${allWords.length === 0 ? "還沒有已精通單字，繼續加油！" : "查無符合條件的單字"}</span>`;
  } else {
    const slice = filtered.slice(0, limit);
    wrap.innerHTML = slice.map(w => {
      const zh = getWordZh(w);
      const lv = getWordLevel(w);
      const tip = `${w} ${zh ? `(${zh})` : ''} · Level ${lv || '?'} · 點擊聆聽發音`;
      return `
        <span class="wchip" onclick="speakMasteredWord('${escapeHtml(w)}')" title="${escapeHtml(tip)}">
          <span class="wchip-speaker">${SVG_SPEAKER}</span>
          <span style="font-weight:700;">${escapeHtml(w)}</span>
          ${zh ? `<span style="font-size:11px; opacity:0.85; margin-left:1px;">(${escapeHtml(zh)})</span>` : ''}
        </span>
      `;
    }).join("");
  }

  // 3. 底部狀態列與按鈕更新
  const statsEl = document.getElementById("stMasteredStatsText");
  const btnMore = document.getElementById("btnLoadMoreMastered");
  const btnAll = document.getElementById("btnShowAllMastered");

  const shownCount = Math.min(filtered.length, limit);
  if (statsEl) {
    statsEl.textContent = `顯示 ${shownCount} / 符合 ${filtered.length} 字 (總精通 ${allWords.length} 字)`;
  }

  if (btnMore) {
    btnMore.style.display = (shownCount < filtered.length) ? "inline-block" : "none";
  }
  if (btnAll) {
    btnAll.style.display = (shownCount < filtered.length && filtered.length > limit) ? "inline-block" : "none";
  }
}

function loadMoreMasteredWords() {
  window._masteredViewer.limit += 50;
  renderMasteredChipsUI();
}

function showAllMasteredWords() {
  window._masteredViewer.limit = 99999;
  renderMasteredChipsUI();
}

function toggleMasteredWrapHeight() {
  const wrap = document.getElementById("stMasteredChipsWrap");
  const txt = document.getElementById("txtToggleMasteredExpand");
  if (!wrap) return;

  window._masteredViewer.isExpanded = !window._masteredViewer.isExpanded;
  if (window._masteredViewer.isExpanded) {
    wrap.style.maxHeight = "480px";
    if (txt) txt.textContent = "收合高度";
  } else {
    wrap.style.maxHeight = "140px";
    if (txt) txt.textContent = "展開高度";
  }
}

function copyMasteredWordsList() {
  const allWords = window._masteredViewer.words || [];
  const targetLv = window._masteredViewer.levelFilter;
  const q = window._masteredViewer.searchQuery;

  const filtered = allWords.filter(w => {
    if (targetLv > 0 && getWordLevel(w) !== targetLv) return false;
    if (q) {
      const wLower = w.toLowerCase();
      const zh = getWordZh(w).toLowerCase();
      if (!wLower.includes(q) && !zh.includes(q)) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    showToast("目前沒有單字可複製", "warning");
    return;
  }

  const textLines = filtered.map(w => {
    const zh = getWordZh(w);
    const lv = getWordLevel(w);
    return `${w}${zh ? `\t${zh}` : ''}\t[L${lv}]`;
  }).join("\n");

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(textLines).then(() => {
      showToast(`✅ 已複製 ${filtered.length} 個已精通單字到剪貼簿！`, "success");
    }).catch(() => {
      prompt("請手動複製以下單字：", textLines);
    });
  } else {
    prompt("請手動複製以下單字：", textLines);
  }
}

function renderFixedChipsUI() {

  const allWords = window._fixedViewer.words || [];

  if (filtered.length === 0) {
    wrap.innerHTML = `<span style="font-size:13px; color:var(--text-muted); padding:6px 0;">${allWords.length === 0 ? "目前沒有曾拼錯單字" : "查無符合條件的訂正單字"}</span>`;
  } else {
    const slice = filtered.slice(0, limit);
    wrap.innerHTML = slice.map(w => {
      const zh = getWordZh(w);
      const lv = getWordLevel(w);
      const tip = `${w} ${zh ? `(${zh})` : ''} · Level ${lv || '?'} · 曾拼錯現已訂正 · 點擊發音`;
      return `
        <span class="wchip fixed" onclick="speakMasteredWord('${escapeHtml(w)}')" title="${escapeHtml(tip)}">
          <span class="wchip-speaker">${SVG_SPEAKER}</span>
          <span>${escapeHtml(w)}</span>
          ${zh ? `<span style="font-size:11px; opacity:0.9; margin-left:1px;">(${escapeHtml(zh)})</span>` : ''}
        </span>
      `;
    }).join("");
  }

  const statsEl = document.getElementById("stFixedStatsText");
  const btnMore = document.getElementById("btnLoadMoreFixed");
  const shownCount = Math.min(filtered.length, limit);

  if (statsEl) {
    statsEl.textContent = `顯示 ${shownCount} / 符合 ${filtered.length} 字 (總訂正 ${allWords.length} 字)`;
  }
  if (btnMore) {
    btnMore.style.display = (shownCount < filtered.length) ? "inline-block" : "none";
  }
}

function loadMoreFixedWords() {
  window._fixedViewer.limit += 50;
  renderFixedChipsUI();
}

function copyFixedWordsList() {
  const allWords = window._fixedViewer.words || [];
  const q = window._fixedViewer.searchQuery;
  const filtered = allWords.filter(w => {
    if (q) {
      const wLower = w.toLowerCase();
      const zh = getWordZh(w).toLowerCase();
      if (!wLower.includes(q) && !zh.includes(q)) return false;
    }
    return true;
  });
  if (filtered.length === 0) {
    showToast("目前沒有單字可複製", "warning");
    return;
  }
  const textLines = filtered.map(w => {
    const zh = getWordZh(w);
    return `${w}${zh ? `\t${zh}` : ''}`;
  }).join("\n");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(textLines).then(() => {
      showToast(`✅ 已複製 ${filtered.length} 個已訂正單字到剪貼簿！`, "success");
    }).catch(() => {
      prompt("請手動複製以下單字：", textLines);
    });
  } else {
    prompt("請手動複製以下單字：", textLines);
  }
}

// ════════════════════════════════════════
// 🎯 每日指定單字測驗成果渲染模組 (Student Daily Task Results)
// ════════════════════════════════════════
let cachedStudentDailyHistory = [];
let cachedStudentTodayTaskResult = null;
let cachedStudentAssignedTask = null;
let studentDailyFilter = {
  type: 'all',        // 'all', 'today', '7days', '30days', 'thisMonth', 'custom'
  startDate: '',
  endDate: ''
};

function renderStudentDailyTask(todayTaskResult, dailyTaskHistory, assignedTask) {
  const card = document.getElementById("studentDailyTaskCard");
  if (!card) return;

  cachedStudentDailyHistory = Array.isArray(dailyTaskHistory) ? dailyTaskHistory : [];
  cachedStudentTodayTaskResult = todayTaskResult || { hasDone: false, inProgress: false };
  if (typeof assignedTask !== "undefined") cachedStudentAssignedTask = assignedTask;

  // 強化備援校正：若 todayTaskResult 未判定完成，但歷史明細中已有今日完成之測驗，自動同步為完成狀態
  if (!cachedStudentTodayTaskResult.hasDone && cachedStudentDailyHistory.length > 0) {
    const todayDash = formatDateYMD(new Date());
    const matchedToday = cachedStudentDailyHistory.find(h => h.date === todayDash && ((h.status && h.status.includes("已完成")) || (h.score && h.score !== "—")));
    if (matchedToday) {
      cachedStudentTodayTaskResult.hasDone = true;
      cachedStudentTodayTaskResult.inProgress = false;
      cachedStudentTodayTaskResult.taskName = matchedToday.taskName || "今日指定測驗";
      cachedStudentTodayTaskResult.score = matchedToday.score;
      cachedStudentTodayTaskResult.rate = formatRatePercentage(matchedToday.rate, matchedToday.score);
      cachedStudentTodayTaskResult.status = matchedToday.status;
      cachedStudentTodayTaskResult.updatedAt = matchedToday.updatedAt;
      cachedStudentTodayTaskResult.wrongWords = matchedToday.wrongWords || [];
    }
  }

  // 1. 今日測驗狀態 Badge 與 橫幅 Banner
  const statusBadge = document.getElementById("studentDailyStatusBadge");
  const banner = document.getElementById("studentTodayTaskBanner");
  const today = cachedStudentTodayTaskResult;
  const currentTask = cachedStudentAssignedTask;

  if (today.hasDone) {
    if (statusBadge) {
      statusBadge.className = "analytics-status-pill analytics-status-done";
      statusBadge.innerText = "✨ 今日測驗已完成";
    }
    const accRateStr = formatRatePercentage(today.rate, today.score);
    const accNum = parseFloat(accRateStr) || 0;
    let accColor = "#10b981";
    if (accNum < 60) accColor = "#ef4444";
    else if (accNum < 80) accColor = "#f59e0b";

    let isTodayScorePerfect = (accNum >= 100);
    if (today.score && today.score.includes("/")) {
      const sp = today.score.split("/");
      if (parseInt(sp[0]) > 0 && parseInt(sp[0]) === parseInt(sp[1])) isTodayScorePerfect = true;
    }

    let wrongDiagnosisHtml = "";
    if (Array.isArray(today.wrongWords) && today.wrongWords.length > 0) {
      const tags = today.wrongWords.map((w, idx) => {
        const zh = getWordZh(w);
        return `<span class="error-word-tag" style="padding:4px 10px; font-size:12px; margin:2px 4px; display:inline-flex; align-items:center; gap:4px;" title="${zh ? escapeHtml(zh) : ''}">
          <strong style="color:var(--text);">${idx + 1}.</strong> ${escapeHtml(w)}${zh ? ` (${escapeHtml(zh)})` : ''}
        </span>`;
      }).join("");

      wrongDiagnosisHtml = `
        <div style="margin-top:14px; padding-top:12px; border-top:1px dashed var(--border);">
          <div style="font-size:13px; font-weight:700; color:#ef4444; margin-bottom:8px; display:flex; align-items:center; gap:6px;">
            ⚠️ 本次測驗答錯單字診斷 (${today.wrongWords.length} 個單字，已自動同步至個人錯題庫)：
          </div>
          <div style="display:flex; flex-wrap:wrap; gap:6px;">
            ${tags}
          </div>
        </div>
      `;
    } else if (isTodayScorePerfect) {
      wrongDiagnosisHtml = `
        <div style="margin-top:12px; padding:10px 14px; background:rgba(16,185,129,0.08); border:1px solid rgba(16,185,129,0.2); border-radius:10px; color:#10b981; font-weight:700; font-size:13px; display:flex; align-items:center; gap:6px;">
          <span>✨ 完美全對滿分！本次測驗無任何錯題，實力超群！</span>
        </div>
      `;
    } else {
      wrongDiagnosisHtml = `
        <div style="margin-top:12px; padding:10px 14px; background:rgba(99,102,241,0.06); border:1px solid rgba(99,102,241,0.15); border-radius:10px; color:var(--text-muted); font-size:12.5px; display:flex; align-items:center; gap:6px;">
          <span>本次測驗未收錄個別錯題單字</span>
        </div>
      `;
    }

    if (banner) {
      banner.style.display = "block";
      banner.style.background = "linear-gradient(135deg, rgba(16,185,129,0.06) 0%, rgba(99,102,241,0.04) 100%)";
      banner.style.borderColor = "rgba(16,185,129,0.3)";
      banner.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <div>
            <div style="font-size:16px; font-weight:800; color:var(--text); margin-bottom:6px; display:flex; align-items:center; gap:8px;">
              <span>🎉 今日指定單字測驗已順利完成！</span>
              <span style="font-size:12px; font-weight:700; color:#10b981; background:rgba(16,185,129,0.15); padding:2px 8px; border-radius:12px;">已交卷存檔</span>
            </div>
            <div style="font-size:13.5px; color:var(--text-muted); line-height:1.7;">
              測驗任務：<strong style="color:var(--text);">${escapeHtml(today.taskName || '每日指定測驗')}</strong>｜
              得分：<strong style="color:var(--primary); font-size:15px;">${escapeHtml(today.score || '—')}</strong>｜
              正確率：<strong style="color:${accColor}; font-size:15px;">${escapeHtml(accRateStr)}</strong>｜
              完成時間：<span>${escapeHtml(today.updatedAt || '—')}</span>
            </div>
          </div>
          <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
            <a href="https:\x2F\x2Fpmpu4000-stack.github.io/app2000vocab/" target="_blank" rel="noopener noreferrer" class="btn-secondary" style="text-decoration:none; padding:7px 14px; font-size:13px; border-radius:8px; display:inline-flex; align-items:center; gap:6px; font-weight:700;">
              <span>🔄 前往自主單字練習</span>
            </a>
            <button class="btn-primary" onclick="copyStudentDailyReport()" style="padding:7px 14px; font-size:13px; border-radius:8px; display:inline-flex; align-items:center; gap:6px; box-shadow:0 2px 6px rgba(99,102,241,0.25); cursor:pointer;">
              <span>📋 複製成果快報給家長</span>
            </button>
          </div>
        </div>
        ${wrongDiagnosisHtml}
      `;
    }
  } else if (today.inProgress) {
    if (statusBadge) {
      statusBadge.className = "analytics-status-pill analytics-status-doing";
      statusBadge.innerText = "⏳ 作答中 (每題自動即時存檔)";
    }
    if (banner) {
      banner.style.display = "block";
      banner.style.background = "linear-gradient(135deg, rgba(245,158,11,0.08) 0%, rgba(234,179,8,0.04) 100%)";
      banner.style.borderColor = "rgba(245,158,11,0.3)";
      banner.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;">
          <div>
            <div style="font-size:15.5px; font-weight:800; color:var(--text); margin-bottom:4px; display:flex; align-items:center; gap:8px;">
              <span>📝 今日指定測驗作答進行中</span>
              <span style="font-size:12px; font-weight:700; color:#f59e0b; background:rgba(245,158,11,0.15); padding:2px 8px; border-radius:12px;">即時存檔中</span>
            </div>
            <div style="font-size:13px; color:var(--text-muted); line-height:1.6;">
              當前進度：<strong style="color:var(--primary);">${escapeHtml(today.status || '作答中')}</strong>｜
              上次存檔：<span>${escapeHtml(today.updatedAt || '—')}</span>（作答每題皆已自動同步至雲端，進度安全不丟失）
            </div>
          </div>
          <a href="https:\x2F\x2Fpmpu4000-stack.github.io/app2000vocab/" target="_blank" rel="noopener noreferrer" style="text-decoration:none; padding:8px 18px; border-radius:8px; font-weight:800; font-size:13.5px; background:linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color:#fff; display:inline-flex; align-items:center; gap:6px; box-shadow:0 3px 10px rgba(245,158,11,0.3); transition:all 0.15s ease;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">
            <span>▶️ 繼續未完成之測驗</span>
          </a>
        </div>
      `;
    }
  } else {
    const hasAssigned = currentTask && currentTask.hasTask;
    if (statusBadge) {
      if (hasAssigned) {
        statusBadge.className = "analytics-status-pill";
        statusBadge.style.background = "rgba(239, 68, 68, 0.1)";
        statusBadge.style.color = "#ef4444";
        statusBadge.style.borderColor = "rgba(239, 68, 68, 0.25)";
        statusBadge.innerText = "未受測";
      } else {
        statusBadge.className = "analytics-status-pill analytics-status-none";
        statusBadge.style.background = "";
        statusBadge.style.color = "";
        statusBadge.style.borderColor = "";
        statusBadge.innerText = "未指派";
      }
    }
    const taskTitle = hasAssigned ? (currentTask.taskName || '每日指定單字測驗') : '每日指定單字隨堂測驗';
    const totalWords = hasAssigned ? (currentTask.total || (currentTask.words && currentTask.words.length) || 0) : 0;
    const modeLabel = hasAssigned ? (currentTask.mode === 'ALL' ? '全數測驗' : `抽測 ${currentTask.count} 題`) : '';

    if (banner) {
      banner.style.display = "block";
      banner.style.background = hasAssigned ? "linear-gradient(135deg, rgba(99,102,241,0.06) 0%, rgba(139,92,246,0.04) 100%)" : "var(--table-header-bg)";
      banner.style.borderColor = hasAssigned ? "rgba(99,102,241,0.28)" : "var(--border)";

      if (hasAssigned) {
        banner.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;">
            <div>
              <div style="font-size:15.5px; font-weight:800; color:var(--text); margin-bottom:5px; display:flex; align-items:center; gap:8px;">
                <span>📌 今日指派測驗：${escapeHtml(taskTitle)}</span>
                <span style="font-size:11.5px; font-weight:700; color:#ef4444; background:rgba(239,68,68,0.12); padding:2px 8px; border-radius:12px;">未受測</span>
              </div>
              <div style="font-size:13px; color:var(--text-muted); line-height:1.6;">
                出題清單：共 <strong>${totalWords}</strong> 個單字（${modeLabel}）｜
                請點擊右側按鈕立即前往測驗挑戰，完成後將自動同步登錄成績與錯題弱點診斷！
              </div>
            </div>
            <a href="https:\x2F\x2Fpmpu4000-stack.github.io/app2000vocab/" target="_blank" rel="noopener noreferrer" style="text-decoration:none; padding:9px 18px; border-radius:8px; font-weight:800; font-size:14px; background:linear-gradient(135deg, #6366f1 0%, #4f46e5 100%); color:#fff; display:inline-flex; align-items:center; gap:6px; box-shadow:0 3px 12px rgba(99,102,241,0.35); transition:all 0.15s ease;" onmouseover="this.style.transform='translateY(-1px)'" onmouseout="this.style.transform='translateY(0)'">
              <span>🚀 立即前往測驗挑戰</span>
            </a>
          </div>
        `;
      } else {
        banner.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:14px;">
            <div>
              <div style="font-size:15px; font-weight:800; color:var(--text); margin-bottom:4px; display:flex; align-items:center; gap:8px;">
                <span>☕ 今日未指派指定測驗</span>
                <span style="font-size:11.5px; font-weight:700; color:var(--text-muted); background:rgba(148,163,184,0.15); padding:2px 8px; border-radius:12px;">未指派</span>

function setStudentDailyQuickDate(preset) {
  studentDailyFilter.type = preset;
  const today = new Date();
  const endStr = formatDateYMD(today);
  let startStr = "";

  if (preset === "today") {
    startStr = endStr;
  } else if (preset === "7days") {
    const d = new Date(); d.setDate(d.getDate() - 6);
    startStr = formatDateYMD(d);
  } else if (preset === "30days") {
    const d = new Date(); d.setDate(d.getDate() - 29);
    startStr = formatDateYMD(d);
  } else if (preset === "thisMonth") {

  }

  const sInput = document.getElementById("stDailyStartDate");

  ["all", "today", "7days", "30days", "thisMonth"].forEach(k => {

function formatCompactDailyTime(str) {
  if (!str || str === "—") return "—";
  try {
    const s = String(str).trim();
    // 檢查是否有包含 HH:mm:ss 或 HH:mm
    const matchTime = s.match(/(?:(?:[0-9]{4}[-/][0-9]{1,2}[-/][0-9]{1,2}\s+)|(?:GMT[+-]\d{4}\s+)?|\b)(\d{1,2}:\d{2}(?::\d{2})?)/);
    if (matchTime) {
      return matchTime[1];
    }
    const d = new Date(s);
    if (!isNaN(d.getTime())) {
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      const ss = String(d.getSeconds()).padStart(2, '0');
      return `${hh}:${mm}:${ss}`;
    }
  } catch(_) {}
  return String(str).length > 8 ? String(str).substring(0, 8) : String(str);
}

function applyStudentDailyFilterAndRender() {
  const allHistory = cachedStudentDailyHistory || [];
  const s = studentDailyFilter.startDate;
  const e = studentDailyFilter.endDate;

  let filtered = allHistory;
  let scopeLabel = "全部歷史紀錄";

  if (studentDailyFilter.type === "today" || (s && e && s === e)) {
    filtered = allHistory.filter(h => (h.date === s));
    scopeLabel = `指定日期：${s}`;
  } else if (s && e) {
    filtered = allHistory.filter(h => (h.date >= s && h.date <= e));
    scopeLabel = `期間：${s} ～ ${e}`;
  } else if (studentDailyFilter.type === "all") {
    filtered = allHistory;
    scopeLabel = "全部歷史紀錄";
  }

  // 1. 更新範圍標籤與筆數
  const scopeTag = document.getElementById("stDailyFilterScopeTag");
  if (scopeTag) scopeTag.textContent = scopeLabel;
  const countTag = document.getElementById("stDailyFilterCountTag");
  if (countTag) countTag.textContent = `共 ${filtered.length} 筆測驗`;

  // 2. 計算 4 大指標（連動更新）
  const completedTests = filtered.filter(h => (h.status && h.status.includes("已完成")) || (h.score && h.score !== "—"));
  const totalCount = completedTests.length;

  let totalAtt = 0;
  let totalCorr = 0;
  let perfectCount = 0;
  const uniqueErrorWords = new Set();

  completedTests.forEach(h => {
    let att = 0;
    let corr = 0;
    if (h.score && h.score.includes("/")) {
      const parts = h.score.split("/");
      corr = parseInt(parts[0]) || 0;
      att = parseInt(parts[1]) || 0;
    } else {
      att = parseInt(h.attempts) || 0;
      corr = parseInt(h.correct) || 0;
    }
    totalAtt += att;
    totalCorr += corr;

    const rateNum = parseFloat(h.rate || h.accuracy) || 0;
    if (rateNum >= 100 || (att > 0 && corr === att)) {
      perfectCount++;
    }

    if (Array.isArray(h.wrongWords)) {
      h.wrongWords.forEach(w => {
        if (w && typeof w === "string" && w.trim()) {
          uniqueErrorWords.add(w.trim().toLowerCase());
        }
      });
    }
  });

  const avgAccPct = totalAtt > 0 ? Math.round((totalCorr / totalAtt) * 100) + "%" : "0%";
  const avgAccVal = totalAtt > 0 ? (totalCorr / totalAtt) * 100 : 0;
  let avgAccColor = "#10b981";
  if (avgAccVal < 60) avgAccColor = "#ef4444";
  else if (avgAccVal < 80) avgAccColor = "#f59e0b";

  const elTotal = document.getElementById("stDailyTotalTests");
  if (elTotal) elTotal.innerText = `${totalCount} 次`;
  const elTotalSub = document.getElementById("stDailyTotalTestsSub");
  if (elTotalSub) elTotalSub.innerText = `測驗總題數 ${totalAtt.toLocaleString()} 題`;

  const elAvg = document.getElementById("stDailyAvgAccuracy");
  if (elAvg) {
    elAvg.innerText = avgAccPct;
    elAvg.style.color = avgAccColor;
  }
  const elAvgSub = document.getElementById("stDailyAvgAccuracySub");
  if (elAvgSub) elAvgSub.innerText = `測驗總答對 ${totalCorr.toLocaleString()} 題`;

  const elPerf = document.getElementById("stDailyPerfectCount");
  if (elPerf) elPerf.innerText = `${perfectCount} 次`;
  const elPerfSub = document.getElementById("stDailyPerfectCountSub");
  if (elPerfSub) {
    const perfectRate = totalCount > 0 ? Math.round((perfectCount / totalCount) * 100) + "%" : "0%";
    elPerfSub.innerText = `滿分達成率 ${perfectRate}`;
  }

  const elErr = document.getElementById("stDailyErrorWordsCount");
  if (elErr) elErr.innerText = `${uniqueErrorWords.size} 個`;
  const elErrSub = document.getElementById("stDailyErrorWordsSub");
  if (elErrSub) elErrSub.innerText = `已納入個人錯題複習庫`;

  // 2.1 更新測驗單字學習進度 PROGRESS 方塊 (比照遊戲學習進度)
  const dailyProgTotalWords = document.getElementById("stDailyProgressTotalWords");
  const dailyBarL = document.getElementById("stDailyBarLearning");
  const dailyBarP = document.getElementById("stDailyBarPracticing");
  const dailyBarM = document.getElementById("stDailyBarMastered");
  const dailyNumL = document.getElementById("stDailyNumLearning");
  const dailyNumP = document.getElementById("stDailyNumPracticing");
  const dailyNumM = document.getElementById("stDailyNumMastered");

  // 從所有已篩選完成的測驗計算不重複單字之熟練表現
  let quizErrorWordsSet = new Set(uniqueErrorWords);
  let quizMasteredCount = 0;
  let quizPracticingCount = 0;
  let quizLearningCount = quizErrorWordsSet.size;

  // 預設或以歷史累計測驗答對情況估算
  if (totalAtt > 0) {
    const totalCorrectWordsEstimate = Math.max(0, totalCorr);
    // 滿分測驗次數視為精通成就
    quizMasteredCount = Math.min(totalCorrectWordsEstimate, perfectCount * 10);
    quizPracticingCount = Math.max(0, totalCorrectWordsEstimate - quizMasteredCount);
  }
  const totalQuizWordsIdentified = quizLearningCount + quizPracticingCount + quizMasteredCount;
  const displayQuizTotal = Math.max(totalQuizWordsIdentified, totalAtt);

  if (dailyProgTotalWords) dailyProgTotalWords.innerText = `共 ${displayQuizTotal.toLocaleString()} 測驗題次`;
  if (dailyNumL) dailyNumL.innerText = quizLearningCount.toLocaleString();
  if (dailyNumP) dailyNumP.innerText = quizPracticingCount.toLocaleString();
  if (dailyNumM) dailyNumM.innerText = quizMasteredCount.toLocaleString();

  if (displayQuizTotal > 0) {
    const pctL = Math.min(100, Math.max(0, (quizLearningCount / displayQuizTotal) * 100)).toFixed(1);
    const pctP = Math.min(100, Math.max(0, (quizPracticingCount / displayQuizTotal) * 100)).toFixed(1);
    const pctM = Math.min(100, Math.max(0, (quizMasteredCount / displayQuizTotal) * 100)).toFixed(1);
    if (dailyBarL) dailyBarL.style.width = pctL + "%";
    if (dailyBarP) dailyBarP.style.width = pctP + "%";
    if (dailyBarM) dailyBarM.style.width = pctM + "%";
  } else {
    if (dailyBarL) dailyBarL.style.width = "0%";
    if (dailyBarP) dailyBarP.style.width = "0%";
    if (dailyBarM) dailyBarM.style.width = "0%";
  }

  // 3. 渲染歷史表格
  const historyContainer = document.getElementById("studentDailyTaskHistoryContainer");
  if (historyContainer) {
    if (filtered.length === 0) {
      historyContainer.innerHTML = `
        <div style="text-align:center; padding:38px 16px; color:var(--text-muted); font-size:13.5px;">
          📌 在【${escapeHtml(scopeLabel)}】範圍內尚無任何指定測驗紀錄。<br>
          <button type="button" class="btn-secondary btn-sm" onclick="setStudentDailyQuickDate('all')" style="margin-top:10px;">
            🔄 查看全部歷史紀錄
          </button>
        </div>
      `;
    } else {
      const rowsHtml = filtered.map(item => {
        const rateStr = formatRatePercentage(item.rate, item.score);
        const rateNum = parseFloat(rateStr) || 0;
        let rateBadgeClass = "score-badge score-low";
        if (rateNum >= 80) rateBadgeClass = "score-badge score-high";
        else if (rateNum >= 60) rateBadgeClass = "score-badge score-mid";

        let statusPillClass = "analytics-status-pill analytics-status-done";
        let statusText = item.status || "已完成";
        if (statusText.includes("作答中")) {
          statusPillClass = "analytics-status-pill analytics-status-doing";
        } else if (statusText.includes("未開始") || statusText === "—") {
          statusPillClass = "analytics-status-pill analytics-status-none";
        }

        let att = 0;
        let corr = 0;
        if (item.score && item.score.includes("/")) {
          const parts = item.score.split("/");
          corr = parseInt(parts[0]) || 0;
          att = parseInt(parts[1]) || 0;
        } else {
          att = parseInt(item.attempts) || 0;
          corr = parseInt(item.correct) || 0;
        }

        const isRowPerfect = (rateNum >= 100) || (att > 0 && corr === att);

        let wrongWordsHtml = "";
        if (Array.isArray(item.wrongWords) && item.wrongWords.length > 0) {
          wrongWordsHtml = item.wrongWords.map(w => {
            const zh = getWordZh(w);
            return `<span class="error-word-tag" style="padding:2px 7px; font-size:11.5px; margin:2px 3px;" title="${zh ? escapeHtml(zh) : ''}">${escapeHtml(w)}${zh ? ` (${escapeHtml(zh)})` : ''}</span>`;
          }).join("");
        } else if (isRowPerfect) {
          wrongWordsHtml = `<span style="color:#10b981; font-weight:700; font-size:12.5px;">✨ 全對滿分</span>`;
        } else {
          wrongWordsHtml = `<span style="color:var(--text-muted); font-size:12px;">無錯題單字紀錄</span>`;
        }

        const compactTime = formatCompactDailyTime(item.updatedAt);
        const scoreDisplay = item.score && item.score.includes('/') ? `${escapeHtml(item.score)} 字` : escapeHtml(item.score || '—');

        return `

            <td style="padding:10px 12px; text-align:center; font-weight:700; color:var(--text); white-space:nowrap;">${scoreDisplay}</td>

            <td style="padding:10px 12px; line-height:1.7;">${wrongWordsHtml}</td>
            <td style="padding:8px 6px; text-align:center; white-space:nowrap; width:85px;">
              <span class="compact-time-badge" style="display:inline-block; padding:3px 7px; border-radius:5px; background:var(--bg-subtle, #f1f5f9); color:var(--text-muted, #475569); font-family:monospace; font-size:11.5px; border:1px solid var(--border, #e2e8f0);" title="交卷完整時間：${escapeHtml(item.updatedAt || '—')}">${escapeHtml(compactTime)}</span>

      historyContainer.innerHTML = `

function fallbackCopyReport(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.left = "-9999px";
  ta.style.top = "-9999px";
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  try {
    document.execCommand("copy");
    showToast("📋 親師成果快報已複製至剪貼簿！可直接貼至 LINE 或親師群組", "success");
  } catch (e) {
    prompt("請按 Ctrl+C 複製以下成果快報文字：", text);
  }
  document.body.removeChild(ta);
}

function renderStudentDailyReportPrintContent(targetStudent, records, scopeLabel) {
  const docEl = document.getElementById("printableStudentDailyReportDocument");
  if (!docEl) return;

  const completed = records.filter(h => (h.status && h.status.includes("已完成")) || (h.score && h.score !== "—"));
  let totalAtt = 0;
  let totalCorr = 0;
  let perfectCount = 0;
  const uniqueErrorWords = new Set();

  completed.forEach(h => {
    let att = 0;
    let corr = 0;
    if (h.score && h.score.includes("/")) {
      const parts = h.score.split("/");
      corr = parseInt(parts[0]) || 0;
      att = parseInt(parts[1]) || 0;
    } else {
      att = parseInt(h.attempts) || 0;
      corr = parseInt(h.correct) || 0;
    }
    totalAtt += att;
    totalCorr += corr;

    const rateNum = parseFloat(h.rate || h.accuracy) || 0;
    if (rateNum >= 100 || (att > 0 && corr === att)) {
      perfectCount++;
    }
    if (Array.isArray(h.wrongWords)) {
      h.wrongWords.forEach(w => {
        if (w && typeof w === "string" && w.trim()) {
          uniqueErrorWords.add(w.trim().toLowerCase());
        }
      });
    }
  });

  const avgAccPct = totalAtt > 0 ? Math.round((totalCorr / totalAtt) * 100) + "%" : "0%";
  const avgAccVal = totalAtt > 0 ? (totalCorr / totalAtt) * 100 : 0;
  const perfectRate = completed.length > 0 ? Math.round((perfectCount / completed.length) * 100) + "%" : "0%";

  let assessmentText = "";
  if (avgAccVal >= 90) {
    assessmentText = "⭐ 測驗整體表現極為優異！單字拼寫精準熟練，聽音辨字反應靈敏，展現高度專注力與紮實的字彙基礎。請持續堅持每日練習，挑戰更高階字彙關卡！";
  } else if (avgAccVal >= 80) {
    assessmentText = "👍 作答表現良好，已具備扎實的常用單字拼讀能力。建議可多針對診斷標記之錯題單字進行複習與弱點強化，整體答對率將能更上一層樓！";
  } else if (avgAccVal >= 60) {
    assessmentText = "💪 具備基礎拼讀能力，作答穩定。建議每天利用個人錯題複習庫多加練習，並多聆聽單字標準發音與例句，逐步提升生字熟練度。";
  } else {
    assessmentText = "💡 目前作答答對率有進步空間。建議調整每日練習節奏，先由基礎單字朗讀與音節拼寫開始練習，持之以恆必能顯著進步！";
  }

  const rowsHtml = records.map((item, idx) => {
    let att = 0;
    let corr = 0;
    if (item.score && item.score.includes("/")) {
      const parts = item.score.split("/");
      corr = parseInt(parts[0]) || 0;
      att = parseInt(parts[1]) || 0;
    } else {
      att = parseInt(item.attempts) || 0;
      corr = parseInt(item.correct) || 0;
    }
    const rateStr = formatRatePercentage(item.rate, item.score);
    const rateNum = parseFloat(rateStr) || 0;
    const isRowPerfect = (rateNum >= 100) || (att > 0 && corr === att);

    let wrongWordsHtml = "";
    if (Array.isArray(item.wrongWords) && item.wrongWords.length > 0) {
      wrongWordsHtml = item.wrongWords.map(w => {
        const zh = getWordZh(w);
        return `<span style="display:inline-block; background:#fee2e2; color:#991b1b; border:1px solid #fca5a5; padding:1px 6px; border-radius:4px; font-size:11px; margin:2px 3px; font-weight:600;">${escapeHtml(w)}${zh ? ` (${escapeHtml(zh)})` : ''}</span>`;
      }).join("");
    } else if (isRowPerfect) {
      wrongWordsHtml = `<span style="color:#059669; font-weight:bold; font-size:11.5px;">✨ 全對滿分</span>`;
    } else {
      wrongWordsHtml = `<span style="color:#64748b; font-size:11px;">無錯題單字紀錄</span>`;
    }

    const compactTime = formatCompactDailyTime(item.updatedAt);
    const scoreDisplay = item.score && item.score.includes('/') ? `${escapeHtml(item.score)} 題` : escapeHtml(item.score || '—');

    return `
      <tr style="border-bottom:1px solid #e2e8f0; ${idx % 2 === 1 ? 'background:#f8fafc;' : ''}">
        <td style="padding:8px 10px; font-weight:bold; white-space:nowrap; text-align:center;">${escapeHtml(item.date || '—')}</td>
        <td style="padding:8px 10px; font-size:12px;">${escapeHtml(item.taskName || '每日指定測驗')}</td>

        <td style="padding:8px 10px; text-align:center; font-size:11.5px; white-space:nowrap;">${escapeHtml(item.status || '已完成')}</td>
        <td style="padding:8px 10px; line-height:1.5;">${wrongWordsHtml}</td>
        <td style="padding:8px 6px; text-align:center; font-size:11px; font-family:monospace; color:#475569; white-space:nowrap; width:80px;" title="交卷完整時間：${escapeHtml(item.updatedAt || '—')}">${escapeHtml(compactTime)}</td>
      </tr>
    `;
  }).join("");

  const studentNameDisplay = studentRealName ? `${targetStudent} (${studentRealName})` : targetStudent;
  const printTimeStr = new Date().toLocaleString("zh-TW", { hour12: false });

  docEl.innerHTML = `
    <!-- 報表主標頭 -->
    <div style="border-bottom:2.5px solid #0f172a; padding-bottom:14px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:10px;">
      <div>
        <div style="font-size:12px; font-weight:700; color:#4f46e5; letter-spacing:0.5px; text-transform:uppercase; margin-bottom:2px;">
          ENGLISH VOCABULARY 2000 LEARNING SYSTEM
        </div>
        <h1 style="margin:0; font-size:22px; color:#0f172a; font-weight:800; display:flex; align-items:center; gap:8px;">
          <span>🎯 學生每日指定單字測驗作答明細報告</span>
        </h1>
        <div style="font-size:12.5px; color:#64748b; margin-top:2px;">
          每日單字聽拼測驗成果紀錄、錯題弱點診斷與評量報告書
        </div>
      </div>
      <div style="text-align:right; font-size:12px; color:#64748b; line-height:1.6;">
        <div>製表日期：<strong style="color:#0f172a;">${printTimeStr}</strong></div>
        <div>報表範圍：<strong style="color:#4f46e5;">${escapeHtml(scopeLabel)}</strong></div>
      </div>
    </div>

    <!-- 學生基本資訊橫條 -->
    <div style="background:#f1f5f9; border:1px solid #cbd5e1; border-radius:8px; padding:10px 16px; margin-bottom:16px; display:grid; grid-template-columns:repeat(auto-fit, minmax(160px, 1fr)); gap:12px; font-size:12.5px;">
      <div>學生帳號/姓名：<strong style="color:#0f172a; font-size:13.5px;">${escapeHtml(studentNameDisplay)}</strong></div>
      <div>所屬班級：<strong style="color:#0f172a;">${escapeHtml(studentMyClass || '未分班')}</strong></div>
      <div>測驗完成次數：<strong style="color:#4f46e5;">${completed.length} 次</strong></div>
      <div>平均測驗正確率：<strong style="color:${avgAccVal >= 80 ? '#059669' : '#d97706'}; font-size:13.5px;">${avgAccPct}</strong></div>
    </div>

    <!-- 4 大 KPI 統計方塊 -->
    <div style="display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin-bottom:18px;">
      <div style="border:1.5px solid #cbd5e1; border-left:4px solid #4f46e5; border-radius:8px; padding:10px 12px; background:#ffffff;">
        <div style="font-size:11.5px; color:#64748b; font-weight:600;">📝 累計完成測驗</div>
        <div style="font-size:18px; font-weight:800; color:#4f46e5; margin:2px 0;">${completed.length} 次</div>
        <div style="font-size:10.5px; color:#64748b;">測驗總題數 ${totalAtt} 題</div>
      </div>
      <div style="border:1.5px solid #cbd5e1; border-left:4px solid #059669; border-radius:8px; padding:10px 12px; background:#ffffff;">
        <div style="font-size:11.5px; color:#64748b; font-weight:600;">📊 測驗平均正確率</div>
        <div style="font-size:18px; font-weight:800; color:#059669; margin:2px 0;">${avgAccPct}</div>
        <div style="font-size:10.5px; color:#64748b;">測驗總答對 ${totalCorr} 題</div>
      </div>
      <div style="border:1.5px solid #cbd5e1; border-left:4px solid #d97706; border-radius:8px; padding:10px 12px; background:#ffffff;">
        <div style="font-size:11.5px; color:#64748b; font-weight:600;">🏆 滿分次數</div>
        <div style="font-size:18px; font-weight:800; color:#d97706; margin:2px 0;">${perfectCount} 次</div>

      </div>
      <div style="border:1.5px solid #cbd5e1; border-left:4px solid #dc2626; border-radius:8px; padding:10px 12px; background:#ffffff;">

    <!-- 歷次測驗明細表格 -->

      <table style="width:100%; border-collapse:collapse; font-size:12px; border:1px solid #cbd5e1; background:#ffffff;">

    <!-- 學習診斷分析與評語 -->

    <!-- 簽核欄位 (防跨頁斷裂) -->

// 班內排名與榮譽榜模組 (Class Leaderboard)
// ════════════════════════════════════════
function updateLeaderboardUI(leaderboardData) {
  if (!leaderboardData) return;
  currentLeaderboard = leaderboardData;
  const isClassMode = (leaderboardData.mode !== "all");
  cachedLeaderboards[isClassMode ? "class" : "all"] = leaderboardData;
  const total = leaderboardData.totalStudents || 0;
  const totalBadge = document.getElementById("rankingTotalBadge");
  if (totalBadge) {
    totalBadge.textContent = isClassMode ? `全班 ${total} 人` : `全校跨班 ${total} 人`;
  }
  const classBadge = document.getElementById("rankingClassBadge");
  if (classBadge) {
    classBadge.textContent = isClassMode ? (leaderboardData.myClass || "本班") : "🌐 全校跨班";
  }
  const btnClass = document.getElementById("lbScopeClass");
  const btnAll = document.getElementById("lbScopeAll");
  if (btnClass) btnClass.classList.toggle("active", isClassMode);
  if (btnAll) btnAll.classList.toggle("active", !isClassMode);

  const myRanks = leaderboardData.myRanks || {};

  // 1. 更新個人 5 大名次徽章
  const updateChip = (key, rankId, prId) => {
    const info = myRanks[key] || { rank: "-", pr: "-", val: 0 };
    const rEl = document.getElementById(rankId);
    const prEl = document.getElementById(prId);
    if (rEl) {
      rEl.textContent = info.rank !== "-" ? `第 ${info.rank} 名` : "-";
      rEl.className = `chip-rank ${info.rank === 1 ? "top-1" : (info.rank === 2 ? "top-2" : (info.rank === 3 ? "top-3" : ""))}`;
    }
    if (prEl) {
      prEl.textContent = info.pr !== "-" ? `PR ${info.pr}` : "PR -";
    }
  };

  updateChip("mastered", "myRankMastered", "myPrMastered");
  updateChip("score",    "myRankScore",    "myPrScore");
  updateChip("attempts", "myRankAttempts", "myPrAttempts");
  updateChip("streak",   "myRankStreak",   "myPrStreak");
  updateChip("accuracy", "myRankAccuracy", "myPrAccuracy");

  // 2. 激勵性標語
  const bannerMsgEl = document.getElementById("rankingBannerMsg");
  if (bannerMsgEl) {
    let bestDimension = "mastered";
    let minRank = 9999;
    let maxPr = 0;
    const dimNames = {
      mastered: "精通單字榜",
      score: "學習積分榜",
      attempts: "累積作答榜",
      streak: "連續打卡榜",
      accuracy: "答題準度榜"
    };

    for (const k in myRanks) {
      const r = myRanks[k].rank;
      const p = myRanks[k].pr;
      if (typeof r === "number" && r < minRank) {
        minRank = r;
        bestDimension = k;
        maxPr = p;
      }
    }

    const scopeWord = isClassMode ? "全班" : "全校";
    if (minRank === 1) {
      bannerMsgEl.innerHTML = `👑 <strong>榮耀登頂！</strong>你在【${dimNames[bestDimension]}】勇奪<strong>${scopeWord}第 1 名</strong>，領跑全體！繼續保持榮耀！`;
    } else if (minRank <= 3) {
      bannerMsgEl.innerHTML = `🏅 <strong>榮登頒獎台！</strong>你在【${dimNames[bestDimension]}】位居<strong>${scopeWord}第 ${minRank} 名</strong>（PR ${maxPr}），表現出類拔萃！`;
    } else if (maxPr >= 80) {
      bannerMsgEl.innerHTML = `🌟 <strong>表現名列前茅！</strong>你在【${dimNames[bestDimension]}】位列${scopeWord}前 ${Math.max(1, 100 - maxPr)}%（第 ${minRank} 名），穩居學霸前段班！`;
    } else if (maxPr >= 50) {
      bannerMsgEl.innerHTML = `🚀 <strong>穩步超越晉升！</strong>你在【${dimNames[bestDimension]}】名列第 ${minRank} 名，已超越半數同學，向更高名次發起衝刺！`;
    } else {
      bannerMsgEl.innerHTML = `🌱 <strong>累積蓄力起步！</strong>每天堅持練習 10~15 題，名次與 PR 百分位將迅速向上攀升！`;
    }
  }

  // 3. 渲染頒獎台與表格
  renderPodiumAndTable();
}

function switchRankingTab(tabName) {
  currentRankingTab = tabName;
  document.querySelectorAll(".ranking-tab-btn").forEach(btn => btn.classList.remove("active"));
  const targetBtn = document.getElementById(`rtab-${tabName}`);
  if (targetBtn) targetBtn.classList.add("active");

  renderPodiumAndTable();
}

function toggleMaskNames(checked) {
  isMaskNames = checked;
  renderPodiumAndTable();
}

function renderPodiumAndTable() {
  if (!currentLeaderboard || !currentLeaderboard.rankings) return;
  const rankList = currentLeaderboard.rankings[currentRankingTab] || [];
  const tab = currentRankingTab;

  const metricHeaderLabels = {
    mastered: "精通單字數",
    score: "學習積分",
    attempts: "累積作答題數",
    streak: "連續打卡天數",
    accuracy: "綜合答題正確率"
  };
  const metricUnits = {
    mastered: " 個",
    score: " 分",
    attempts: " 題",
    streak: " 天",
    accuracy: "%"
  };

  const headerEl = document.getElementById("lbMetricHeader");
  if (headerEl) headerEl.textContent = metricHeaderLabels[tab] || "數值";

  // ── A. 渲染 Top 3 頒獎台 ──
  const podiumStage = document.getElementById("podiumStage");
  if (podiumStage) {
    const top1 = rankList.find(r => r.rank === 1);
    const top2 = rankList.find(r => r.rank === 2);
    const top3 = rankList.find(r => r.rank === 3);

    const getDisplayName = item => {
      if (!item) return "虛位以待";
      const classTag = item.className ? `[${item.className}] ` : "";
      if (item.isMe) {
        const myName = item.realName ? `${item.username} (${item.realName})` : item.username;
        return `${classTag}${myName} (你)`;
      }
      const raw = isMaskNames
        ? (item.maskedName || item.username)
        : (item.realName ? `${item.username} (${item.realName})` : item.username);
      return classTag + raw;
    };
    const getValText = item => {
      if (!item) return "-";
      return (tab === "accuracy" ? `${item.val}%` : `${item.val.toLocaleString()}${metricUnits[tab]}`);
    };

    podiumStage.innerHTML = `
      <!-- 第 2 名 (左側) -->
      <div class="podium-slot ${top2 && top2.isMe ? "is-me" : ""}">
        <div class="podium-avatar">🥈</div>
        <div class="podium-name" title="${top2 ? escapeHtml(top2.username) : ''}">${escapeHtml(getDisplayName(top2))}</div>
        <div class="podium-val">${getValText(top2)}</div>
        <div class="podium-block rank-2nd">2</div>
      </div>

      <!-- 第 1 名 (中間，榮耀之巔) -->
      <div class="podium-slot ${top1 && top1.isMe ? "is-me" : ""}">
        <div class="podium-avatar">
          <span class="podium-crown">👑</span>
          🥇
        </div>
        <div class="podium-name" title="${top1 ? escapeHtml(top1.username) : ''}">${escapeHtml(getDisplayName(top1))}</div>
        <div class="podium-val">${getValText(top1)}</div>
        <div class="podium-block rank-1st">1</div>
      </div>

      <!-- 第 3 名 (右側) -->
      <div class="podium-slot ${top3 && top3.isMe ? "is-me" : ""}">
        <div class="podium-avatar">🥉</div>
        <div class="podium-name" title="${top3 ? escapeHtml(top3.username) : ''}">${escapeHtml(getDisplayName(top3))}</div>
        <div class="podium-val">${getValText(top3)}</div>
        <div class="podium-block rank-3rd">3</div>
      </div>
    `;
  }

  // ── B. 渲染完整排行榜表格 ──
  const tbody = document.getElementById("leaderboardTableBody");
  if (tbody) {
    if (rankList.length === 0) {
      tbody.innerHTML = `<tr><td colspan="5" style="padding: 24px; color: var(--text-muted);">尚無排名數據</td></tr>`;
      return;
    }

    let rowsHtml = "";
    rankList.forEach((item, idx) => {
      const isMe = item.isMe;
      const rank = item.rank;
      let rankDisplay = `#${rank}`;
      if (rank === 1) rankDisplay = `<span class="rank-medal-badge" style="background:#fef08a; color:#854d0e;">🥇</span>`;
      else if (rank === 2) rankDisplay = `<span class="rank-medal-badge" style="background:#e2e8f0; color:#334155;">🥈</span>`;
      else if (rank === 3) rankDisplay = `<span class="rank-medal-badge" style="background:#ffedd5; color:#9a3412;">🥉</span>`;

      const classTagHtml = item.className ? `<span class="class-tag">${escapeHtml(item.className)}</span>` : "";
      const rawDisplay = isMaskNames
        ? (item.maskedName || item.username)
        : (item.realName ? `${escapeHtml(item.username)} (${escapeHtml(item.realName)})` : escapeHtml(item.username));
      const myName = item.realName ? `${escapeHtml(item.username)} (${escapeHtml(item.realName)})` : escapeHtml(item.username);
      const displayName = isMe ? `${classTagHtml}${myName} <span style="color:var(--primary); font-size:11px;">(你)</span>`
                               : `${classTagHtml}${rawDisplay}`;

      const valFormatted = (tab === "accuracy" ? `${item.val}%` : `${item.val.toLocaleString()}${metricUnits[tab]}`);

      // PR Badge 色彩
      let prClass = "pr-pill";
      if (item.pr >= 80) prClass += " high";
      else if (item.pr >= 50) prClass += " mid";

      // 追趕目標 (與前一名的差距)
      let gapHtml = "";
      if (idx === 0 || rank === 1) {
        gapHtml = `<span class="gap-badge leader">👑 榜首領先</span>`;
      } else {
        const prevItem = rankList[idx - 1];
        const diff = (prevItem.val - item.val);
        if (diff <= 0) {
          gapHtml = `<span class="gap-badge" style="color:var(--success);">並列同名</span>`;
        } else {
          const diffText = (tab === "accuracy" ? `${diff.toFixed(1)}%` : `${diff.toLocaleString()}${metricUnits[tab]}`);
          gapHtml = `<span class="gap-badge chasing">差 +${diffText} 追平</span>`;
        }
      }

      rowsHtml += `
        <tr class="${isMe ? "row-me" : ""}">
          <td>${rankDisplay}</td>
          <td style="text-align: left; padding-left: 14px; font-weight: ${isMe ? "800" : "500"};">${displayName}</td>
          <td style="font-weight: 700; color: ${isMe ? "var(--primary)" : "var(--text)"};">${valFormatted}</td>
          <td><span class="${prClass}">PR ${item.pr}</span></td>
          <td>${gapHtml}</td>
        </tr>
      `;
    });

    tbody.innerHTML = rowsHtml;
  }
}

function switchLeaderboardScope(mode) {
  leaderboardScope = mode;
  document.getElementById("lbScopeClass")?.classList.toggle("active", mode === "class");
  document.getElementById("lbScopeAll")?.classList.toggle("active", mode === "all");

  // 效能優化：若前端快取已有此維度榜單，直接瞬間切換顯示，0ms 零延遲且免發送 API 呼叫
  if (cachedLeaderboards && cachedLeaderboards[mode]) {
    updateLeaderboardUI(cachedLeaderboards[mode]);
    return;
  }
  refreshLeaderboard(false);
}

function refreshLeaderboard(force = false) {
  const targetStudent = viewingStudent || currentUser;
  if (!targetStudent) return;
  if (force && cachedLeaderboards) {
    cachedLeaderboards[leaderboardScope] = null;
  }
  google.script.run
    .withSuccessHandler(resp => {
      if (resp && resp.status === "success" && resp.leaderboard) {
        updateLeaderboardUI(resp.leaderboard);
        showToast(leaderboardScope === "all" ? "已更新【全校跨班】排名！" : "已更新【本班】排名！", "success");
      }
    })
    .getStudentLeaderboard({
      username: currentUser,
      password: currentPass,
      targetStudent: viewingStudent || undefined,
      mode: leaderboardScope,
      forceRefresh: force
    });
}

function analyzeErrorTag(word, zh, ph) {
  const w = String(word || "").toLowerCase();
  const z = String(zh || "").toLowerCase();
  const posMatches = z.match(/\b(n|v|vt|vi|adj|adv|prep|conj|pron|phr)\b/g);
  if (posMatches && new Set(posMatches).size >= 2) {
    return { tag: "多詞性混淆", cls: "tag-pos", icon: "🏷️" };
  }
  if (/(ea|ee|ie|ei|ou|ow|au|aw|ai|ay|oa|oo|oi|oy)/.test(w)) {
    return { tag: "母音/音標易混", cls: "tag-vowel", icon: "🔊" };
  }
  if (/([a-z])\1/.test(w) || w.length >= 8) {
    return { tag: "雙重字母/長詞", cls: "tag-spelling", icon: "🔤" };
  }
  if (/(tion|sion|ment|able|ible|ence|ance|ful|less)$/.test(w)) {
    return { tag: "字尾詞綴弱點", cls: "tag-affix", icon: "🧩" };
  }
  return { tag: "拼字形近弱點", cls: "tag-spelling", icon: "⚠️" };
}

function initStudentWeakWordsCard() {
  const sec = document.getElementById("studentWeakWordsCard");
  const container = document.getElementById("st-weak-words-container");
  const toggleBtn = document.getElementById("btn-toggle-st-weak-words-card");
  if (!sec || !toggleBtn) return;

  let currentRange = "7";

  function getWeakWordsForRange(range) {
    const now = Date.now();
    const days = range === "all" ? 9999 : parseInt(range, 10);
    const cutoffDate = new Date(now - days * 86400000).toISOString().split("T")[0];
    
    const wordCounts = new Map();
    const historyList = cachedStudentDailyHistory || [];
    historyList.forEach(item => {
      const d = String(item.date || "").trim().split(/[T\s]/)[0].replace(/\//g, "-");
      if (range === "all" || d >= cutoffDate) {
        if (Array.isArray(item.wrongWords)) {
          item.wrongWords.forEach(w => {
            const cleanW = String(w).trim().toLowerCase();
            if (cleanW) wordCounts.set(cleanW, (wordCounts.get(cleanW) || 0) + 1);
          });
        }
      }
    });

    if (range === "all" && Array.isArray(rawWordList)) {
      rawWordList.forEach(w => {
        if (w && w.wrong > 0) {
          const cleanW = String(w.word || "").toLowerCase();
          wordCounts.set(cleanW, Math.max(wordCounts.get(cleanW) || 0, w.wrong));
        }
      });
    }

    const list = [];
    wordCounts.forEach((count, word) => {
      // ★ 核心新規範：累積答錯 ≥ 2 次才正式列入常錯清單（排除手滑粗心）
      if (count < 2) return;
      const zh = (typeof getWordZh === "function") ? getWordZh(word) : "";
      const lv = (typeof getWordLevelNumber === "function") ? getWordLevelNumber(word) : 1;
      list.push({ word, count, zh, level: lv });
    });

    list.sort((a, b) => b.count - a.count || a.word.localeCompare(b.word));
    return list;
  }

  function renderWeakWordsUI() {
    const list = getWeakWordsForRange(currentRange);
    const badge = document.getElementById("st-weak-words-count-badge");
    if (badge) {
      badge.style.display = "none";
    }

    const statText = document.getElementById("st-weak-words-stat-text");
    const rangeLabel = document.getElementById("st-weak-words-filter-label");
    const rangeName = currentRange === "7" ? "近 7 天" : (currentRange === "14" ? "近 14 天" : (currentRange === "30" ? "近 30 天" : "全部歷史"));
    if (rangeLabel) rangeLabel.textContent = `${rangeName}統計`;

    const totalErrors = list.reduce((sum, item) => sum + item.count, 0);
    if (statText) {
      if (list.length === 0) {
        statText.innerHTML = `🎉 <strong>太棒了！</strong> 此期間內沒有任何常錯單字。`;
      } else {
        statText.innerHTML = `📊 共 <strong>${list.length}</strong> 個常錯單字 ｜ 累計失誤 <strong>${totalErrors}</strong> 次`;
      }
    }

    const grid = document.getElementById("st-weak-words-grid");
    if (!grid) return;
    if (list.length === 0) {
      grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:24px; color:var(--text-muted); font-size:13.5px;">✨ 目前此區間零錯題紀錄，繼續保持！</div>`;
      return;
    }

    let html = "";
    list.forEach(item => {
      html += `
        <div class="weak-card-item">
          <div class="weak-card-top">
            <span class="weak-word-title">${item.word}</span>
            <span class="weak-err-badge">錯 ${item.count} 次</span>
          </div>
          <div class="weak-tag-badge ${item.tagCls}">${item.tagIcon} ${item.tag}</div>
          <div class="weak-card-zh">${item.zh || "（無釋義）"}</div>
          <div class="weak-card-sub">
            <span>LEVEL ${item.level}</span>
            <button type="button" class="word-speech-btn" onclick="event.stopPropagation(); speakMasteredWord('${item.word}')" style="padding:2px 6px; cursor:pointer;" title="播放發音">${SVG_SPEAKER}</button>
          </div>
        </div>
      `;
    });
    grid.innerHTML = html;
  }

  toggleBtn.onclick = (e) => {
    e.preventDefault();
    const isHidden = (container && container.style.display === "none") || sec.classList.contains("is-collapsed");
    if (isHidden) {
      if (container) container.style.display = "block";
      sec.classList.remove("is-collapsed");
      toggleBtn.innerHTML = "收合";
      renderWeakWordsUI();
      sec.scrollIntoView({ behavior: "smooth", block: "nearest" });
    } else {
      if (container) container.style.display = "none";
      sec.classList.add("is-collapsed");
      toggleBtn.innerHTML = "展開";
    }
  };

  const tabWrap = document.getElementById("st-weak-range-tabs");
  if (tabWrap) {
    tabWrap.querySelectorAll(".tab-btn").forEach(btn => {
      btn.onclick = () => {
        tabWrap.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentRange = btn.getAttribute("data-range") || "7";
        renderWeakWordsUI();
      };
    });
  }

  const btnCopy = document.getElementById("btn-st-copy-weak-words");
  if (btnCopy) {
    btnCopy.onclick = () => {
      const list = getWeakWordsForRange(currentRange);
      if (list.length === 0) { showToast("此區間尚無常錯單字可複製。", "warning"); return; }
      const rangeName = currentRange === "7" ? "近 7 天" : (currentRange === "14" ? "近 14 天" : (currentRange === "30" ? "近 30 天" : "全部歷史"));
      let text = `【📝 個人常錯單字複習卡 (${rangeName})】\n`;
      list.forEach((item, idx) => {
        text += `${idx + 1}. ${item.word} [L${item.level}] - ${item.zh || ""} (失誤 ${item.count} 次)\n`;
      });
      navigator.clipboard.writeText(text).then(() => {
        showToast("📋 已成功複製常錯單字清單！可直接貼上複習。", "success");
      }).catch(() => {
        prompt("請按 Ctrl+C 複製單字：", text);
      });
    };
  }

  const btnExcel = document.getElementById("btn-st-export-weak-excel");
  if (btnExcel) {
    btnExcel.onclick = () => {
      const list = getWeakWordsForRange(currentRange);
      if (list.length === 0) { showToast("此區間尚無常錯單字可匯出。", "warning"); return; }
      if (typeof XLSX === "undefined") { showToast("Excel 模組載入中，請稍候再試。", "warning"); return; }
      const rows = [["序號", "英文單字", "中文釋義", "難度關卡", "失誤次數"]];
      list.forEach((item, idx) => {
        rows.push([idx + 1, item.word, item.zh || "", "Level " + item.level, item.count]);
      });
      const ws = XLSX.utils.aoa_to_sheet(rows);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "常錯單字表");
      XLSX.writeFile(wb, `常錯單字複習卡_${new Date().toISOString().split("T")[0]}.xlsx`);
    };
  }

  const btnPdf = document.getElementById("btn-st-export-weak-pdf");
  if (btnPdf) {
    btnPdf.onclick = () => {
      const list = getWeakWordsForRange(currentRange);
      if (list.length === 0) { showToast("此區間尚無常錯單字可匯出。", "warning"); return; }
      if (typeof html2pdf === "undefined") { showToast("PDF 模組載入中，請稍候再試。", "warning"); return; }
      const rangeName = currentRange === "7" ? "近 7 天" : (currentRange === "14" ? "近 14 天" : (currentRange === "30" ? "近 30 天" : "全部歷史"));
      const printDiv = document.createElement("div");
      printDiv.style.padding = "24px";
      printDiv.style.fontFamily = "system-ui, sans-serif";
      printDiv.innerHTML = `
        <h2 style="text-align:center; color:#232A4D; margin-bottom:6px;">🎯 英文個人常錯單字複習小卡</h2>
        <div style="text-align:center; font-size:12px; color:#5A6183; margin-bottom:18px;">統計範圍：${rangeName} ｜ 產生日期：${new Date().toLocaleDateString()} ｜ 共 ${list.length} 個弱點單字</div>
        <table style="width:100%; border-collapse:collapse; font-size:13px; page-break-inside:auto!important; break-inside:auto!important;">
          <thead>
            <tr style="background:#F1F5F9; border-bottom:2px solid #CBD5E1;">
              <th style="padding:8px; text-align:center; width:40px;">#</th>
              <th style="padding:8px; text-align:left; width:130px;">單字</th>
              <th style="padding:8px; text-align:left; width:180px;">中文釋義</th>
              <th style="padding:8px; text-align:center; width:70px;">關卡</th>
              <th style="padding:8px; text-align:center; width:80px;">失誤次數</th>
            </tr>
          </thead>
          <tbody>
            ${list.map((item, idx) => `
              <tr style="border-bottom:1px solid #E2E8F0;">
                <td style="padding:8px; text-align:center; color:#64748B;">${idx + 1}</td>
                <td style="padding:8px; font-weight:bold; color:#1E293B;">${item.word}</td>
                <td style="padding:8px; color:#334155;">${item.zh || "—"}</td>
                <td style="padding:8px; text-align:center; font-size:11px; font-weight:700;"><span style="background:#F3E8FF; color:#7E22CE; padding:2px 6px; border-radius:4px; border:1px solid #E9D5FF;">${item.tagIcon} ${item.tag}</span></td>
                <td style="padding:8px; text-align:center; font-size:11px;">L${item.level}</td>
                <td style="padding:8px; text-align:center; color:#DC2626; font-weight:bold;">${item.count}次</td>
              </tr>
            `).join("")}
          </tbody>
        </table>
      `;
      html2pdf().from(printDiv).set({
        margin: [10, 10, 10, 10],
        filename: `常錯單字複習卡_${new Date().toISOString().split("T")[0]}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2, useCORS: true },
        jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
        pagebreak: { mode: ['css', 'legacy'] }
      }).save();
    };
  }

  renderWeakWordsUI();
}


function toggleImmersiveFullscreen() {
  const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement || document.body.classList.contains("css-fullscreen-active"));
  const btn = document.getElementById("btnFullscreenToggle");

  if (!isFull) {
    const docEl = document.documentElement;
    if (docEl.requestFullscreen) {
      docEl.requestFullscreen().catch(() => {
        document.body.classList.add("css-fullscreen-active");
      });
    } else if (docEl.webkitRequestFullscreen) {
      docEl.webkitRequestFullscreen();
    } else {
      document.body.classList.add("css-fullscreen-active");
    }
    if (btn) btn.innerHTML = "🗗 還原";
  } else {
    if (document.exitFullscreen) {
      document.exitFullscreen().catch(() => {});
    } else if (document.webkitExitFullscreen) {
      document.webkitExitFullscreen();
    }
    document.body.classList.remove("css-fullscreen-active");
    if (btn) btn.innerHTML = "⛶ 全螢幕";
  }
}

document.addEventListener("fullscreenchange", () => {
  const isFull = !!(document.fullscreenElement || document.webkitFullscreenElement);
  const btn = document.getElementById("btnFullscreenToggle");
  if (!isFull) {
    document.body.classList.remove("css-fullscreen-active");
    if (btn) btn.innerHTML = "⛶ 全螢幕";
  } else {
    if (btn) btn.innerHTML = "🗗 還原";
  }
});
