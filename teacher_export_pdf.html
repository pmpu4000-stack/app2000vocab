<script>
function openPrintReportModal() {
  if (!fullProcessedData || fullProcessedData.length === 0) {
    showToast("目前尚無學習歷程資料可供產出報告，請先查詢或同步資料。", "danger");
    return;
  }
  const modal = document.getElementById("printReportModal");
  if (!modal) return;

  const targetStudent = viewingStudent || currentUser || "學生";
  const nameLabel = document.getElementById("reportToolbarStudentName");
  if (nameLabel) nameLabel.textContent = `學生：${targetStudent}`;

  // 產出報告內容
  renderPrintReportContent(targetStudent);

  document.body.classList.add("modal-report-open");
  modal.classList.add("open");
}

function closePrintReportModal() {
  const modal = document.getElementById("printReportModal");
  if (modal) modal.classList.remove("open");
  document.body.classList.remove("modal-report-open");
}

function printReportDocument() {
  document.body.classList.add("modal-report-open");
  // 稍候 50ms 確保瀏覽器重新計算佈局並渲染完成後再啟動列印對話框
  setTimeout(() => {
    window.print();
  }, 50);
}

// 監聽列印事件，保證從任何途徑 (按鈕或 Ctrl+P) 呼叫時都能正確套用報告書列印模式
window.addEventListener("beforeprint", () => {
  const modal = document.getElementById("printReportModal");
  if (modal && modal.classList.contains("open")) {
    document.body.classList.add("modal-report-open");
  }
  const dailyModal = document.getElementById("studentDailyTaskReportModal");
  if (dailyModal && dailyModal.classList.contains("open")) {
    document.body.classList.add("modal-daily-report-open");
  }
});
window.addEventListener("afterprint", () => {
  const modal = document.getElementById("printReportModal");
  if (!modal || !modal.classList.contains("open")) {
    document.body.classList.remove("modal-report-open");
  }
  const dailyModal = document.getElementById("studentDailyTaskReportModal");
  if (!dailyModal || !dailyModal.classList.contains("open")) {
    document.body.classList.remove("modal-daily-report-open");
  }
});

function handlePrintReportModalBackdropClick(e) {
  if (e.target === document.getElementById("printReportModal")) {
    closePrintReportModal();
  }
}

function toggleEditTeacherComment() {
  const sec = document.getElementById("teacherCommentEditSection");
  if (!sec) return;
  const isHidden = sec.style.display === "none";
  sec.style.display = isHidden ? "block" : "none";
  if (isHidden) {
    const input = document.getElementById("teacherCommentInput");
    if (!input.value) {
      const curTextEl = document.getElementById("reportCommentText");
      if (curTextEl) input.value = curTextEl.textContent.trim();
    }
    input.focus();
  }
}

function saveCustomComment() {
  const input = document.getElementById("teacherCommentInput");
  if (input) {
    customTeacherComment = input.value.trim();
    const commentEl = document.getElementById("reportCommentText");
    if (commentEl) commentEl.textContent = customTeacherComment || getDefaultComment();
  }
  const sec = document.getElementById("teacherCommentEditSection");
  if (sec) sec.style.display = "none";
}

function resetDefaultComment() {
  customTeacherComment = "";
  const input = document.getElementById("teacherCommentInput");
  const def = getDefaultComment();
  if (input) input.value = def;
  const commentEl = document.getElementById("reportCommentText");
  if (commentEl) commentEl.textContent = def;
}

function getDefaultComment(tierGrade, latest) {
  const mastered = latest ? (latest.mastered || 0) : 0;
  if (tierGrade === "A+") {
    return `該生在單字學習歷程中展現卓越的學習成效，綜合正確率與題量皆達頂尖水準（已精通 ${mastered} 個核心字彙），學習自律性高且持續力佳，建議持續向更高階單字與閱讀實戰挑戰！`;
  } else if (tierGrade === "A") {
    return `該生學習表現精熟優秀，各難度掌握度均衡穩健（累積精通 ${mastered} 個單字），平日作答維持高水準答對率。建議可適度提升進階題型作答速度，鞏固詞彙深度應用。`;
  } else if (tierGrade === "B") {
    return `該生學習態度穩定積極，在基礎詞彙掌握上循序漸進。建議針對錯題與易混淆單字定期安排回顧複習，並提高每日打卡練習題數，定能取得更顯著的突破！`;
  } else {
    return `該生已邁出良好學習起點，建議建立每日定時練習的好習慣（每次 10~15 題），多運用間隔記憶法反覆加強基礎 LEVEL 1~2 單字，穩步積累詞彙實力！`;
  }
}

function renderPrintReportContent(targetStudent) {
  const docEl = document.getElementById("printableReportDocument");
  if (!docEl || !fullProcessedData || fullProcessedData.length === 0) return;

  const latest = fullProcessedData[0];
  const earliest = fullProcessedData[fullProcessedData.length - 1];

  // 1. 基礎資訊
  const now = new Date();
  const reportDateStr = formatDateYMD(now);
  const nowTimeStr = now.toLocaleTimeString("zh-TW", { hour: "2-digit", minute: "2-digit", hour12: false });
  const startDate = document.getElementById("startDate").value;
  const endDate   = document.getElementById("endDate").value;
  let dateRangeStr = "";
  if (startDate || endDate) {
    dateRangeStr = `${startDate || earliest.date} 至 ${endDate || latest.date} (自訂選取區間)`;
  } else {
    dateRangeStr = `${earliest.date} 至 ${latest.date} (全部歷程，共 ${fullProcessedData.length} 筆備份)`;
  }

  // 2. 累計與區間量化
  const cumMastered = latest.mastered || 0;
  const cumAttempts = latest.cumAttempts || 0;
  const cumCorrect  = latest.cumCorrect || 0;
  const cumAccuracy = latest.accuracyStr || "0%";
  const cumScore    = (latest.score && latest.score.cum !== undefined) ? latest.score.cum : 0;
  const distWords   = (latest.distWord && latest.distWord.cum !== undefined) ? latest.distWord.cum : 0;
  const learningCount = latest.learning || 0;
  const practicingCount = latest.practicing || 0;

  // 區間統計 (從 lastFilteredData)
  let pAttempts = 0, pCorrect = 0, pScore = 0;
  const dataList = (lastFilteredData && lastFilteredData.length > 0) ? lastFilteredData : fullProcessedData;
  dataList.forEach(r => {
    pAttempts += r.dailyAttempts || 0;
    pCorrect  += r.dailyCorrect || 0;
    pScore    += (r.score && r.score.daily !== undefined) ? r.score.daily : 0;
  });
  const pAcc = pAttempts > 0 ? ((pCorrect / pAttempts) * 100).toFixed(1) + "%" : "0%";

  // Streak & 打卡
  const hmStreakEl = document.getElementById("hmCurrentStreak");
  const curStreak = hmStreakEl ? (parseInt(hmStreakEl.textContent) || 0) : 0;
  const hmMaxStreakEl = document.getElementById("hmMaxStreak");
  const maxStreak = hmMaxStreakEl ? (parseInt(hmMaxStreakEl.textContent) || curStreak) : curStreak;
  const hmActiveDaysEl = document.getElementById("hmActiveDays");
  const activeDays = hmActiveDaysEl ? (parseInt(hmActiveDaysEl.textContent) || fullProcessedData.length) : fullProcessedData.length;

  // 答題連勝紀錄
  const repCurStreak = latest.streak || 0;
  const repBestStreak = Math.max(latest.bestStreak || 0, repCurStreak, ...fullProcessedData.map(r => r.streak || 0));

  // 3. 綜合評級計算 (Performance Tier)
  const numAcc = parseFloat(cumAccuracy) || 0;
  let tierGrade = "B";
  let tierTitle = "穩定成長";
  let tierColor = "#2563eb";
  if (numAcc >= 85 && cumAttempts >= 200) {
    tierGrade = "A+";
    tierTitle = "卓越精熟";
    tierColor = "#16a34a";
  } else if (numAcc >= 75 && cumAttempts >= 80) {
    tierGrade = "A";
    tierTitle = "熟練進階";
    tierColor = "#2563eb";
  } else if (numAcc >= 60) {
    tierGrade = "B";
    tierTitle = "穩定成長";
    tierColor = "#d97706";
  } else {
    tierGrade = "C";
    tierTitle = "初階起步";
    tierColor = "#7c3aed";
  }

  // 4. 目標達成檢核
  const g = currentGoals || { masteredTarget: 50, attemptsTarget: 300, accuracyTarget: 80, streakTarget: 7, deadline: "" };
  const tMastered = g.masteredTarget || 50;
  const tAttempts = g.attemptsTarget || 300;
  const tAcc      = g.accuracyTarget || 80;
  const tStreak   = g.streakTarget   || 7;
  const pctM = Math.round((cumMastered / tMastered) * 100);
  const pctAtt = Math.round((cumAttempts / tAttempts) * 100);
  const pctA = tAcc > 0 ? Math.round((numAcc / tAcc) * 100) : 0;
  const pctS = Math.round((curStreak / tStreak) * 100);

  let achievedGoals = 0;
  if (cumMastered >= tMastered) achievedGoals++;
  if (cumAttempts >= tAttempts) achievedGoals++;
  if (numAcc >= tAcc) achievedGoals++;
  if (curStreak >= tStreak) achievedGoals++;
  const overallGoalPct = Math.round((achievedGoals / 4) * 100);

  // 4.5 成長動能與目標達成推估
  let repForecastText = "歷程累積中";
  if (fullProcessedData && fullProcessedData.length >= 2) {
    const recPoints = [...fullProcessedData].filter(r => r.date).reverse();
    if (recPoints.length >= 2) {
      const fD = new Date(recPoints[0].date.replace(/-/g, "/"));
      const lD = new Date(recPoints[recPoints.length - 1].date.replace(/-/g, "/"));
      const dSpan = Math.max(1, Math.round((lD - fD) / (1000 * 60 * 60 * 24)));
      const mSpan = Math.max(0, (recPoints[recPoints.length - 1].mastered || 0) - (recPoints[0].mastered || 0));
      const vel = (mSpan / dSpan).toFixed(1);
      if (cumMastered >= tMastered) {
        repForecastText = `精通目標已全數攻克（全期平均增速 +${vel} 字/天）`;
      } else if (parseFloat(vel) > 0) {
        const daysLeft = Math.ceil((tMastered - cumMastered) / parseFloat(vel));
        const estD = new Date(lD);
        estD.setDate(estD.getDate() + daysLeft);
        repForecastText = `預估 ${formatDateYMD(estD)} 達標（約 ${daysLeft} 天後，成長動能 +${vel} 字/天）`;
      } else {
        repForecastText = `維持穩定練習（近期平均增速 +${vel} 字/天）`;
      }
    }
  }

  const getStatusChipHtml = (cur, target, pct) => {
    if (cur >= target) return `<span style="color:#15803d; font-weight:700; background:#dcfce7; padding:2px 8px; border-radius:4px;">🎉 已達標</span>`;
    if (pct >= 80) return `<span style="color:#b45309; font-weight:700; background:#fef3c7; padding:2px 8px; border-radius:4px;">⚡ 即將達標</span>`;
    return `<span style="color:#1d4ed8; font-weight:600; background:#eff6ff; padding:2px 8px; border-radius:4px;">🚀 進行中</span>`;
  };

  // 5. Level 1~5 解析
  const levels = [
    { key: "l1", name: "LEVEL 1 入門" },
    { key: "l2", name: "LEVEL 2 基礎" },
    { key: "l3", name: "LEVEL 3 進階" },
    { key: "l4", name: "LEVEL 4 挑戰" },
    { key: "l5", name: "LEVEL 5 精熟" }
  ];

  let levelRowsHtml = "";
  let lowAccLevels = [];
  let highAccLevels = [];

  levels.forEach(lv => {
    const lObj = latest[lv.key] || { cumNum: 0, cumDen: 0 };
    const a = lObj.cumDen || 0;
    const c = lObj.cumNum || 0;
    const rate = a > 0 ? Math.round((c / a) * 100) : 0;
    let evalText = "";
    let evalColor = "#64748b";
    if (a === 0) {
      evalText = "⚪ 尚未涉獵";
    } else if (rate >= 80 && a >= 10) {
      evalText = "⭐ 精熟達標";
      evalColor = "#16a34a";
      highAccLevels.push(lv.name.split(" ")[0]);
    } else if (rate >= 60) {
      evalText = "🟡 穩步提升";
      evalColor = "#d97706";
    } else {
      evalText = "🔴 建議強化";
      evalColor = "#dc2626";
      lowAccLevels.push(lv.name.split(" ")[0]);
    }

    levelRowsHtml += `
      <tr>
        <td style="font-weight:700; text-align:left; padding-left:14px;">${lv.name}</td>
        <td style="font-weight:600;">${a} 題</td>
        <td style="font-weight:600; color:#16a34a;">${c} 題</td>
        <td style="font-weight:700;">${a > 0 ? rate + "%" : "0%"}</td>
        <td class="report-bar-cell">
          <div class="report-mini-track">
            <div class="report-mini-fill" style="width:${Math.min(rate, 100)}%; background:${evalColor};"></div>
          </div>
        </td>
        <td style="font-weight:700; color:${evalColor};">${evalText}</td>
      </tr>
    `;
  });

  // 6. 系統診斷建議 (3點客觀分析)
  const advicePoints = [];
  if (highAccLevels.length > 0) {
    advicePoints.push(`<strong>核心優勢：</strong>在 ${highAccLevels.join("、")} 等級表現優異，答對率穩居 80% 以上，詞彙基礎扎實且作答穩定。`);
  } else {
    advicePoints.push(`<strong>基礎鞏固：</strong>建議優先加強 LEVEL 1~2 基礎單字，透過每日小量多次複習建立答題信心。`);
  }

  if (lowAccLevels.length > 0) {
    advicePoints.push(`<strong>建議強化：</strong>在 ${lowAccLevels.join("、")} 等級中失誤率較高，建議可將該等級單字標記為重點生字，增加重溫頻率。`);
  } else {
    advicePoints.push(`<strong>進階挑戰：</strong>各等級答題正確率表現平均，建議可進一步提高 LEVEL 4~5 進階題庫作答比例，持續拓寬單字深度。`);
  }

  if (curStreak >= 7) {
    advicePoints.push(`<strong>學習習慣：</strong>連續打卡達 ${curStreak} 天（最長連續 ${maxStreak} 天），自主學習習慣養成出色，持之以恆有助長期記憶神經網絡鞏固！`);
  } else {
    advicePoints.push(`<strong>作答節奏：</strong>目前累積練習天數達 ${activeDays} 天，建議設定固定每日打卡時間，維持每日練習 10~15 題以維持語感與記憶活性。`);
  }

  // 頻率與習慣原型推算
  if (fullProcessedData && fullProcessedData.length >= 2) {
    const validD = [...fullProcessedData].filter(r => r.date).reverse();
    const dMap = new Map();
    validD.forEach(r => { if (!dMap.has(r.date)) dMap.set(r.date, r); });
    const uDays = Array.from(dMap.values());
    if (uDays.length >= 2) {
      const fDt = new Date(uDays[0].date.replace(/-/g, "/"));
      const lDt = new Date(uDays[uDays.length - 1].date.replace(/-/g, "/"));
      const spanD = Math.max(1, Math.round((lDt - fDt) / (1000 * 60 * 60 * 24)) + 1);
      const wks = Math.max(1, spanD / 7);
      const repWeeklyFreq = (Math.min(7.0, uDays.length / wks)).toFixed(1);
      const repAvgInterval = ((spanD - 1) / (uDays.length - 1)).toFixed(1);
      let repPersona = "穩步精進型";
      if (parseFloat(repWeeklyFreq) >= 4.0) repPersona = "恆毅規律型";
      else if (parseFloat(repWeeklyFreq) >= 2.5) repPersona = "穩步精進型";
      else repPersona = "起步蓄力型";
      advicePoints.push(`<strong>練習頻率與節奏：</strong>平均每週練習 ${repWeeklyFreq} 天，平均間隔約 ${repAvgInterval} 天，習慣原型評定為「<strong>${repPersona}</strong>」。${parseFloat(repAvgInterval) <= 2.0 ? "完全符合艾賓浩斯抗遺忘記憶黃金間隔！" : "建議將間隔微調縮短至 2 天內以獲取最佳長期留存率。"}`);
    }
  }

  const commentContent = customTeacherComment || getDefaultComment(tierGrade, latest);

  // 7. 組裝完整報告 HTML
  docEl.innerHTML = `
    <!-- 報告抬頭 -->
    <div class="report-header">
      <div>
        <div class="report-title-main">📘 學生個人化英語學習歷程成效診斷報告書</div>
        <div class="report-title-sub">Personalized English Vocabulary Learning Diagnostic Report</div>
      </div>
      <div class="report-tier-badge" style="border-color:${tierColor};">
        <div class="tier-badge-title" style="color:${tierColor};">綜合能力評級</div>
        <div class="tier-badge-grade" style="color:${tierColor};">${tierGrade}</div>
        <div style="font-size:11px; font-weight:700; color:${tierColor}; margin-top:2px;">${tierTitle}</div>
      </div>
    </div>

    <!-- 學生基本與報告資訊 -->
    <div class="report-meta-grid">
      <div class="report-meta-item">
        <span class="report-meta-label">學生身分：</span>
        <span class="report-meta-value" style="color:#2563eb; font-size:14px; font-weight:700;">
          ${studentMyClass ? `[${escapeHtml(studentMyClass)}] ` : ""}${escapeHtml(targetStudent)}${studentRealName ? ` (${escapeHtml(studentRealName)})` : ""}
        </span>
      </div>
      <div class="report-meta-item">
        <span class="report-meta-label">報告日期：</span>
        <span class="report-meta-value">${reportDateStr} ${nowTimeStr}</span>
      </div>
      <div class="report-meta-item">
        <span class="report-meta-label">名次競爭力：</span>
        <span class="report-meta-value" style="color:#d97706; font-weight:800;">
          ${currentLeaderboard && currentLeaderboard.myRanks && currentLeaderboard.myRanks.mastered && currentLeaderboard.myRanks.mastered.rank !== "-"
            ? `精通榜第 ${currentLeaderboard.myRanks.mastered.rank} 名 (PR ${currentLeaderboard.myRanks.mastered.pr} / ${currentLeaderboard.mode === "all" ? "全校跨班" : (currentLeaderboard.myClass || "全班")} ${currentLeaderboard.totalStudents} 人)`
            : `常態評鑑中`}
        </span>
      </div>
      <div class="report-meta-item">
        <span class="report-meta-label">統計區間：</span>
        <span class="report-meta-value">${escapeHtml(dateRangeStr)}</span>
      </div>
    </div>

    <!-- 第一單元：核心量化學習指標總覽 -->
    <div class="report-section">
      <div class="report-section-title">📊 核心量化學習指標總覽 (Key Performance Indicators)</div>
      <div class="report-kpi-grid">
        <div class="report-kpi-item">
          <div class="report-kpi-label">🏆 精通單字總數</div>
          <div class="report-kpi-value">${cumMastered} <span style="font-size:13px; font-weight:normal;">個</span></div>
          <div class="report-kpi-sub">學習中 ${learningCount} / 練習中 ${practicingCount}</div>
        </div>
        <div class="report-kpi-item">
          <div class="report-kpi-label">📝 累積作答題數</div>
          <div class="report-kpi-value">${cumAttempts.toLocaleString()} <span style="font-size:13px; font-weight:normal;">題</span></div>
          <div class="report-kpi-sub">本次選定區間：+${pAttempts.toLocaleString()} 題</div>
        </div>
        <div class="report-kpi-item">
          <div class="report-kpi-label">🎯 綜合答題正確率</div>
          <div class="report-kpi-value">${cumAccuracy}</div>
          <div class="report-kpi-sub">本次選定區間：${pAcc}</div>
        </div>
        <div class="report-kpi-item">
          <div class="report-kpi-label">🔥 連續打卡天數</div>
          <div class="report-kpi-value">${curStreak} <span style="font-size:13px; font-weight:normal;">天</span></div>
          <div class="report-kpi-sub">歷史最長連續：${maxStreak} 天</div>
        </div>
        <div class="report-kpi-item">
          <div class="report-kpi-label">📅 累積活躍天數</div>
          <div class="report-kpi-value">${activeDays} <span style="font-size:13px; font-weight:normal;">天</span></div>
          <div class="report-kpi-sub">答對單字庫：${distWords} 字</div>
        </div>
        <div class="report-kpi-item">
          <div class="report-kpi-label">⭐ 累積學習總分</div>
          <div class="report-kpi-value">${cumScore.toLocaleString()} <span style="font-size:13px; font-weight:normal;">分</span></div>
          <div class="report-kpi-sub">本次區間得分：+${pScore.toLocaleString()} 分</div>
        </div>
        <div class="report-kpi-item">
          <div class="report-kpi-label">⚡ 目前答題連勝</div>
          <div class="report-kpi-value">${repCurStreak} <span style="font-size:13px; font-weight:normal;">次</span></div>
          <div class="report-kpi-sub">連續正確答題</div>
        </div>
        <div class="report-kpi-item">
          <div class="report-kpi-label">👑 最長答題連勝</div>
          <div class="report-kpi-value">${repBestStreak} <span style="font-size:13px; font-weight:normal;">次</span></div>
          <div class="report-kpi-sub">歷史最佳連勝紀錄</div>
        </div>
      </div>
    </div>

    <!-- 第二單元：學習目標與里程碑達成檢核 -->
    <div class="report-section">
      <div class="report-section-title">🎯 個人學習目標與里程碑達成檢核 (Milestones Audit)</div>
      <div style="font-size:12px; color:#475569; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
        <span><strong>總體目標達成度：</strong>已達成 <strong>${achievedGoals} / 4</strong> 項指標 (${overallGoalPct}%)</span>
        <span><strong>🔮 成長動能推估：</strong>${repForecastText}</span>

// 📊 正確率格式化工具（強制使用百分比，不使用小數）
// ════════════════════════════════════════
function formatRatePercentage(rawRate, scoreStr) {
  if (rawRate === undefined || rawRate === null || rawRate === "" || rawRate === "—") {
    if (scoreStr && String(scoreStr).includes("/")) {
      const m = String(scoreStr).match(/^(\d+)\s*\/\s*(\d+)/);
      if (m && parseInt(m[2], 10) > 0) {
        return Math.round((parseInt(m[1], 10) / parseInt(m[2], 10)) * 100) + "%";
      }
    }
    return "—";
  }
  const s = String(rawRate).trim();
  if (s.endsWith("%")) {
    const n = parseFloat(s);
    if (!isNaN(n)) return Math.round(n) + "%";
    return s;
  }
  const num = parseFloat(s);
  if (!isNaN(num)) {
    return Math.round(num <= 1 ? num * 100 : num) + "%";
  }
  return s;
}

function resolveStudentTaskWords(record, selectedDate, agent) {
  return (typeof resolveTaskWords === "function")
    ? resolveTaskWords(record, selectedDate, agent)
    : { rawWords: [], wrongList: [], correctList: [] };
}

// ════════════════════════════════════════
// 📝 單字測驗與自由練習按日期查詢模組 (比照拼字遊戲網頁)
// ════════════════════════════════════════
function isSatClearedOnSundayDate(dateStr, taskRecords = {}, histList = []) {
  if (!dateStr) return false;
  const norm = normalizeDateKey(dateStr);
  const dt = new Date(norm.replace(/-/g, "/"));
  if (dt.getDay() !== 0) return false;

  const satDt = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - 1);
  const satKey = normalizeDateKey(formatDateYMD(satDt));
  const monDt = new Date(dt.getFullYear(), dt.getMonth(), dt.getDate() - 6);
  const monKey = normalizeDateKey(formatDateYMD(monDt));

  // 1. 從 weekend_remedy 查
  let rem = taskRecords["weekend_remedy_" + monKey];
  if (typeof rem === "string") { try { rem = JSON.parse(rem); } catch(_) {} }
  if (!rem) {
    try { const raw = localStorage.getItem("weekend_remedy_" + monKey); if (raw) rem = JSON.parse(raw); } catch(_) {}
  }
  if (rem && rem.satCompleted && (!rem.satWrongWords || rem.satWrongWords.length === 0)) {
    return true;
  }

  // 2. 從 task_summary 查
  let sum = taskRecords["task_summary_" + satKey];
  if (typeof sum === "string") { try { sum = JSON.parse(sum); } catch(_) {} }
  if (!sum) {
    try { const raw = localStorage.getItem("task_summary_" + satKey); if (raw) sum = JSON.parse(raw); } catch(_) {}
  }
  if (sum && sum.completed && (!sum.wrongWords || sum.wrongWords.length === 0)) {
    return true;
  }

  // 3. 從 historyList / dailyTaskHistory / 週六紀錄查
  if (Array.isArray(histList)) {
    const satItem = histList.find(item => item && normalizeDateKey(item.date) === satKey && (
      String(item.taskName || "").includes("週末") ||
      String(item.taskName || "").includes("消滅") ||
      String(item.taskName || "").includes("待攻克") ||
      String(item.taskName || "").includes("雙週") ||
      item.isWeekend
    ));
    if (satItem) {
      const isDone = satItem.status && (satItem.status.includes("已完成") || satItem.status.includes("●") || satItem.status.includes("🟢"));
      const noWrong = (!satItem.wrongWords || satItem.wrongWords.length === 0);
      if (isDone && noWrong) return true;
    }
  }

  return false;
}

function normalizeDateKey(ds) {
  if (!ds) return "";
  const clean = String(ds).trim().split(" ")[0].replace(/\//g, "-");
  const parts = clean.split("-");
  if (parts.length === 3) {
    return `${parts[0]}-${String(parts[1]).padStart(2, "0")}-${String(parts[2]).padStart(2, "0")}`;
  }
  return clean;
}

function unpadDateKey(ds) {
  if (!ds) return "";
  const clean = String(ds).trim().split(" ")[0].replace(/\//g, "-");
  const parts = clean.split("-");
  if (parts.length === 3) {
    return `${parts[0]}-${parseInt(parts[1], 10)}-${parseInt(parts[2], 10)}`;
  }
  return clean;
}

const _resolveWordsCache = new Map();
function clearResolveWordsCache() { _resolveWordsCache.clear(); }

function resolveTaskWords(record, selectedDate, agent) {
  if (!record) return { rawWords: [], wrongList: [], correctList: [], hadCorrectThenWrongList: [] };

  const cacheKey = String(record.date || "") + "|" + String(selectedDate || "") + "|" + String(record.taskName || "") + "|" + String(record.score || "") + "|" + String(record.attempts || "") + "|" + String(record.status || "");
  if (_resolveWordsCache.has(cacheKey)) {
    return _resolveWordsCache.get(cacheKey);
  }

  const normDate = normalizeDateKey(selectedDate || record.date || "");
  const p = normDate.split("-");
  const shortDate = p.length === 3 ? `${p[0]}-${parseInt(p[1], 10)}-${parseInt(p[2], 10)}` : normDate;
  const padDate = p.length === 3 ? `${p[0]}-${String(p[1]).padStart(2, "0")}-${String(p[2]).padStart(2, "0")}` : normDate;
  const slashPad = padDate.replace(/-/g, "/");
  const slashShort = shortDate.replace(/-/g, "/");
  let pool = [];

  // 解析預期答對題數與總題數 (完全比照遊戲端)
  let expectedCorrect = -1;
  let expectedTotal = -1;
  if (record.score && String(record.score).includes("/")) {
    const parts = String(record.score).split("/");
    expectedCorrect = parseInt(parts[0], 10);
    expectedTotal = parseInt(parts[1], 10);
  } else if (record.correct !== undefined && record.correct !== null && record.correct !== "") {
    expectedCorrect = parseInt(record.correct, 10);
    expectedTotal = parseInt(record.attempts !== undefined ? record.attempts : record.total, 10);
  } else if (record.score && record.score !== "—" && record.score !== "尚未開始") {
    const m = String(record.score).match(/\d+/);
    if (m) expectedCorrect = parseInt(m[0], 10);
  }
  if (isNaN(expectedCorrect)) expectedCorrect = -1;
  if (isNaN(expectedTotal)) expectedTotal = -1;

  const tRecords = (agent && agent._taskRecords) || (window.currentStudentData && window.currentStudentData.agentData && window.currentStudentData.agentData._taskRecords) || {};

  // 1. 若 record.words 已有單字陣列 (遊戲端出題原始記錄)
  if (Array.isArray(record.words) && record.words.length > 0) {
    pool = record.words.map(w => typeof w === "string" ? w : (w.word || w.display || w.w)).filter(Boolean);
  }

  // 2. 從 student_task_history 提取 (優先從備份字典，再從本地)
  if (pool.length === 0 && normDate) {
    let stHistory = tRecords["student_task_history"];
    if (typeof stHistory === "string") {
      try { stHistory = JSON.parse(stHistory); } catch(_) {}
    }
    if (!Array.isArray(stHistory)) {
      stHistory = window.cachedStudentDailyHistory || [];
    }
    if (Array.isArray(stHistory)) {
      const matched = stHistory.find(h => {
        if (!h) return false;
        const hDate = normalizeDateKey(h.date || "");
        return (hDate === padDate || hDate === shortDate) && (
          !record.taskName || !h.taskName || h.taskName === record.taskName || record.taskName.includes(h.taskName) || h.taskName.includes(record.taskName)
        );
      });
      if (matched) {
        if (Array.isArray(matched.words) && matched.words.length > 0) {
          pool = matched.words.map(w => typeof w === "string" ? w : (w.word || w.display || w.w)).filter(Boolean);
        }
        if (Array.isArray(matched.correctWords) && matched.correctWords.length > 0 && (!record.correctWords || record.correctWords.length === 0)) {
          record.correctWords = matched.correctWords;
        }
        if (Array.isArray(matched.wrongWords) && matched.wrongWords.length > 0 && (!record.wrongWords || record.wrongWords.length === 0)) {
          record.wrongWords = matched.wrongWords;
        }
      }
    }
  }

  // 3. 從 task_words_YYYY-MM-DD 快取提取 (遊戲端當日任務單字庫)
  if (pool.length === 0 && normDate) {
    let tw = tRecords["task_words_" + padDate] || tRecords["task_words_" + shortDate] || tRecords["task_words_" + slashPad] || tRecords["task_words_" + slashShort];
    if (typeof tw === "string") {
      try { tw = JSON.parse(tw); } catch(_) {}
    }
    if (Array.isArray(tw) && tw.length > 0) {
      pool = tw.map(w => typeof w === "string" ? w : (w.word || w.display || w.w)).filter(Boolean);
    }
  }

  // 4. 從 today_task_summary / today_task_in_progress 提取
  if (pool.length === 0 && normDate) {
    let ts = tRecords["today_task_summary"] || window.cachedStudentTodayTaskResult || window.cachedBackupTodayTaskSummary;
    if (typeof ts === "string") {
      try { ts = JSON.parse(ts); } catch(_) {}
    }
    if (ts && (normalizeDateKey(ts.date || "") === padDate || normalizeDateKey(ts.date || "") === shortDate)) {
      if (Array.isArray(ts.words) && ts.words.length > 0) {
        pool = ts.words.map(w => typeof w === "string" ? w : (w.word || w.display || w.w)).filter(Boolean);
      }
      if (Array.isArray(ts.correctWords) && ts.correctWords.length > 0 && (!record.correctWords || record.correctWords.length === 0)) {
        record.correctWords = ts.correctWords;
      }
      if (Array.isArray(ts.wrongWords) && ts.wrongWords.length > 0 && (!record.wrongWords || record.wrongWords.length === 0)) {
        record.wrongWords = ts.wrongWords;
      }
    }
  }

  // 5. 從 task_summary_YYYY-MM-DD 提取
  if (pool.length === 0 && normDate) {
    let tsDay = tRecords["task_summary_" + padDate] || tRecords["task_summary_" + shortDate];
    if (typeof tsDay === "string") {
      try { tsDay = JSON.parse(tsDay); } catch(_) {}
    }
    if (tsDay) {
      if (Array.isArray(tsDay.words) && tsDay.words.length > 0) {
        pool = tsDay.words.map(w => typeof w === "string" ? w : (w.word || w.display || w.w)).filter(Boolean);
      }
      if (Array.isArray(tsDay.correctWords) && tsDay.correctWords.length > 0 && (!record.correctWords || record.correctWords.length === 0)) {
        record.correctWords = tsDay.correctWords;
      }
      if (Array.isArray(tsDay.wrongWords) && tsDay.wrongWords.length > 0 && (!record.wrongWords || record.wrongWords.length === 0)) {
        record.wrongWords = tsDay.wrongWords;
      }
    }
  }

  // 6. 從 weekend_remedy_YYYY-MM-DD 提取
  if (normDate && (pool.length === 0 || !record.correctWords || record.correctWords.length === 0)) {
    const dObj = new Date(padDate.replace(/-/g, "/"));
    const day = dObj.getDay();
    if (day === 0 || day === 6) {
      const diff = dObj.getDate() - day + (day === 0 ? -6 : 1);
      const mObj = new Date(dObj.getFullYear(), dObj.getMonth(), diff);
      const monKey = mObj.getFullYear() + "-" + String(mObj.getMonth() + 1).padStart(2, "0") + "-" + String(mObj.getDate()).padStart(2, "0");
      let rem = tRecords["weekend_remedy_" + monKey];
      if (typeof rem === "string") {
        try { rem = JSON.parse(rem); } catch(_) {}
      }
      if (rem) {
        const corr = day === 6 ? rem.satCorrectWords : rem.sunCorrectWords;
        const wrg = day === 6 ? rem.satWrongWords : rem.sunWrongWords;
        if (Array.isArray(corr) && corr.length > 0) {
          if (!record.correctWords || record.correctWords.length === 0) record.correctWords = corr;
          pool = pool.concat(corr);
        }
        if (Array.isArray(wrg) && wrg.length > 0) {
          if (!record.wrongWords || record.wrongWords.length === 0) record.wrongWords = wrg;
          pool = pool.concat(wrg);
        }
      }
    }
  }

  // 7. 從 cachedTaskWordsMap 字典 (指派任務單字庫) 提取
  if (pool.length === 0 && window.cachedTaskWordsMap) {
    const taskDict = window.cachedTaskWordsMap;
    const tName = String(record.taskName || "").toLowerCase();
    const mWords = taskDict[padDate + "_" + tName] || taskDict[shortDate + "_" + tName] || taskDict[tName] || taskDict[padDate] || taskDict[shortDate] || taskDict[slashPad] || taskDict[slashShort];
    if (Array.isArray(mWords) && mWords.length > 0) {
      pool = mWords.map(w => typeof w === "string" ? w : (w.word || w.display || w.w)).filter(Boolean);
    }
  }

  // 8. 從本機 localStorage 提取 (若在相同瀏覽器環境下存有當日任務)
  if (pool.length === 0 && normDate) {
    try {
      const rawTS = localStorage.getItem("task_summary_" + padDate) || localStorage.getItem("task_summary_" + shortDate);
      if (rawTS) {
        const ts = JSON.parse(rawTS);
        if (ts && Array.isArray(ts.words) && ts.words.length > 0) {
          pool = ts.words.map(w => typeof w === "string" ? w : (w.word || w.display || w.w)).filter(Boolean);
        }
        if (Array.isArray(ts.correctWords) && ts.correctWords.length > 0 && (!record.correctWords || record.correctWords.length === 0)) {
          record.correctWords = ts.correctWords;
        }
        if (Array.isArray(ts.wrongWords) && ts.wrongWords.length > 0 && (!record.wrongWords || record.wrongWords.length === 0)) {
          record.wrongWords = ts.wrongWords;
        }
      }
    } catch(_) {}
  }

  // 9. 過濾非英文單字之狀態字串 (如 應測單字、未完成、— 等)
  const isValidEnglishWordStr = (str) => {
    if (!str || typeof str !== "string") return false;
    const clean = str.trim();
    if (!clean) return false;
    if (/^[\(\[\{（【].*[\)\]\}）】]$/.test(clean)) return false;
    if (clean.includes("應測") || clean.includes("未完成") || clean.includes("尚未") || clean === "—") return false;
    return /^[a-zA-Z\s\-'\.]+$/.test(clean);
  };

  let wrongList = Array.from(new Set(
    (record.wrongWords || [])
      .map(w => resolveWord(String(w).trim()).toLowerCase())
      .filter(isValidEnglishWordStr)
  )).sort((a, b) => a.localeCompare(b));

  pool = pool.map(w => resolveWord(String(w).trim()).toLowerCase()).filter(isValidEnglishWordStr);

  if (pool.length === 0 && wrongList.length > 0) {
    pool = [...wrongList];
  }

  const wrongSet = new Set(wrongList.map(w => w.toLowerCase()));
  let rawWords = Array.from(new Set(pool.map(w => String(w).trim().toLowerCase()).filter(Boolean)));

  const explicitCorrect = (Array.isArray(record.correctWords) ? record.correctWords : [])
    .map(w => resolveWord(String(w).trim()).toLowerCase())
    .filter(isValidEnglishWordStr);

  let correctList = [];
  explicitCorrect.forEach(w => {
    if (!wrongSet.has(w) && !correctList.includes(w)) correctList.push(w);
  });
  rawWords.forEach(w => {
    if (!wrongSet.has(w) && !correctList.includes(w)) correctList.push(w);
  });

  // 嚴格保證：若有明確答對題數 expectedCorrect，答對單字列表長度絕不超過 expectedCorrect！(1:1 完全比照遊戲端)
  if (expectedCorrect >= 0) {
    if (expectedCorrect === 0) {
      correctList = [];
    } else if (correctList.length > expectedCorrect) {
      const allPracticed = (agent && agent.stat) ? Object.keys(agent.stat).map(k => ({ word: resolveWord(k).toLowerCase(), correct: agent.stat[k].c || 0 })) : [];
      const wordWeightMap = {};
      allPracticed.forEach(item => {
        if (item.word) wordWeightMap[item.word] = item.correct || 0;
      });
      correctList.sort((a, b) => {
        let wtA = (explicitCorrect.includes(a) ? 10000 : 0) + (wordWeightMap[a] || 0);
        let wtB = (explicitCorrect.includes(b) ? 10000 : 0) + (wordWeightMap[b] || 0);
        return wtB - wtA;
      });
      correctList = correctList.slice(0, expectedCorrect);
    }
  }

  if (expectedTotal > 0 && expectedCorrect >= 0) {
    const expWrong = Math.max(0, expectedTotal - expectedCorrect);
    if (wrongList.length > expWrong) {
      wrongList = wrongList.slice(0, expWrong);
    } else if (wrongList.length < expWrong && rawWords.length > 0) {
      // 僅保留受測抽考中答錯之單字，未作答或題庫候選字保留至未受測清單
    
    }
  }

  wrongList.sort((a, b) => a.localeCompare(b));
  correctList.sort((a, b) => a.localeCompare(b));

  const hadCorrectThenWrongList = (Array.isArray(record.hadCorrectThenWrong) ? record.hadCorrectThenWrong : [])
    .map(w => resolveWord(String(w).trim()).toLowerCase())
    .filter(isValidEnglishWordStr);

  const result = { rawWords, wrongList, correctList, hadCorrectThenWrongList };
  _resolveWordsCache.set(cacheKey, result);
  return result;
}

function renderSingleTaskCardHtml(record, selectedDate, agent, index = 0, totalCount = 1, hasLoggedInOrFree = false) {
  const { rawWords, wrongList, correctList, hadCorrectThenWrongList } = resolveTaskWords(record, selectedDate, agent);

  const scoreVal = record.score || "—";
  const rateVal = formatRatePercentage(record.rate, record.score);
  const statusStr = record.status || "🟢 已完成";
  const answeredSet = new Set([
    ...correctList.map(w => String(w).toLowerCase()),
    ...wrongList.map(w => String(w).toLowerCase())
  ]);
  const unansweredList = rawWords.filter(w => !answeredSet.has(String(w).toLowerCase())).sort((a, b) => a.localeCompare(b));

function extractRowTaskInfo(row, headers) {
  if (!row || !Array.isArray(row)) return null;
  let tNameIdx = -1, assignedIdx = -1, answeredIdx = -1, correctIdx = -1, scoreIdx = -1, rateIdx = -1, statusIdx = -1, wrongIdx = -1;
  if (headers && Array.isArray(headers)) {
    headers.forEach((h, i) => {
      const s = String(h || "");
      if (s.includes("任務名稱") || s.includes("指定測驗名稱")) tNameIdx = i;
      else if (s.includes("施測單字數")) assignedIdx = i;
      else if (s.includes("作答單字數")) answeredIdx = i;
      else if (s.includes("答對單字數") && !s.includes("自由")) correctIdx = i;
      else if (s.includes("指定測驗成績")) scoreIdx = i;
      else if (s.includes("指定測驗正確率")) rateIdx = i;
      else if (s.includes("練習狀態")) statusIdx = i;
      else if (s.includes("測驗錯題") || (s.includes("錯題") && !s.includes("自由"))) wrongIdx = i;
    });
  }
  if (tNameIdx === -1) {
    if (row.length >= 33) {
      tNameIdx = 21; assignedIdx = 22; answeredIdx = 23; correctIdx = 24; scoreIdx = 25; rateIdx = 26; statusIdx = 27; wrongIdx = 28;
    } else if (row.length >= 30) {
      tNameIdx = 21; scoreIdx = 22; rateIdx = 23; statusIdx = 24; wrongIdx = 25;
    } else if (row.length === 26) {
      tNameIdx = 21; scoreIdx = 22; rateIdx = 23; statusIdx = 24; wrongIdx = 25;
    } else if (row.length === 25) {
      tNameIdx = 20; scoreIdx = 21; rateIdx = 22; statusIdx = 23; wrongIdx = 24;
    } else {
      tNameIdx = 18; scoreIdx = 19; rateIdx = 20; statusIdx = 21; wrongIdx = 22;
    }
  }
  const taskName = String(row[tNameIdx] || "").trim();
  let score = String(row[scoreIdx] || "—").trim();
  let rate = String(row[rateIdx] || "—").trim();
  let status = String(row[statusIdx] || "").trim();
  const wrongStr = String(row[wrongIdx] || "").trim();
  const wrongWords = wrongStr ? wrongStr.split(/[,、\s]+/).filter(Boolean) : [];

  const assignedWords = assignedIdx >= 0 && row[assignedIdx] !== undefined && row[assignedIdx] !== "" && row[assignedIdx] !== "—" ? parseInt(row[assignedIdx], 10) : 0;
  const answeredWords = answeredIdx >= 0 && row[answeredIdx] !== undefined && row[answeredIdx] !== "" && row[answeredIdx] !== "—" ? parseInt(row[answeredIdx], 10) : 0;
  const correctWords = correctIdx >= 0 && row[correctIdx] !== undefined && row[correctIdx] !== "" && row[correctIdx] !== "—" ? parseInt(row[correctIdx], 10) : 0;

  // 若存在作答單字數且已計算，成績為答對/作答，正確率為答對/施測，且作答數!=出題數為未完成
  if (assignedIdx >= 0 && answeredIdx >= 0 && (assignedWords > 0 || answeredWords > 0)) {
    if (answeredWords > 0) {
      score = `${correctWords}/${answeredWords}`;
    }
    if (assignedWords > 0) {
      rate = `${Math.round((correctWords / assignedWords) * 100)}%`;
    } else if (answeredWords > 0) {
      rate = `${Math.round((correctWords / answeredWords) * 100)}%`;
    }
    if (answeredWords === assignedWords && assignedWords > 0) {
      status = "🟢 已完成";
    } else if (answeredWords < assignedWords && assignedWords > 0) {
      status = `🟠 未完成 (${correctWords}/${assignedWords})`;
    }
  }

  return { taskName, score, rate, status, wrongWords, assignedWords, answeredWords, correctWords };
}

function extractRowFreeInfo(row, headers) {
  if (!row || !Array.isArray(row)) return null;
  let testIdx = -1, corrIdx = -1, rateIdx = -1, wrongIdx = -1;
  if (headers && Array.isArray(headers)) {
    headers.forEach((h, i) => {
      const s = String(h || "");
      if (s.includes("自由練習受測") || s.includes("自由練習題數")) testIdx = i;
      else if (s.includes("自由練習答對")) corrIdx = i;
      else if (s.includes("自由練習正確率")) rateIdx = i;
      else if (s.includes("自由練習錯題")) wrongIdx = i;
    });
  }
  if (testIdx === -1) {
    if (row.length >= 33) {
      testIdx = 29; corrIdx = 30; rateIdx = 31; wrongIdx = 32;
    } else if (row.length >= 30) {
      testIdx = 26; corrIdx = 27; rateIdx = 28; wrongIdx = 29;
    }
  }
  if (testIdx === -1) return null;
  const attempts = parseInt(row[testIdx], 10) || 0;
  const correct = parseInt(row[corrIdx], 10) || 0;
  const rate = String(row[rateIdx] || "—").trim();
  const wrongStr = String(row[wrongIdx] || "").trim();
  const wrongWords = wrongStr ? wrongStr.split(/[,、\s]+/).filter(Boolean) : [];
  const wordsMap = {};
  wrongWords.forEach(w => { wordsMap[w] = { word: w, correct: 0, wrong: 1, attempts: 1 }; });
  return { attempts, correct, wrong: Math.max(0, attempts - correct), rate, wrongWords, wordsMap };
}

function buildTaskDetailsHtml(records, selectedDate, agent) {
  const list = (Array.isArray(records) ? records : (records ? [records] : []))
    .filter(r => {
      if (!r) return false;
      const st = String(r.status || "");
      const isExpUntested = st.includes("未受測") || st.includes("缺席") || st.includes("缺考") || st.includes("未作答");
      if (isExpUntested) return true;
      return r.taskName && r.taskName !== "自主練習" && !r.taskName.includes("自由練習") && !r.taskName.includes("未指派") && !st.includes("未指派");
    })
    .map(r => {
      const st = String(r.status || "");
      const isExpUntested = st.includes("未受測") || st.includes("缺席") || st.includes("缺考") || st.includes("未作答");
      if (r && isExpUntested && (!r.taskName || r.taskName === "自主練習" || r.taskName.includes("未指派"))) {
        return { ...r, taskName: "每日指定測驗" };
      }
      return r;
    });

  const taskDict = (window.cachedTaskWordsMap || {});
  const sDateNorm = normalizeDateKey(selectedDate);
  const sDateShort = unpadDateKey(selectedDate);
  const slashPad = sDateNorm.replace(/-/g, "/");
  const slashShort = sDateShort.replace(/-/g, "/");

  if (list.length === 0) {
    // 檢查是否有當日已完成的 task_summary 或 weekend_remedy
    try {
      const rawTS = localStorage.getItem("task_summary_" + sDateNorm) || localStorage.getItem("task_summary_" + sDateShort);
      if (rawTS) {
        const ts = JSON.parse(rawTS);
        if (ts && ts.completed && ts.taskName && ts.taskName !== "自主練習") {
          list.push({
            date: sDateNorm,
            taskName: ts.taskName,
            score: (ts.score !== undefined && ts.total !== undefined) ? `${ts.score}/${ts.total}` : (ts.score || "已完成"),
            rate: ts.rate || "100%",
            status: "● 已完成",
            wrongWords: ts.wrongWords || [],
            words: ts.words || []
          });
        }
      }
    } catch(_) {}
  }

  // 判定是否為週日，且週六已全數消滅錯題（100% / 0 錯題）
  const tRecords = (agent && agent._taskRecords) || (window.currentStudentData && window.currentStudentData.agentData && window.currentStudentData.agentData._taskRecords) || {};
  const getRecordJson = (k) => {
    let val = tRecords[k];
    if (val) {
      if (typeof val === "string") { try { val = JSON.parse(val); } catch(_) {} }
      return val;
    }
    try { const raw = localStorage.getItem(k); if (raw) return JSON.parse(raw); } catch(_) {}
    return null;
  };
  const isSatClearedOnSunday = isSatClearedOnSundayDate(sDateNorm, tRecords, (agent && agent.dailyTaskHistory) || window.cachedStudentDailyHistory || []);
  // 若週日且週六已全數消滅，徹底過濾 list 中的週末測驗紀錄
  if (isSatClearedOnSunday) {
    for (let i = list.length - 1; i >= 0; i--) {
      if (String(list[i].taskName || "").includes("週末") || list[i].isWeekend) {
        list.splice(i, 1);
      }
    }
  }

  if (list.length === 0) {
    // 檢查是否有當日已完成的 task_summary 或 weekend_remedy
    try {
    const ts = getRecordJson("task_summary_" + sDateNorm);
      if (ts && !isSatClearedOnSunday) {
      // already parsed
        if (ts && ts.completed && ts.taskName && ts.taskName !== "自主練習") {
          list.push({
            date: sDateNorm,
            taskName: ts.taskName,
            score: (ts.score !== undefined && ts.total !== undefined) ? `${ts.score}/${ts.total}` : (ts.score || "已完成"),
            rate: ts.rate || "100%",
            status: "● 已完成",
            wrongWords: ts.wrongWords || [],
            words: ts.words || []
          });
        }
      }
    } catch(_) {}

    if (list.length === 0) {
      try {
        const dObj = new Date(sDateNorm.replace(/-/g, "/"));
        const day = dObj.getDay();
        if (day === 0 || day === 6) {
          const diff = dObj.getDate() - day + (day === 0 ? -6 : 1);
          const mObj = new Date(dObj.getFullYear(), dObj.getMonth(), diff);
          const monKey = mObj.getFullYear() + "-" + String(mObj.getMonth() + 1).padStart(2, "0") + "-" + String(mObj.getDate()).padStart(2, "0");
    const rem = getRecordJson("weekend_remedy_" + monKey);
          if (rem) {
      // already parsed
            const satClearedAll = rem && rem.satCompleted && (!rem.satWrongWords || rem.satWrongWords.length === 0);
            if (rem && ((day === 6 && rem.satCompleted) || (day === 0 && rem.sunCompleted && !satClearedAll))) {
              const corr = day === 6 ? (rem.satCorrectWords || []) : (rem.sunCorrectWords || []);
              const wrg = day === 6 ? (rem.satWrongWords || []) : (rem.sunWrongWords || []);
              const sc = day === 6 ? rem.satScore : rem.sunScore;
              const rt = day === 6 ? rem.satRate : rem.sunRate;
              const wList = Array.from(new Set([...corr, ...wrg]));
              list.push({
                date: sDateNorm,
                taskName: `🎯 ${formatWeekendTaskDate(sDateNorm)} 週末待攻克測驗作答紀錄`,
                score: sc || (wList.length ? `${corr.length}/${wList.length}` : "已完成"),
                rate: rt || "100%",
                status: "● 已完成",
                wrongWords: wrg,
                correctWords: corr,
                words: wList,
                isWeekend: true
              });
            }
          }
        }
      } catch(_) {}
    }
  }

  list.sort((a, b) => {
    const aDone = a && a.status && (a.status.includes("已完成") || a.status.includes("●") || a.status.includes("🟢")) ? 1 : 0;
    const bDone = b && b.status && (b.status.includes("已完成") || b.status.includes("●") || b.status.includes("🟢")) ? 1 : 0;
    return bDone - aDone;
  });

  // 1. 取得當日指派單字與任務名稱
  let assignedWords = taskDict[sDateNorm] || taskDict[sDateShort] || taskDict[slashPad] || taskDict[slashShort] || null;
  let taskName = "";

  if (window.cachedBackupTodayTaskSummary) {
    const bDate = String(window.cachedBackupTodayTaskSummary.date || "").trim().split(" ")[0].replace(/\//g, "-");
    if (bDate === sDateNorm || bDate === sDateShort) {
      taskName = window.cachedBackupTodayTaskSummary.taskName || window.cachedBackupTodayTaskSummary.name || "";
      if ((!assignedWords || assignedWords.length === 0) && window.cachedBackupTodayTaskSummary.words) {
        assignedWords = window.cachedBackupTodayTaskSummary.words;
      }
    }
  }

  if (Array.isArray(window.cachedBackupTaskHistory)) {
    const matched = window.cachedBackupTaskHistory.find(h => {
      const hDate = String(h.date || "").trim().split(" ")[0].replace(/\//g, "-");
      return hDate === sDateNorm || hDate === sDateShort;
    });
    if (matched) {
      if (!taskName) taskName = matched.taskName || matched.name || "";
      if ((!assignedWords || assignedWords.length === 0) && matched.words) {
        assignedWords = matched.words;
      }
    }
  }

  const isUntestedRecord = (Array.isArray(records) && records.some(r => r && r.status && (r.status.includes("未受測") || r.status.includes("缺席") || r.status.includes("未作答")))) ||
                           (!Array.isArray(records) && records && records.status && (records.status.includes("未受測") || records.status.includes("缺席") || records.status.includes("未作答")));
  const isAssignedOnDate = !isSatClearedOnSunday && !!(isUntestedRecord || (assignedWords && assignedWords.length > 0) || taskName || Object.keys(taskDict).some(k => k.startsWith(sDateNorm) || k.startsWith(sDateShort)));

  // 2. 判斷學生當天是否有登入或自由練習紀錄
  const dpMap = (agent && agent.dailyPractice) ? agent.dailyPractice : {};
  const dpDay = dpMap[sDateNorm] || dpMap[sDateShort] || dpMap[slashPad] || dpMap[slashShort] || null;
  const historyData = (agent && agent.history) ? agent.history : {};
  const hFree = historyData[sDateNorm] || historyData[sDateShort] || historyData[slashPad] || historyData[slashShort] || null;
  const hasLoggedInOrFree = !!((dpDay && (dpDay.attempts > 0 || (dpDay.words && Object.keys(dpDay.words).length > 0))) ||
                               (hFree && (hFree.attempts > 0 || (hFree.words && Object.keys(hFree.words).length > 0))));

  if (list.length === 0) {
    if (isAssignedOnDate) {
      // 當日有指派測驗，但該生未受測（缺席未受測 或 登入未受測）
      return renderUntestedTaskCardHtml({
        taskName: taskName || (sDateShort.replace(/-/g, "") + "指定單字隨堂測驗"),
        assignedWords: assignedWords || [],
        hasLoggedInOrFree,
        selectedDate
      }, agent);
    }

    // 當日未指派指定測驗
    return `
      <div class="task-empty-notice-box">
        <div class="task-empty-notice-icon" style="font-size:28px; margin-bottom:8px; line-height:1;">☕</div>
        <div class="task-empty-notice-title" style="font-size:14px; font-weight:700; color:var(--ink2); margin-bottom:6px;">${isSatClearedOnSunday ? "本日無指定單字測驗" : `該日未指派指定測驗（${selectedDate}）`}</div>
        <div class="task-empty-notice-desc" style="font-size:12px; margin-top:2px; color:var(--ink3); max-width:380px; margin-left:auto; margin-right:auto; line-height:1.5;">${isSatClearedOnSunday ? "本週待攻克單字已於週六全數消滅，今日無須再測驗！已全面開放自由闖關升級。" : "老師當日未指派指定測驗，可切換至其他日期查看紀錄"}</div>
      </div>
    `;
  }

  return `<div>${list.map((r, idx) => renderSingleTaskCardHtml(r, selectedDate, agent, idx, list.length, hasLoggedInOrFree)).join("")}</div>`;
}

function buildFreeDetailsHtml(record, selectedDate, agent) {
  if (!record || !record.attempts) {
    return `
      <div class="task-empty-notice-box">
        <div class="task-empty-notice-icon" style="font-size:26px; margin-bottom:6px; line-height:1;">🎮</div>
        <div class="task-empty-notice-title" style="font-size:13.5px; font-weight:700; color:var(--ink2); margin-bottom:6px;">該指定日期（${selectedDate}）尚無自由練習受測紀錄</div>
        <div class="task-empty-notice-desc" style="font-size:12px; margin-top:2px; color:var(--ink3); max-width:380px; margin-left:auto; margin-right:auto; line-height:1.5;">可從上方日曆選擇器或快速按鈕切換至其他日期查看作答狀況</div>
      </div>
    `;
  }

  const attempts = record.attempts || 0;
  const correct = record.correct || 0;
  const wrongCount = (record.wrong !== undefined) ? record.wrong : Math.max(0, attempts - correct);

  const wordsMap = record.words || {};
  let correctList = [];
  let wrongList = [];

  Object.keys(wordsMap).forEach(k => {
    const info = wordsMap[k];
    const rawW = (typeof info === "object" && info.word) ? info.word : k;
    const wName = resolveWord(rawW).toLowerCase();
    if (!wName || /^w\d+$/i.test(wName)) return;
    const hasWrong = (typeof info === "object" && info.wrong > 0);
    const hasCorrect = (typeof info === "object" && (info.correct > 0 || info.passed));

    if (hasWrong) {
      wrongList.push({
        word: wName,
        attempts: (typeof info === "object" && info.attempts) ? info.attempts : 1,
        wrong: (typeof info === "object" && info.wrong) ? info.wrong : 1,
        correct: (typeof info === "object" && info.correct) ? info.correct : (info && info.passed ? 1 : 0),
        hadCorrectThenWrong: !!(typeof info === "object" && (info.hadCorrectThenWrong || (info.lastResult === "wrong" && info.correct > 0))),
        lastResult: (typeof info === "object" && info.lastResult) ? info.lastResult : ""
      });
    } else if (hasCorrect) {
      correctList.push({
        word: wName,
        attempts: (typeof info === "object" && info.attempts) ? info.attempts : 1,
        correct: (typeof info === "object" && info.correct) ? info.correct : 1
      });
    } else {
      correctList.push({ word: wName, attempts: 1, correct: 1 });
    }
  });

  if (correctList.length === 0 && wrongList.length === 0 && attempts > 0) {
    if (agent && agent.stat) {
      const allWords = Object.keys(agent.stat)
        .filter(k => agent.stat[k] && (agent.stat[k].a > 0 || agent.stat[k].c > 0))
        .map(w => {
          const st = agent.stat[w] || {};
          const att = st.a || 0;
          const cor = st.c || 0;
          const wrg = (st.w !== undefined) ? st.w : Math.max(0, att - cor);
          return {
            word: resolveWord(w).toLowerCase(),
            attempts: att || 1,
            correct: cor,
            wrong: wrg,
            ew: !!st.ew
          };
        })
        .filter(item => item.word && !/^w\d+$/i.test(item.word));

      if (wrongCount > 0 && allWords.length > 0) {
        const wrongCands = allWords.filter(w => w.wrong > 0 || w.ew);
        wrongCands.sort((a, b) => (b.wrong || 0) - (a.wrong || 0));
        const pickedWrong = wrongCands.slice(0, wrongCount);
        pickedWrong.forEach(w => {
          wrongList.push({ word: w.word, attempts: w.attempts || 1, wrong: w.wrong || 1, correct: w.correct || 0 });
        });
        if (wrongList.length < wrongCount) {
          const remaining = allWords.filter(w => !wrongList.some(wl => wl.word === w.word)).slice(0, wrongCount - wrongList.length);
          remaining.forEach(w => {
            wrongList.push({ word: w.word, attempts: w.attempts || 1, wrong: 1, correct: w.correct || 0 });
          });
        }
      }
      if (correct > 0 && allWords.length > 0) {
        const correctCands = allWords.filter(w => w.correct > 0 && !wrongList.some(wl => wl.word === w.word));
        correctCands.sort((a, b) => (b.correct || 0) - (a.correct || 0));
        const pickedCorrect = correctCands.slice(0, correct);
        pickedCorrect.forEach(w => {
          correctList.push({ word: w.word, attempts: w.attempts || 1, correct: w.correct || 1 });
        });
        if (correctList.length < correct) {
          const remaining = allWords.filter(w => !wrongList.some(wl => wl.word === w.word) && !correctList.some(cl => cl.word === w.word)).slice(0, correct - correctList.length);
          remaining.forEach(w => {
            correctList.push({ word: w.word, attempts: w.attempts || 1, correct: 1 });
          });
        }
      }
    }
  }

  correctList.sort((a, b) => a.word.localeCompare(b.word));
  wrongList.sort((a, b) => a.word.localeCompare(b.word));

  // 依使用者規範：
  // 1. 施測單字數：忽略多次重複施測，每個相異單字僅計 1 個（忽略多次答對或多次答錯）
  const hasWordDetails = (correctList.length + wrongList.length) > 0;
  const totalWords = hasWordDetails
    ? (correctList.length + wrongList.length)
    : attempts;

  // 2. 答對單字數：忽略多次答對，只要有答對就是紀錄 1 個；若曾答錯但最新狀態為答對 (已訂正)，亦計入答對數
  // 嚴格修正：排除曾對後錯 (即最新狀態仍為錯題者)，唯有真正已訂正者 (非 wrong 狀態) 方計入答對數！
  const correctedCount = wrongList.filter(w => {
    const isStillWrong = w.hadCorrectThenWrong || (w.lastResult === "wrong" && w.correct > 0);
    return !isStillWrong && w.correct > 0;
  }).length;
  const correctWords = hasWordDetails
    ? (correctList.length + correctedCount)
    : correct;
  const displayCorrectBoxCount = correctList.length > 0 ? correctList.length : correctWords;
  const displayWrongBoxCount = wrongList.length > 0 ? wrongList.length : Math.max(0, totalWords - correctWords);

  const wordRate = totalWords > 0 ? Math.round((correctWords / totalWords) * 100) : 0;

  let correctContentHtml = "";
  if (correctList.length > 0) {
    correctContentHtml = correctList.map(w => `<span class="word-pill-tag correct" data-word="${w.word.replace(/"/g, "&quot;")}" onclick="event.stopPropagation(); speakMasteredWord('${w.word.replace(/'/g, "\\'")}')" style="cursor:pointer;" title="點擊聆聽發音">${w.word}</span>`).join("");
  } else if (correctWords > 0) {
    correctContentHtml = `<span style="font-size:12px; color:var(--ink3); font-style:italic;">（當日答對 ${correctWords} 字，早期紀錄僅存統計字數、未記錄個別單字明細）</span>`;
  } else {
    correctContentHtml = `<span style="font-size:12px; color:var(--ink3); font-style:italic;">（當日尚無全對單字）</span>`;
  }

  let wrongContentHtml = "";
  if (wrongList.length > 0) {
    wrongContentHtml = wrongList.map(w => {
      if (w.hadCorrectThenWrong || (w.lastResult === "wrong" && w.correct > 0)) {
        return `<span class="word-pill-tag warning" data-word="${w.word.replace(/"/g, "&quot;")}" onclick="event.stopPropagation(); speakMasteredWord('${w.word.replace(/'/g, "\\'")}')" style="border:1.5px dashed #f59e0b; background:rgba(245,158,11,0.1); color:#b45309; cursor:pointer;" title="當日曾答對，但後續作答時答錯 (點擊聆聽發音)">${w.word} <small style="font-size:10px; font-weight:700;">(曾對後錯⚠️)</small></span>`;
      } else if (w.correct > 0) {
        return `<span class="word-pill-tag correct" data-word="${w.word.replace(/"/g, "&quot;")}" onclick="event.stopPropagation(); speakMasteredWord('${w.word.replace(/'/g, "\\'")}')" style="border:1.5px dashed var(--green, #10B981); cursor:pointer;" title="當日曾答錯，已訂正答對 (點擊聆聽發音)">${w.word} <small style="font-size:10px; opacity:0.85;">(已訂正)</small></span>`;
      } else {
        return `<span class="word-pill-tag wrong" data-word="${w.word.replace(/"/g, "&quot;")}" onclick="event.stopPropagation(); speakMasteredWord('${w.word.replace(/'/g, "\\'")}')" style="cursor:pointer;" title="點擊聆聽發音">${w.word}</span>`;
      }
    }).join("");
  } else if (displayWrongBoxCount > 0) {
    wrongContentHtml = `<span style="font-size:12px; color:var(--ink3); font-style:italic;">（當日答錯 ${displayWrongBoxCount} 字，早期紀錄僅存統計字數、未記錄個別單字明細）</span>`;
  } else {
    wrongContentHtml = `<span class="perfect-score-msg">🎉 太棒了！當日自由練習全數答對，無任何答錯單字！</span>`;
  }

  const freeRateColor = wordRate >= 100 ? "#059669" : (wordRate >= 80 ? "#16a34a" : (wordRate >= 60 ? "#ca8a04" : "#ea580c"));

  return `
    <div>
      <div class="task-history-header">
        <div>
          <span class="task-card-title task-title-free">🎮 自由練習成果</span>
        </div>
      </div>

      <div class="task-score-grid">
        <div class="task-score-item">
          <div class="task-score-label" style="display:flex; align-items:center; justify-content:center; white-space:nowrap;">
            <span style="flex:1; text-align:right;">答對單字數</span>
            <span style="padding:0 6px; opacity:0.6;">/</span>
            <span style="flex:1; text-align:left;">施測單字數</span>
          </div>
          <div class="task-score-val" style="color:#0284c7; display:flex; align-items:center; justify-content:center;">
            <span style="flex:1; text-align:right;">${correctWords}</span>
            <span style="padding:0 6px; font-weight:700; color:var(--ink3); opacity:0.6; font-size:18px;">/</span>
            <span style="flex:1; text-align:left;">${totalWords}</span>
          </div>
        </div>
        <div class="task-score-item">
          <div class="task-score-label">正確率</div>
          <div class="task-score-val" style="color:${freeRateColor};">${wordRate}%</div>
        </div>
      </div>

      <div class="word-split-grid">
        <div class="word-split-box correct-box">
          <div class="word-split-title correct-title">
            <span><span style="color:#10B981; font-weight:900; margin-right:4px;">✔</span>已答對的單字 (${displayCorrectBoxCount} 字)</span>
          </div>
          <div class="word-split-content">
            ${correctContentHtml}
          </div>
        </div>
        <div class="word-split-box wrong-box">
          <div class="word-split-title wrong-title">
            <span>❌ 答錯的單字 (${displayWrongBoxCount} 字)</span>
          </div>
          <div class="word-split-content">
            ${wrongContentHtml}
          </div>
        </div>
      </div>
    </div>
  `;
}

function renderStudentDailyTaskAndFreeSections(resp) {
  const taskDetailsContainer = document.getElementById("task-record-details") || document.getElementById("st-task-record-details");
  const freeDetailsContainer = document.getElementById("free-record-details") || document.getElementById("st-free-record-details");
  const datePicker = document.getElementById("record-date-picker") || document.getElementById("student-rec-date-picker");
  const quickSelect = document.getElementById("record-quick-dates") || document.getElementById("student-rec-quick-dates");
  const taskDateLabel = document.getElementById("task-view-date") || document.getElementById("st-task-view-date");
  const freeDateLabel = document.getElementById("free-view-date") || document.getElementById("st-free-view-date");

  if (!taskDetailsContainer || !freeDetailsContainer) return;

  const agent = resp.agentData || {};
  const historyData = agent.history || {};
  const dpMap = (agent && agent.dailyPractice) ? agent.dailyPractice : {};
  const dailyTaskHistory = (resp.dailyTaskHistory && Array.isArray(resp.dailyTaskHistory)) 
    ? [...resp.dailyTaskHistory]
    : [...(window.cachedStudentDailyHistory || [])];
  const todayTask = resp.todayTaskResult || window.cachedStudentTodayTaskResult || null;

  // 1. 整理所有有紀錄日期
  const normalizeDateKey = (ds) => {
    if (!ds) return "";
    const clean = String(ds).trim().split(" ")[0].replace(/\//g, "-");
    const parts = clean.split("-");
    if (parts.length === 3) {
      return `${parts[0]}-${String(parts[1]).padStart(2, "0")}-${String(parts[2]).padStart(2, "0")}`;
    }
    return clean;
  };
  const unpadDateKey = (ds) => {
    if (!ds) return "";
    const clean = String(ds).trim().split(" ")[0].replace(/\//g, "-");
    const parts = clean.split("-");
    if (parts.length === 3) {
      return `${parts[0]}-${parseInt(parts[1], 10)}-${parseInt(parts[2], 10)}`;
    }
    return clean;
  };

  const dateSet = new Set();
  const todayDash = formatDateYMD(new Date());
  dateSet.add(todayDash);

  // 匯入 agentData._taskRecords 與備份歷程
  const taskRecords = (agent && agent._taskRecords) ? agent._taskRecords : {};
  if (Array.isArray(taskRecords.student_task_history)) {
    taskRecords.student_task_history.forEach(h => {
      if (h && h.date) {
        const d = normalizeDateKey(h.date);
        if (d) {
          dateSet.add(d);
          if (!dailyTaskHistory.some(existing => normalizeDateKey(existing.date) === d)) {
            dailyTaskHistory.push(h);
          }
        }
      }
    });
  }
  if (taskRecords.today_task_summary && taskRecords.today_task_summary.date) {
    const d = normalizeDateKey(taskRecords.today_task_summary.date);
    if (d) dateSet.add(d);
  }
  for (const k in taskRecords) {
    if (k.startsWith("weekend_remedy_")) {
      const monStr = k.slice("weekend_remedy_".length);

  if (!defaultSelectedDate) {

    const hasTodayFree = (dpMap[todayDash] && dpMap[todayDash].attempts > 0) ||
                         (dpMap[todayDash.replace(/-/g, "/")] && dpMap[todayDash.replace(/-/g, "/")].attempts > 0) ||
                         (historyData[todayDash] && historyData[todayDash].a > 0) || 
                         (historyData[todayDash.replace(/-/g, "/")] && historyData[todayDash.replace(/-/g, "/")].a > 0);
    if (!hasTodayTask && !hasTodayFree && allDates.length > 0) {

  const buildOptionTag = (dateStr) => {

      if (rem) {

  if (!text) return null;
  const raw = String(text).trim();
  const match = raw.match(/^(?:A|甲):\s*(.+?)\s*(?:\n|\/|\s{1,4})\s*(?:B|乙):\s*(.+)$/is);
  if (match) {

function _renderConquerWordCard(wordStr) {

    if (found) {

  if (!obj) {

      sents: [
        { level: "simple", levelName: "簡單", sent: "I'm able to swim.", sentZh: "我會游泳。" }
      ]

  const posMap = {
    n: "名詞", v: "動詞", vt: "及物動詞", vi: "不及物動詞",
    adj: "形容詞", a: "形容詞", adv: "副詞", ad: "副詞",
    prep: "介系詞", conj: "連接詞", pron: "代名詞",
    interj: "感嘆詞", int: "感嘆詞", art: "冠詞", num: "數詞",
    phr: "片語", aux: "助動詞"
  };
  let posList = [];
  let defText = "";
  const rawZh = obj.zh || "";
  if (rawZh) {
    const parts = rawZh.split('；');
    const transList = [];
    for (const part of parts) {
      const trimmed = part.trim();
      const m = trimmed.match(/^([a-zA-Z\.\s\/]+?)[\s\.\．]+(.*)$/);
      if (m) {
        const posStr = m[1].trim();
        const defStr = m[2].trim();
        if (defStr && !transList.includes(defStr)) transList.push(defStr);

  const wordDisplay = obj.display || obj.word || clean;

  const defHtml = defText ? `<b class="zh-def">${defText}</b>` : "";

    sentsList = [
      { level: "simple", levelName: "簡單", sent: "Practice using \"" + wordDisplay + "\" in daily communication.", sentZh: "在日常溝通中練習使用「" + wordDisplay + "」。" }
    ];
  }

  const levelOrder = { simple: 1, normal: 2, advanced: 3, dialogue: 4 };
  sentsList.sort((a, b) => (levelOrder[a.level] || 9) - (levelOrder[b.level] || 9));

  let wordLevel = (obj && obj.level) ? obj.level : 1;
  const lv = Number(wordLevel) || 1;
  const targetLevel = (lv >= 4) ? 'advanced' : (lv === 3) ? 'normal' : 'simple';
  let defaultIdx = sentsList.findIndex(s => s.level === targetLevel);
  if (defaultIdx === -1) {
    if (targetLevel === 'advanced') {
      defaultIdx = sentsList.findIndex(s => s.level === 'normal');
      if (defaultIdx === -1) defaultIdx = sentsList.findIndex(s => s.level === 'simple');
    } else if (targetLevel === 'normal') {
      defaultIdx = sentsList.findIndex(s => s.level === 'simple');
      if (defaultIdx === -1) defaultIdx = sentsList.findIndex(s => s.level === 'advanced');
    } else {
      defaultIdx = sentsList.findIndex(s => s.level === 'normal');
      if (defaultIdx === -1) defaultIdx = sentsList.findIndex(s => s.level === 'advanced');
    }
  }
  if (defaultIdx === -1) defaultIdx = 0;

  const escapedWord = clean.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const regex = new RegExp("\\b(" + escapedWord + ")\\b", "gi");

  const s = sentsList[defaultIdx];
  const isDlg = Boolean(parseDialogue(s.sent) || s.level === 'dialogue');
  const levelCls = s.level === 'simple' ? 'level-simple' : s.level === 'advanced' ? 'level-advanced' : isDlg ? 'level-dialogue' : 'level-normal';

  const highlightedSent = (s.sent || "").replace(regex, `<b class="conquer-sent-word task-title-free" style="font-weight:800;">$1</b>`);

  const sentsHtml = `
    <div class="sent-row conquer-sent-variant" data-idx="${defaultIdx}" onclick="speakMasteredWord('${safeSent}')" style="cursor:pointer;">

      <div class="sent-text-wrap">
        <div class="sent-en">${highlightedSent}</div>
        ${s.sentZh ? `<div class="sent-zh">${s.sentZh}</div>` : ""}
      </div>
    </div>
  `;

  return `
    <div class="conquer-word-card">
      <div class="zh-row">
        <button type="button" class="word-speech-btn" onclick="speakMasteredWord('${clean}')" aria-label="播放單字發音" title="播放單字發音">🔊</button>
        <div class="zh-text">
          <span class="conquer-card-word task-title-free">${wordDisplay}</span>
          ${defHtml}
          ${posHtml}
        </div>
      </div>
      <div class="sents-vertical-list">
        ${sentsHtml}
      </div>
    </div>
  `;
