          ${cycleSelectBarHtml}
          <div class="week-conquer-tip" style="display:flex; align-items:flex-start; gap:8px; padding:4px 2px 4px; font-size:12.5px; line-height:1.55; color:var(--ink2);">
            <span style="font-size:15px; flex-shrink:0; line-height:1.3;">💡</span>
            <div style="flex:1; line-height:1.55;">
              ${tipText}
            </div>
          </div>
          <div class="conquer-level-groups">
            ${levelSectionsHtml}
          </div>
          ${levelStandardDetailsHtml}
        </div>
      `;
    }

    // 綁定各關卡內的單字標籤點擊（即時就地切換卡片並朗讀）
    conquerDetailsContainer.querySelectorAll(".conquer-word-tab").forEach(tab => {
      tab.onclick = (e) => {
        e.stopPropagation();
        const lv = tab.getAttribute("data-lv");
        const w = tab.getAttribute("data-word");
        if (lv && w) {
          window._conquerActiveWordByLevel[lv] = w;
          speakMasteredWord(w);
          window.renderTeacherStudentConquerSection(window._teacherActiveConquerCycle);
        }
      };
    });

    // 綁定關卡展開全部 / 逐字檢視模式切換按鈕
    conquerDetailsContainer.querySelectorAll(".conquer-mode-toggle-btn").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const lv = btn.getAttribute("data-lv");
        if (lv) {
          window._conquerViewModeByLevel[lv] = (window._conquerViewModeByLevel[lv] === "all" ? "single" : "all");
          window.renderTeacherStudentConquerSection(window._teacherActiveConquerCycle);
        }
      };
    });

    // 綁定教師端待攻克週次切換事件
    const selectEl = conquerDetailsContainer.querySelector("#st-conquer-cycle-select");
    if (selectEl) {
      selectEl.onchange = (e) => {
        window.renderTeacherStudentConquerSection(e.target.value);
      };
    }
    const btnCurEl = conquerDetailsContainer.querySelector("#btn-st-conquer-cycle-current");
    const btnPrevEl = conquerDetailsContainer.querySelector("#btn-st-conquer-cycle-prev");
    const btnNextEl = conquerDetailsContainer.querySelector("#btn-st-conquer-cycle-next");
    if (btnPrevEl) {
      btnPrevEl.onclick = (e) => {
        e.stopPropagation();
        const targetW = Math.max(1, activeW - 1);
        window.renderTeacherStudentConquerSection("week_" + targetW);
      };
    }
    if (btnCurEl) {
      btnCurEl.onclick = (e) => {
        e.stopPropagation();
        window.renderTeacherStudentConquerSection("week_" + curSemWeek);
      };
    }
    if (btnNextEl) {
      btnNextEl.onclick = (e) => {
        e.stopPropagation();
        const targetW = Math.min(20, activeW + 1);
        window.renderTeacherStudentConquerSection("week_" + targetW);
      };
    }
  };

  const stConquerSec = document.getElementById("studentWeekConquerCard");
  const stConquerContainer = document.getElementById("st-week-conquer-container");
  const stConquerToggleBtn = document.getElementById("btn-toggle-st-conquer-card");

  if (stConquerToggleBtn && stConquerSec) {
    stConquerToggleBtn.onclick = (e) => {
      e.preventDefault();
      const isHidden = (stConquerContainer && stConquerContainer.style.display === "none") || stConquerSec.classList.contains("is-collapsed");
      if (isHidden) {
        if (stConquerContainer) stConquerContainer.style.display = "block";
        stConquerSec.classList.remove("is-collapsed");
        stConquerToggleBtn.innerHTML = "收合";
        if (typeof window.renderTeacherStudentConquerSection === "function") {
          window.renderTeacherStudentConquerSection();
        }
        stConquerSec.scrollIntoView({ behavior: "smooth", block: "nearest" });
      } else {
        if (stConquerContainer) stConquerContainer.style.display = "none";
        stConquerSec.classList.add("is-collapsed");
        stConquerToggleBtn.innerHTML = "展開";
      }
    };
  }

  window.renderTeacherStudentConquerSection("current");
}

function renderStudentSummary(resp) {
  window._currentTeacherConquerResp = resp;
  window._currentTeacherConquerAgent = resp.agentData || null;
  if (typeof _resolveWordsCache !== "undefined" && _resolveWordsCache) _resolveWordsCache.clear();
  const sumCard = document.getElementById("studentSummaryCard");
  if (!sumCard) return;

  // 1. 綁定「學習足跡 Records」展開/收合切換事件
  const sumBtn = document.getElementById("sumBtn");
  const sumClose = document.getElementById("sumClose");
  const sumPanel = document.getElementById("summary");
  const sumRecordCard = document.getElementById("studentLearningRecordCard") || document.getElementById("learning-record-section");
  if (sumBtn && sumPanel) {
    sumBtn.onclick = () => {
      const isHidden = (sumPanel.style.display === "none");
      sumPanel.style.display = isHidden ? "block" : "none";
      sumBtn.innerHTML = isHidden ? "收合" : "展開";
      if (sumRecordCard) sumRecordCard.classList.toggle("is-collapsed", !isHidden);
      if (isHidden) {
        sumPanel.scrollIntoView({ behavior: "smooth", block: "nearest" });
      }
    };
  }
  if (sumClose && sumPanel) {
    sumClose.onclick = () => {
      sumPanel.style.display = "none";
      if (sumBtn) sumBtn.innerHTML = "展開";
      if (sumRecordCard) sumRecordCard.classList.add("is-collapsed");
    };
  }

  // 綁定「學習進度 Progress」展開/收起
  const progToggleBtn = document.getElementById("btn-toggle-progress-card");
  const progSec = document.getElementById("studentProgressCard");
  const progBody = document.getElementById("progress-collapsible-body");
  if (progToggleBtn && progSec && progBody) {
    progToggleBtn.onclick = (e) => {
      e.preventDefault();
      const isHidden = (progBody.style.display === "none") || progSec.classList.contains("is-collapsed");
      if (isHidden) {
        progBody.style.display = "block";
        progSec.classList.remove("is-collapsed");
        progToggleBtn.innerHTML = "收合";
      } else {
        progBody.style.display = "none";
        progSec.classList.add("is-collapsed");
        progToggleBtn.innerHTML = "展開";
      }
    };
  }

  const agent = resp.agentData || null;
  const rawRow = (resp.data && resp.data.length > 0) ? resp.data[0] : [];
  const currentStUser = viewingStudent || currentUser || resp.username || "";

  // 帳號名已依需求移除
  const userTagEl = document.getElementById("stUserTag");
  if (userTagEl) {
    userTagEl.innerHTML = "";
  }

  // 2. 建立相異單字綜合彙整庫 (Unified Word Map)：將指定測驗與自由練習的所有相異單字完整加總聯集
  const unifiedWords = new Map(); // key: lowercase word -> { word, box, tested, correct, modes: { listen: {a,c}, pick: {a,c}, scramble: {a,c}, trap: {a,c} } }

  const getOrCreateWord = (rawW) => {
    const w = resolveWord(rawW).trim().toLowerCase();
    if (!w || /^w\d+$/i.test(w)) return null;
    let entry = unifiedWords.get(w);
    if (!entry) {
      entry = {
        word: w,
        box: 0,
        tested: false,
        correct: false,
        modes: {
          listen: { a: 0, c: 0 },
          pick: { a: 0, c: 0 },
          scramble: { a: 0, c: 0 },
          trap: { a: 0, c: 0 }
        }
      };
      unifiedWords.set(w, entry);
    }
    return entry;
  };

  // 2-1. 匯入 agent.box
  if (agent && agent.box) {
    for (const [k, bVal] of Object.entries(agent.box)) {
      const e = getOrCreateWord(k);
      if (e) {
        e.box = Math.max(e.box, Number(bVal) || 0);
        if (bVal > 0) {
          e.tested = true;
          e.correct = true;
        }
      }
    }
  }

  // 2-2. 匯入 agent.stat
  if (agent && agent.stat) {
    for (const [k, s] of Object.entries(agent.stat)) {
      const e = getOrCreateWord(k);
      if (e && s) {
        if (s.a > 0) e.tested = true;
        if (s.c > 0) {
          e.correct = true;
          if (e.box <= 0) e.box = 1;
        }
      }
    }
  }

  // 2-3. 匯入 agent.dailyPractice (自由練習各日明細)
  if (agent && agent.dailyPractice) {
    for (const day of Object.values(agent.dailyPractice)) {
      if (day && day.words) {
        for (const [k, info] of Object.entries(day.words)) {
          const rawW = (info && info.word) ? info.word : k;
          const e = getOrCreateWord(rawW);
          if (e) {
            e.tested = true;
            if (info && (info.correct > 0 || info.passed)) {
              e.correct = true;
              if (e.box <= 0) e.box = 1;
            }
          }
        }
      }
    }
  }

  // 2-4. 匯入 agent.mwords (四大模式不重複單字)
  if (agent && agent.mwords) {
    ["listen", "pick", "scramble", "trap"].forEach(m => {
      const mw = agent.mwords[m];
      if (mw) {
        for (const [k, obj] of Object.entries(mw)) {
          const e = getOrCreateWord(k);
          if (e && obj) {
            if (obj.a > 0) {
              e.tested = true;
              e.modes[m].a = Math.max(e.modes[m].a, 1);
            }
            if (obj.c > 0) {
              e.correct = true;
              if (e.box <= 0) e.box = 1;
              e.modes[m].c = Math.max(e.modes[m].c, 1);
            }
          }
        }
      }
    });
  }

  // 2-5. 匯入所有指定測驗 (Task Records)：加總至整體進度與聽拼模式！
  const allTasks = [];
  if (Array.isArray(resp.dailyTaskHistory)) allTasks.push(...resp.dailyTaskHistory);
  if (resp.todayTaskResult) allTasks.push(resp.todayTaskResult);
  if (Array.isArray(window.cachedStudentDailyHistory)) allTasks.push(...window.cachedStudentDailyHistory);
  if (Array.isArray(window.cachedBackupTaskHistory)) allTasks.push(...window.cachedBackupTaskHistory);

  allTasks.forEach(task => {
    if (!task) return;
    const taskWords = Array.isArray(task.words) ? task.words : [];
    const taskCorr = Array.isArray(task.correctWords) ? task.correctWords : [];

    taskWords.forEach(w => {
      const e = getOrCreateWord(w);
      if (e) {
        e.tested = true;
        // 指定測驗為聽音拼字，記入 listen 模式
        e.modes.listen.a = Math.max(e.modes.listen.a, 1);
      }
    });

    taskCorr.forEach(w => {
      const e = getOrCreateWord(w);
      if (e) {
        e.tested = true;
        e.correct = true;
        if (e.box <= 0) e.box = 1;
        e.modes.listen.c = Math.max(e.modes.listen.c, 1);
        e.modes.listen.a = Math.max(e.modes.listen.a, 1);
      }
    });
  });

  // 2-6. 歷史相容自動回填：若單字在 stat 或 box 中已受測/答對，但未被記錄在任何特定模式中，
  // 該單字必定是在預設模式「聽與拼」中作答，自動歸入 listen 模式！
  unifiedWords.forEach(e => {
    if (e.tested && e.modes.listen.a === 0 && e.modes.pick.a === 0 && e.modes.scramble.a === 0 && e.modes.trap.a === 0) {
      e.modes.listen.a = 1;
      if (e.correct) e.modes.listen.c = 1;
    }
  });

  // 3. 學習進度 Progress (共 2055 字)：精通、練習中、學習中
  let learn = 0, prac = 0, mast = 0;
  unifiedWords.forEach(e => {
    if (e.correct) {
      if (e.box >= 3) mast++;
      else if (e.box === 2) prac++;
      else learn++; // e.box === 1
    }
  });

  // 若 unifiedWords 仍無數據（如無 JSON 舊帳號），降級採用正確 header 索引解析試算表 row
  if (learn === 0 && prac === 0 && mast === 0 && rawRow && rawRow.length > 7) {
    const headers = resp.headers || [];
    const getIdx = (keywords, def) => {
      const i = headers.findIndex(h => keywords.some(k => String(h).includes(k)));
      return i >= 0 ? i : def;
    };
    learn = parseInt(rawRow[getIdx(["學習中"], 5)]) || 0;
    prac  = parseInt(rawRow[getIdx(["練習中"], 6)]) || 0;
    mast  = parseInt(rawRow[getIdx(["精通"], 7)]) || 0;
  }

  const totalVocab = 2055;
  const pctLearn = Math.min(100, Math.max(0, (learn / totalVocab) * 100)).toFixed(1);
  const pctPrac  = Math.min(100, Math.max(0, (prac / totalVocab) * 100)).toFixed(1);
  const pctMast  = Math.min(100, Math.max(0, (mast / totalVocab) * 100)).toFixed(1);

  const elBarL = document.getElementById("b-learn") || document.getElementById("stBarLearning");
  if (elBarL) elBarL.style.width = pctLearn + "%";
  const elBarP = document.getElementById("b-prac") || document.getElementById("stBarPracticing");
  if (elBarP) elBarP.style.width = pctPrac + "%";
  const elBarM = document.getElementById("b-mast") || document.getElementById("stBarMastered");
  if (elBarM) elBarM.style.width = pctMast + "%";

  const elNumL = document.getElementById("n-learn") || document.getElementById("stNumLearning");
  if (elNumL) elNumL.innerText = learn.toLocaleString();
  const elNumP = document.getElementById("n-prac") || document.getElementById("stNumPracticing");
  if (elNumP) elNumP.innerText = prac.toLocaleString();
  const elNumM = document.getElementById("n-mast") || document.getElementById("stNumMastered");
  if (elNumM) elNumM.innerText = mast.toLocaleString();
  const elNumT = document.getElementById("n-total") || document.getElementById("stNumTotal");
  if (elNumT) elNumT.innerText = totalVocab.toLocaleString();

  // 數值嚴密相符：共答對單字 ≡ 學習中 + 練習中 + 精通
  const distinctCorrect = (learn + prac + mast);
  const vocabRate = totalVocab > 0 ? Math.round((distinctCorrect / totalVocab) * 100) : 0;
  const headers = resp.headers || [];
  const getIdx = (keywords, def) => {
    const i = headers.findIndex(h => keywords.some(k => String(h).includes(k)));
    return i >= 0 ? i : def;
  };
  const pts = (agent && agent.points !== undefined) ? agent.points : (parseInt(rawRow[getIdx(["分數"], 2)]) || 0);

  const elNumC = document.getElementById("n-correct");
  if (elNumC) elNumC.innerText = distinctCorrect.toLocaleString();
  const elNumR = document.getElementById("n-rate");
  if (elNumR) elNumR.innerText = vocabRate + "%";
  const elNumS = document.getElementById("n-score");
  if (elNumS) elNumS.innerText = pts.toLocaleString();

  // 4. 各關卡進度 (Level 1 ~ 5) - 由 unifiedWords 相異單字綜合庫計算
  const lvTbody = document.getElementById("stLevelProgressTbody");
  if (lvTbody) {
    let lvRowsHtml = "";
    const lvNames  = ["入門", "基礎", "進階", "挑戰", "精熟"];
    const lvColors = ["#2FB47C", "#2D9CDB", "#6C4CE0", "#E8892B", "#E0567B"];

    if (!window._wordBankLevelMap && typeof WORD_BANK_2000 !== "undefined" && Array.isArray(WORD_BANK_2000)) {
      window._wordBankLevelMap = new Map();
      for (let i = 0; i < WORD_BANK_2000.length; i++) {
        window._wordBankLevelMap.set(WORD_BANK_2000[i][0].toLowerCase(), WORD_BANK_2000[i][2]);
      }
    }
    const bMap = window._wordBankLevelMap || null;

    const levelMastMap = [0, 0, 0, 0, 0, 0];
    const levelPracMap = [0, 0, 0, 0, 0, 0];
    const levelLearnMap = [0, 0, 0, 0, 0, 0];
    const levelTestedMap = [0, 0, 0, 0, 0, 0];
    const levelTestedCorrMap = [0, 0, 0, 0, 0, 0];

    if (bMap) {
      unifiedWords.forEach(e => {
        const lv = bMap.get(e.word);
        if (lv >= 1 && lv <= 5) {
          if (e.tested) levelTestedMap[lv]++;
          if (e.correct) {
            levelTestedCorrMap[lv]++;
            if (e.box >= 3) levelMastMap[lv]++;
            else if (e.box === 2) levelPracMap[lv]++;
            else levelLearnMap[lv]++;
          }
        }
      });
    }

    for (let lv = 1; lv <= 5; lv++) {
      let lMast = levelMastMap[lv] || 0;
      let lPrac = levelPracMap[lv] || 0;
      let lLearn = levelLearnMap[lv] || 0;
      let lTotCorr = lLearn + lPrac + lMast;
      let lTestedWords = levelTestedMap[lv] || 0;

      // 備援：若無單字細項，降級採用 lstat 或 rawRow
      if (lTestedWords === 0 && agent && agent.lstat && (agent.lstat[lv] || agent.lstat[String(lv)])) {
        const ls = agent.lstat[lv] || agent.lstat[String(lv)];
        lTotCorr = ls.c || 0;
        lTestedWords = ls.a || 0;
      } else if (lTestedWords === 0 && rawRow && rawRow.length > 10 + lv) {
        const parts = String(rawRow[10 + lv] || "").split("/");
        lTotCorr = parseInt(parts[0]) || 0;
        lTestedWords = parseInt(parts[1]) || 0;
      }

      lvRowsHtml += `<tr><td class="st-level-name"><span style="color:${lvColors[lv-1]}">●</span> Level ${lv}「${lvNames[lv-1]}」</td><td class="st-level-stats"><div class="level-stats-grid"><span class="st-item st-learn"><span class="st-lbl">學習中</span><b class="tnum st-num st-num-learn">${lLearn}</b>字</span><span class="st-sep">/</span><span class="st-item st-prac"><span class="st-lbl">練習中</span><b class="tnum st-num st-num-prac">${lPrac}</b>字</span><span class="st-sep">/</span><span class="st-item st-mast"><span class="st-lbl">精通</span><b class="tnum st-num st-num-mast">${lMast}</b>字</span><span class="st-sep">/</span><span class="st-item st-total"><span class="st-lbl">共答對</span><b class="tnum st-num st-num-total">${lTotCorr}</b>字</span></div></td></tr>`;
    }
    lvTbody.innerHTML = lvRowsHtml;
  }

  // 5. 🎮 4 大練習模式答對數 (以答對數為主視覺，輔以總受測單字數與率)
  let mListen = { a: 0, c: 0 }, mPick = { a: 0, c: 0 }, mScram = { a: 0, c: 0 }, mTrap = { a: 0, c: 0 };
  unifiedWords.forEach(e => {
    if (e.modes.listen.a > 0) mListen.a++;
    if (e.modes.listen.c > 0) mListen.c++;
    if (e.modes.pick.a > 0) mPick.a++;
    if (e.modes.pick.c > 0) mPick.c++;
    if (e.modes.scramble.a > 0) mScram.a++;
    if (e.modes.scramble.c > 0) mScram.c++;
    if (e.modes.trap.a > 0) mTrap.a++;
    if (e.modes.trap.c > 0) mTrap.c++;
  });

  const parseModeCell = (cell) => {
    const parts = String(cell || "").split("/");
    return { c: parseInt(parts[0]) || 0, a: parseInt(parts[1]) || 0 };
  };

  // 備援：若無單字級模式細項，從試算表 row 或 mstat 取得
  if (mListen.a === 0 && mPick.a === 0 && mScram.a === 0 && mTrap.a === 0) {
    if (rawRow && rawRow.length >= 20) {
      const getModeIdx = (name, def) => {
        const i = headers.findIndex(h => String(h).includes(name));
        return i >= 0 ? i : def;
      };
      mListen = parseModeCell(rawRow[getModeIdx("聽與拼", 16)]);
      mPick   = parseModeCell(rawRow[getModeIdx("選拼法", 17)]);
      mScram  = parseModeCell(rawRow[getModeIdx("重組", 18)]);
      mTrap   = parseModeCell(rawRow[getModeIdx("填空", 19)]);
    } else if (agent && agent.mstat) {
      const mstat = agent.mstat;
      mListen = mstat.listen ? { a: mstat.listen.a || 0, c: mstat.listen.c || 0 } : { a: 0, c: 0 };
      mPick   = mstat.pick   ? { a: mstat.pick.a   || 0, c: mstat.pick.c   || 0 } : { a: 0, c: 0 };
      mScram  = mstat.scramble ? { a: mstat.scramble.a || 0, c: mstat.scramble.c || 0 } : { a: 0, c: 0 };
      mTrap   = mstat.trap   ? { a: mstat.trap.a   || 0, c: mstat.trap.c   || 0 } : { a: 0, c: 0 };
    }
  }

  const rListen = mListen.a > 0 ? Math.round((mListen.c / mListen.a) * 100) : 0;
  const rPick   = mPick.a   > 0 ? Math.round((mPick.c   / mPick.a)   * 100) : 0;
  const rScram  = mScram.a  > 0 ? Math.round((mScram.c  / mScram.a)  * 100) : 0;
  const rTrap   = mTrap.a   > 0 ? Math.round((mTrap.c   / mTrap.a)   * 100) : 0;

  const elListenAtt = document.getElementById("stModeListenAttempts");
  if (elListenAtt) elListenAtt.innerText = `${mListen.c.toLocaleString()} 字`;
  const elListenSub = document.getElementById("stModeListenSub");
  if (elListenSub) elListenSub.innerText = `受測 ${mListen.a} 字 (${rListen}%)`;

  const elPickAtt = document.getElementById("stModePickAttempts");
  if (elPickAtt) elPickAtt.innerText = `${mPick.c.toLocaleString()} 字`;
  const elPickSub = document.getElementById("stModePickSub");
  if (elPickSub) elPickSub.innerText = `受測 ${mPick.a} 字 (${rPick}%)`;

  const elScramAtt = document.getElementById("stModeScrambleAttempts");
  if (elScramAtt) elScramAtt.innerText = `${mScram.c.toLocaleString()} 字`;
  const elScramSub = document.getElementById("stModeScrambleSub");
  if (elScramSub) elScramSub.innerText = `受測 ${mScram.a} 字 (${rScram}%)`;

  const elTrapAtt = document.getElementById("stModeTrapAttempts");
  if (elTrapAtt) elTrapAtt.innerText = `${mTrap.c.toLocaleString()} 字`;
  const elTrapSub = document.getElementById("stModeTrapSub");
  if (elTrapSub) elTrapSub.innerText = `受測 ${mTrap.a} 字 (${rTrap}%)`;

  // 5. 📅 練習紀錄（最近 4 週）熱力圖（100% 比照遊戲網站演算法）
  const agentHistoryData = (agent && agent.history) ? agent.history : {};
  const dpMap = (agent && agent.dailyPractice) ? agent.dailyPractice : {};
  const taskRecords = (agent && agent._taskRecords) ? agent._taskRecords : {};
  const historyList = [];

  // 彙整學生所有指定測驗與週末測驗紀錄 (完全對齊遊戲端 getCombinedTaskHistory)
  let stHistory = taskRecords["student_task_history"];
  if (typeof stHistory === "string") { try { stHistory = JSON.parse(stHistory); } catch(_) {} }
  if (!Array.isArray(stHistory)) stHistory = resp.dailyTaskHistory || window.cachedStudentDailyHistory || [];
  if (Array.isArray(stHistory)) {
    stHistory.forEach(item => {
      if (item && item.date) {
        const st = String(item.status || "");
        const isExpUntested = st.includes("未受測") || st.includes("缺席") || st.includes("缺考") || st.includes("未作答");
        if (!item.taskName || item.taskName !== "自主練習" || isExpUntested) {
          historyList.push({
            ...item,
            date: normalizeDateKey(item.date),
            taskName: (isExpUntested && (!item.taskName || item.taskName === "自主練習" || String(item.taskName).includes("未指派")))
              ? "每日指定測驗"
              : item.taskName
          });
        }
      }
    });
  }

  let todaySum = taskRecords["today_task_summary"] || resp.todayTaskResult || window.cachedStudentTodayTaskResult || null;
  if (typeof todaySum === "string") { try { todaySum = JSON.parse(todaySum); } catch(_) {} }
  if (todaySum && todaySum.date && todaySum.taskName && todaySum.taskName !== "自主練習") {
    const sNormDate = normalizeDateKey(todaySum.date);
    const existIdx = historyList.findIndex(item => item && normalizeDateKey(item.date) === sNormDate);
    const item = {
      date: sNormDate,
      taskName: todaySum.taskName,
      score: (todaySum.score !== undefined && todaySum.total !== undefined) ? `${todaySum.score}/${todaySum.total}` : (todaySum.score || "—"),
      rate: todaySum.rate || "—",
      status: todaySum.completed ? "🟢 已完成" : "🟡 作答中",
      wrongWords: todaySum.wrongWords || [],
      words: todaySum.words || []
    };
    if (existIdx >= 0) {
      if (!historyList[existIdx].status || !historyList[existIdx].status.includes("已完成") || todaySum.completed) {
        historyList[existIdx] = { ...historyList[existIdx], ...item };
      }
    } else {
      historyList.push(item);
    }
  }

  for (const k in taskRecords) {
    if (k.startsWith("weekend_remedy_")) {
      const mondayStr = normalizeDateKey(k.slice("weekend_remedy_".length));
      if (mondayStr) {
        let rem = taskRecords[k];
        if (typeof rem === "string") { try { rem = JSON.parse(rem); } catch(_) {} }
        if (rem) {
          const mDate = new Date(mondayStr.replace(/-/g, "/"));
          if (!isNaN(mDate.getTime())) {
            const satD = new Date(mDate.getFullYear(), mDate.getMonth(), mDate.getDate() + 5);
            const satKey = normalizeDateKey(formatDateYMD(satD));
            if (rem.satCompleted) {
              const satCorr = Array.isArray(rem.satCorrectWords) ? rem.satCorrectWords : [];
              const satWrong = Array.isArray(rem.satWrongWords) ? rem.satWrongWords : [];
              const satWords = Array.from(new Set([...satCorr, ...satWrong]));
              const satItem = {
                date: satKey,
                taskName: `🎯 ${formatWeekendTaskDate(satKey)} 週末待攻克測驗作答紀錄`,
                score: rem.satScore || (satWords.length ? `${satCorr.length}/${satWords.length}` : "已完成"),
                rate: rem.satRate || (satWords.length ? `${Math.round((satCorr.length / satWords.length) * 100)}%` : "100%"),
                status: "🟢 已完成",
                wrongWords: satWrong,
                correctWords: satCorr,
                words: satWords,
                isWeekend: true
              };
              const existIdx = historyList.findIndex(item => item && normalizeDateKey(item.date) === satKey);
              if (existIdx >= 0) historyList[existIdx] = { ...historyList[existIdx], ...satItem };
              else historyList.push(satItem);
            }
            const satClearedAll = rem.satCompleted && (!rem.satWrongWords || rem.satWrongWords.length === 0);
            const sunD = new Date(mDate.getFullYear(), mDate.getMonth(), mDate.getDate() + 6);
            const sunKey = normalizeDateKey(formatDateYMD(sunD));
            if (rem.sunCompleted && !satClearedAll) {
              const sunCorr = Array.isArray(rem.sunCorrectWords) ? rem.sunCorrectWords : [];
              const sunWrong = Array.isArray(rem.sunWrongWords) ? rem.sunWrongWords : [];
              const sunWords = Array.from(new Set([...sunCorr, ...sunWrong]));
              const sunItem = {
                date: sunKey,
                taskName: `🎯 ${formatWeekendTaskDate(sunKey)} 週末待攻克測驗作答紀錄`,
                score: rem.sunScore || (sunWords.length ? `${sunCorr.length}/${sunWords.length}` : "已完成"),
                rate: rem.sunRate || (sunWords.length ? `${Math.round((sunCorr.length / sunWords.length) * 100)}%` : "100%"),
                status: "🟢 已完成",
                wrongWords: sunWrong,
                correctWords: sunCorr,
                words: sunWords,
                isWeekend: true
              };
              const existIdx = historyList.findIndex(item => item && normalizeDateKey(item.date) === sunKey);
              if (existIdx >= 0) historyList[existIdx] = { ...historyList[existIdx], ...sunItem };
              else historyList.push(sunItem);
            }
          }
        }
      }
    } else if (k.startsWith("task_summary_")) {
      const kDate = normalizeDateKey(k.slice("task_summary_".length));
      if (kDate && /^\d{4}-\d{2}-\d{2}$/.test(kDate)) {
        let ts = taskRecords[k];
        if (typeof ts === "string") { try { ts = JSON.parse(ts); } catch(_) {} }
        if (ts && ts.completed && ts.taskName && ts.taskName !== "自主練習") {
          const tsItem = {
            date: kDate,
            taskName: ts.taskName,
            score: (ts.score !== undefined && ts.total !== undefined) ? `${ts.score}/${ts.total}` : (ts.score || "已完成"),
            rate: ts.rate || "100%",
            status: "🟢 已完成",
            wrongWords: ts.wrongWords || [],
            words: ts.words || []
          };
          const existIdx = historyList.findIndex(item => item && normalizeDateKey(item.date) === kDate);
          if (existIdx >= 0) historyList[existIdx] = { ...historyList[existIdx], ...tsItem };
          else historyList.push(tsItem);
        }
      }
    }
  }

  if (resp.data && Array.isArray(resp.data)) {
    resp.data.forEach(r => {
      if (!r || !r[0]) return;
      const rDate = normalizeDateKey(r[0]);
      if (!rDate || !/^\d{4}-\d{2}-\d{2}$/.test(rDate)) return;
      const info = extractRowTaskInfo(r, resp.headers);
      if (info) {
        const st = String(info.status || "");
        const isExpUntested = st.includes("未受測") || st.includes("缺席") || st.includes("缺考") || st.includes("未作答");
        if (isExpUntested || (info.taskName && info.taskName !== "自主練習" && !info.taskName.includes("自由練習") && !info.taskName.includes("未指派") && ((info.score && info.score !== "—") || st.includes("已完成")))) {
          const existIdx = historyList.findIndex(item => item && normalizeDateKey(item.date) === rDate);
          const rItem = {
            date: rDate,
            taskName: (isExpUntested && (!info.taskName || info.taskName === "自主練習" || info.taskName.includes("未指派"))) ? "每日指定測驗" : (info.taskName || "指定測驗"),
            score: info.score || "—",
            rate: info.rate || "—",
            status: isExpUntested ? "⚪ 未受測" : "● 已完成",
            wrongWords: info.wrongWords || [],
            words: []
          };
          if (existIdx >= 0) {
            const old = historyList[existIdx];
            if (!old.status || !old.status.includes("已完成")) {
              historyList[existIdx] = { ...old, ...rItem };
            }
          } else {
            historyList.push(rItem);
          }
        }
      }
    });
  }

  // Pre-index historyList by normalized date -> O(1) lookup
  const taskByDateMap = new Map();
  for (let i = 0; i < historyList.length; i++) {
    const item = historyList[i];
    if (item && item.date) {
      const st = String(item.status || "");
      const isExpUntested = st.includes("未受測") || st.includes("缺席") || st.includes("缺考") || st.includes("未作答");
      if (!item.taskName || item.taskName !== "自主練習" || isExpUntested) {
        const nd = normalizeDateKey(item.date);
        if (nd) {
          let arr = taskByDateMap.get(nd);
          if (!arr) { arr = []; taskByDateMap.set(nd, arr); }
          arr.push(item);
        }
      }
    }
  }

  const taskDayStatCache = new Map();
  const getTaskDayStat = (dateKey) => {
    const norm = normalizeDateKey(dateKey);
    if (taskDayStatCache.has(norm)) return taskDayStatCache.get(norm);
    if (isSatClearedOnSundayDate(norm, taskRecords, historyList)) {
      const res = {
        a: 0, c: 0, rate: 0,
        statusType: "unassigned",
        statusLabel: "未指派測驗",
        levelClass: "h0",
        badgeTier: "tier-gray"
      };
      taskDayStatCache.set(norm, res);
      return res;
    }

    const tArr = taskByDateMap.get(norm);
    const tRec = (tArr && (tArr.find(r => r && r.status && r.status.includes("已完成")) || tArr.find(r => r && r.score && r.score !== "—" && r.score !== "尚未開始") || tArr[0])) || null;
    const isExplicitUntested = tRec && tRec.status && (tRec.status.includes("未受測") || tRec.status.includes("缺席") || tRec.status.includes("缺考") || tRec.status.includes("未作答"));
    const isUnassignedTask = !tRec || (!isExplicitUntested && (!tRec.taskName || tRec.taskName === "⚪ 未指派" || tRec.taskName === "未指派" || tRec.taskName === "自主練習" || String(tRec.taskName).includes("未指派") || (tRec.status && tRec.status.includes("未指派"))));
    if (isUnassignedTask) {
      const res = {
        a: 0, c: 0, rate: 0,
        statusType: "unassigned",
        statusLabel: "未指派測驗",
        levelClass: "h0",
        badgeTier: "tier-gray"
      };
      taskDayStatCache.set(norm, res);
      return res;
    }

    let tAtt = parseInt(tRec.attempts) || 0;
    let tCor = parseInt(tRec.correct) || 0;
    if (!tAtt && tRec.score && String(tRec.score).includes("/")) {
      const sp = String(tRec.score).split("/");
      tCor = parseInt(sp[0], 10) || 0;
      tAtt = parseInt(sp[1], 10) || 0;
    }

    const statusStr = String(tRec.status || "");
    const resolved = resolveTaskWords(tRec, norm, agent);
    const resolvedRaw = resolved.rawWords || [];
    const resolvedCorr = resolved.correctList || [];
    const resolvedWrong = resolved.wrongList || [];
    const resolvedAnsCount = resolvedCorr.length + resolvedWrong.length;
    let taskWordsCount = resolvedRaw.length || (Array.isArray(tRec.words) && tRec.words.length) || tAtt || 5;

    if (!tAtt && resolvedAnsCount > 0) {
      tAtt = resolvedAnsCount;
      tCor = resolvedCorr.length;
    }
    if (resolvedCorr.length > 0) {
      tCor = Math.max(tCor, resolvedCorr.length);
    }
    if (tRec.score && String(tRec.score).includes("/")) {
      const sp = String(tRec.score).split("/");
      const sTot = parseInt(sp[1], 10);
      if (!isNaN(sTot) && sTot > taskWordsCount) taskWordsCount = sTot;
    }
    if (taskWordsCount < resolvedAnsCount) taskWordsCount = resolvedAnsCount;
    if (taskWordsCount < tAtt) taskWordsCount = tAtt;

    let tRate = taskWordsCount > 0 ? Math.round((tCor / taskWordsCount) * 100) : (tAtt > 0 ? Math.round((tCor / tAtt) * 100) : (parseInt(tRec.rate) || 0));
    const isFinished = statusStr.includes("已完成") || (!statusStr.includes("未受測") && !statusStr.includes("尚未開始") && ((tAtt > 0 && tAtt >= taskWordsCount) || (resolvedAnsCount > 0 && resolvedAnsCount >= taskWordsCount)));

    const isUnfinishedAttempt = !isFinished && (
      (taskWordsCount > 0 && resolvedAnsCount > 0 && resolvedAnsCount < taskWordsCount && resolvedWrong.length === 0) ||
      (taskWordsCount > 0 && tAtt > 0 && tAtt < taskWordsCount && resolvedWrong.length === 0)
    );

    const isIncomplete = !isFinished && (
      isUnfinishedAttempt ||
      statusStr.includes("作答中") ||
      statusStr.includes("中斷") ||
      statusStr.includes("未完成") ||
      tRec.inProgress === true
    );

    const shortD = unpadDateKey(norm);
    const slashD = norm.replace(/-/g, "/");
    const dpF = dpMap[norm] || dpMap[shortD] || dpMap[slashD];
    const hF = agentHistoryData[norm] || agentHistoryData[shortD] || agentHistoryData[slashD];
    const hasLoggedInOrFree = !!((dpF && (dpF.attempts > 0 || (dpF.words && Object.keys(dpF.words).length > 0))) || (hF && hF.a > 0) || (tRec.freeTested > 0) || statusStr.includes("登入未受測") || statusStr.includes("登入未作答"));

    let res;
    if (isFinished) {
      const level = tRate < 60 ? 1 : tRate < 70 ? 2 : tRate < 80 ? 3 : tRate < 90 ? 4 : tRate < 100 ? 5 : 6;
      const badgeTier = tRate === 100 ? "tier-green-perfect" : (tRate >= 80 ? "tier-green-high" : (tRate >= 60 ? "tier-green-mid" : "tier-green-low"));
      res = {
        a: tAtt, c: tCor, rate: tRate,
        wordsCount: taskWordsCount,
        statusType: "completed",
        statusLabel: `正確率 ${tRate}%`,
        levelClass: `h${level}`,
        badgeTier: badgeTier
      };
    } else if (isIncomplete) {
      const curCorr = resolvedCorr.length || tCor;
      const curTot = taskWordsCount || tAtt || 5;
      res = {
        a: tAtt, c: tCor, rate: tRate,
        wordsCount: taskWordsCount,
        statusType: "incomplete",
        statusLabel: `作答中斷 (${curCorr}/${curTot})`,
        levelClass: "h-status-blue",
        badgeTier: "tier-status-blue"
      };
    } else if (hasLoggedInOrFree) {
      res = {
        a: 0, c: 0, rate: 0,
        wordsCount: taskWordsCount,
        statusType: "login_untested",
        statusLabel: "登入未受測",
        levelClass: "h-status-yellow",
        badgeTier: "tier-status-yellow"
      };
    } else {
      res = {
        a: 0, c: 0, rate: 0,
        wordsCount: taskWordsCount,
        statusType: "absent_untested",
        statusLabel: "缺席未受測",
        levelClass: "h-status-red",
        badgeTier: "tier-status-red"
      };
    }
    taskDayStatCache.set(norm, res);
    return res;
  };

  const nowDt = new Date();
  const taskHeatDays = [];
  for (let i = 27; i >= 0; i--) {
    const dt = new Date(nowDt);
    dt.setDate(dt.getDate() - i);
    const kDash = formatDateYMD(dt);
    const stat = getTaskDayStat(kDash);
    taskHeatDays.push({ key: kDash, ...stat });
  }

  const activeTaskDateSet = new Set();
  for (const norm of taskByDateMap.keys()) {
    if (norm && getTaskDayStat(norm).a > 0) activeTaskDateSet.add(norm);
  }
  const taskTotal = activeTaskDateSet.size;
  let taskStreak = 0;
  const hasTaskDayOff = (off) => {
    const dt = new Date(nowDt);
    dt.setDate(dt.getDate() - off);
    return activeTaskDateSet.has(formatDateYMD(dt));
  };
  const taskStartOff = hasTaskDayOff(0) ? 0 : hasTaskDayOff(1) ? 1 : null;
  if (taskStartOff !== null) {
    let k = taskStartOff;
    while (hasTaskDayOff(k)) { taskStreak++; k++; }
  }
  const toDayIdx = (ds) => {
    const [y, m, day] = String(ds || "").split("-").map(Number);
    if (isNaN(y) || isNaN(m) || isNaN(day)) return null;
    return Math.round(new Date(y, m - 1, day).getTime() / 86400000);
  };
  const taskDayIdxs = Array.from(activeTaskDateSet).map(toDayIdx).filter(x => x !== null && !isNaN(x)).sort((x, y) => x - y);
  let taskBest = 0, curTaskRun = 0, prevTaskDayIdx = null;
  for (const idxVal of taskDayIdxs) {
    curTaskRun = (prevTaskDayIdx !== null && idxVal === prevTaskDayIdx + 1) ? curTaskRun + 1 : 1;
    taskBest = Math.max(taskBest, curTaskRun);
    prevTaskDayIdx = idxVal;
  }
  taskBest = Math.max(taskBest, taskStreak);

  // 渲染指定測驗連續/最佳/累計天數
  const elTaskStreakLine = document.getElementById("stTaskStreakLine");
  if (elTaskStreakLine) {
    const elTaskStreak = document.getElementById("stTaskHeatStreak");
    const elTaskBest = document.getElementById("stTaskHeatBest");
    const elTaskTotal = document.getElementById("stTaskHeatTotal");
    if (elTaskStreak && elTaskBest && elTaskTotal) {
      elTaskStreak.textContent = taskStreak;
      elTaskBest.textContent = taskBest;
      elTaskTotal.textContent = taskTotal;
    } else {
      elTaskStreakLine.innerHTML = `
        <span>連續 <b id="stTaskHeatStreak">${taskStreak}</b> 天 · 最佳 <b id="stTaskHeatBest">${taskBest}</b> 天 · 累計練習 <b id="stTaskHeatTotal">${taskTotal}</b> 天</span>
        <span id="stTaskHeatDayInfo" class="heat-day-info"></span>
      `;
    }
  }

  // 渲染指定測驗純綠色熱力圖方格
  const taskHeatGrid = document.getElementById("stTaskHeatmapGrid");
  const taskHeatDayInfoEl = document.getElementById("stTaskHeatDayInfo");
  if (taskHeatGrid) {
    taskHeatGrid.innerHTML = taskHeatDays.map((x, idx) => {
      return `<i class="hc ${x.levelClass}" role="button" tabindex="0" aria-label="${x.key}，${x.statusLabel || ''}" data-idx="${idx}" data-key="${x.key}" data-a="${x.a || 0}" data-rate="${x.rate || 0}"></i>`;
    }).join("");

    let pinnedTaskIdx = taskHeatDays.length > 0 ? taskHeatDays.length - 1 : 0;
    for (let i = taskHeatDays.length - 1; i >= 0; i--) {
      if (taskHeatDays[i] && taskHeatDays[i].key === (window.__activeStSelectedDate || formatDateYMD(nowDt))) {
        pinnedTaskIdx = i;
        break;
      }
    }

    const renderTaskHeatBadgeContent = (dateKey, activeCellIdx) => {
      const badgeEl = document.getElementById("stTaskHeatDayInfo") || taskHeatDayInfoEl;
      if (!badgeEl) return;
      const stat = getTaskDayStat(dateKey);
      badgeEl.className = `heat-day-info ${stat.badgeTier}`;
      if (stat.statusType === "completed") {
        badgeEl.innerHTML = `<b>${dateKey}</b> ｜ 正確率 <b>${stat.rate}%</b>`;
      } else {
        badgeEl.innerHTML = `<b>${dateKey}</b> ｜ <b>${stat.statusLabel}</b>`;
      }
      taskHeatGrid.querySelectorAll(".hc").forEach((cell, cIdx) => {
        cell.classList.toggle("hc-active", cIdx === activeCellIdx);
      });
    };

    const updateTaskHeatDayBadge = (idx) => {
      const item = taskHeatDays[idx];
      if (!item) return;
      renderTaskHeatBadgeContent(item.key, idx);
    };

    window.__updateStTaskHeatDayBadgeByDate = (dateStr) => {
      const normDate = normalizeDateKey(dateStr);
      if (!normDate) return;
      const foundIdx = taskHeatDays.findIndex(x => x && x.key === normDate);
      if (foundIdx !== -1) {
        pinnedTaskIdx = foundIdx;
        updateTaskHeatDayBadge(foundIdx);
        return;
      }
      renderTaskHeatBadgeContent(normDate, -1);
    };

    updateTaskHeatDayBadge(pinnedTaskIdx);

    taskHeatGrid.querySelectorAll(".hc").forEach((cell) => {
      const idx = parseInt(cell.getAttribute("data-idx"), 10);
      cell.addEventListener("mouseenter", () => {
        if (!isNaN(idx)) updateTaskHeatDayBadge(idx);
      });
      cell.addEventListener("click", () => {
        if (!isNaN(idx)) {
          pinnedTaskIdx = idx;
          updateTaskHeatDayBadge(idx);
          if (taskHeatDays[idx] && taskHeatDays[idx].key && typeof window.__switchStRecordDate === "function") {
            window.__switchStRecordDate(taskHeatDays[idx].key);
          }
        }
      });
    });

    taskHeatGrid.onmouseleave = () => {
      if (typeof window.__updateStTaskHeatDayBadgeByDate === "function") {
        window.__updateStTaskHeatDayBadgeByDate(window.__activeStSelectedDate || (taskHeatDays[pinnedTaskIdx] ? taskHeatDays[pinnedTaskIdx].key : ""));
      } else {
        updateTaskHeatDayBadge(pinnedTaskIdx);
      }
    };
  }

  // --- B. 自由練習作答紀錄熱力圖 ---
  const freeHeatGrid = document.getElementById("stHeatmapGrid");
  const freeDayStatCache = new Map();
  const getFreeDayStat = (dateStr) => {
    const norm = normalizeDateKey(dateStr);
    if (freeDayStatCache.has(norm)) return freeDayStatCache.get(norm);
    const unpad = unpadDateKey(dateStr);
    const slash = norm.replace(/-/g, "/");
    let a = 0, c = 0;
    const dp = dpMap[norm] || dpMap[unpad] || dpMap[slash];
    if (dp) {
      if (dp.words && Object.keys(dp.words).length > 0) {
        const wList = Object.values(dp.words).filter(Boolean);
        const isWordCurrentlyWrong = (w) => (w.lastResult === 'wrong') || (w.wrong > 0 && (!w.correct || w.correct === 0));
        const isWordCurrentlyCorrect = (w) => !isWordCurrentlyWrong(w) && (w.lastResult === 'correct' || (w.correct > 0 && !w.wrong) || w.passed);
        a = wList.length;
        c = wList.filter(isWordCurrentlyCorrect).length;
      } else if (dp.attempts > 0) {
        a = dp.attempts || 0;
        c = dp.correct || 0;
      }
    }
    const h = agentHistoryData[norm] || agentHistoryData[unpad] || agentHistoryData[slash];
    if (h && (h.a > 0 || h.attempts > 0)) {
      if (a === 0) {
        a = h.a || h.attempts || 0;
        c = h.c || h.correct || 0;
      }
    }
    if (a === 0 && resp.data && Array.isArray(resp.data)) {
      for (const r of resp.data) {
        if (!r) continue;
        const rDate = normalizeDateKey(r[0]);
        if (rDate === norm || unpadDateKey(r[0]) === unpad) {
          const fInfo = extractRowFreeInfo(r, resp.headers);
          if (fInfo && fInfo.attempts > 0) {
            a = fInfo.attempts;
            c = fInfo.correct;
            break;
          }
        }
      }
    }
    const res = { a, c, rate: a > 0 ? Math.round((c / a) * 100) : 0 };
    freeDayStatCache.set(norm, res);
    return res;
  };

  const freeHeatDays = [];
  for (let i = 27; i >= 0; i--) {
    const dt = new Date(nowDt);
    dt.setDate(dt.getDate() - i);
    const kDash = formatDateYMD(dt);
    const { a, c, rate } = getFreeDayStat(kDash);
    const level = a === 0 ? 0 : rate < 60 ? 1 : rate < 70 ? 2 : rate < 80 ? 3 : rate < 90 ? 4 : rate < 100 ? 5 : 6;
    freeHeatDays.push({ key: kDash, a, c, rate, level });
  }

  const activeFreeDateSet = new Set();
  for (let i = 0; i < 365; i++) {
    const dt = new Date(nowDt);
    dt.setDate(dt.getDate() - i);
    const kDash = formatDateYMD(dt);
    if (getFreeDayStat(kDash).a > 0) activeFreeDateSet.add(kDash);
  }
  const freeTotal = activeFreeDateSet.size;
  let freeStreak = 0;
  const hasFreeDayOff = (off) => {
    const dt = new Date(nowDt);
    dt.setDate(dt.getDate() - off);
    return activeFreeDateSet.has(formatDateYMD(dt));
  };
  const freeStartOff = hasFreeDayOff(0) ? 0 : hasFreeDayOff(1) ? 1 : null;
  if (freeStartOff !== null) {
    let k = freeStartOff;
    while (hasFreeDayOff(k)) { freeStreak++; k++; }
  }
  const freeDayIdxs = Array.from(activeFreeDateSet).map(toDayIdx).filter(x => x !== null && !isNaN(x)).sort((x, y) => x - y);
  let freeBest = 0, curFreeRun = 0, prevFreeDayIdx = null;
  for (const idxVal of freeDayIdxs) {
    curFreeRun = (prevFreeDayIdx !== null && idxVal === prevFreeDayIdx + 1) ? curFreeRun + 1 : 1;
    freeBest = Math.max(freeBest, curFreeRun);
    prevFreeDayIdx = idxVal;
  }
  freeBest = Math.max(freeBest, freeStreak);

  const elStreakLine = document.getElementById("stStreakLine");
  if (elStreakLine) {
    const elStreak = document.getElementById("stHeatStreak");
    const elBest = document.getElementById("stHeatBest");
    const elTotal = document.getElementById("stHeatTotal");
    if (elStreak && elBest && elTotal) {
      elStreak.textContent = freeStreak;
      elBest.textContent = freeBest;
      elTotal.textContent = freeTotal;
    } else {
      elStreakLine.innerHTML = `
        <span>連續 <b id="stHeatStreak">${freeStreak}</b> 天 · 最佳 <b id="stHeatBest">${freeBest}</b> 天 · 累計練習 <b id="stHeatTotal">${freeTotal}</b> 天</span>
        <span id="stHeatDayInfo" class="heat-day-info"></span>
      `;
    }
  }

  if (freeHeatGrid) {
    freeHeatGrid.innerHTML = freeHeatDays.map((x, idx) => {
      return `<i class="hc h${x.level}" role="button" tabindex="0" aria-label="${x.key}，正確率 ${x.rate || 0}%" data-idx="${idx}" data-key="${x.key}" data-a="${x.a || 0}" data-rate="${x.rate || 0}"></i>`;
    }).join("");

    let pinnedFreeIdx = freeHeatDays.length > 0 ? freeHeatDays.length - 1 : 0;
    for (let i = freeHeatDays.length - 1; i >= 0; i--) {
      if (freeHeatDays[i] && freeHeatDays[i].key === (window.__activeStSelectedDate || formatDateYMD(nowDt))) {
        pinnedFreeIdx = i;
        break;
      }
    }

    const renderFreeHeatBadgeContent = (dateKey, att, rate, activeCellIdx) => {
      const badgeEl = document.getElementById("stHeatDayInfo");
      if (!badgeEl) return;
      if (att > 0) {
        const tierClass = rate >= 100 ? "tier-green-perfect" : (rate >= 80 ? "tier-green-high" : (rate >= 60 ? "tier-green-mid" : "tier-green-low"));
        badgeEl.className = `heat-day-info ${tierClass}`;
        badgeEl.innerHTML = `<b>${dateKey}</b> ｜ 正確率 <b>${rate}%</b>`;
      } else {
        badgeEl.className = "heat-day-info tier-gray";
        badgeEl.innerHTML = `<b>${dateKey}</b> ｜ 無自由練習紀錄`;
      }
      freeHeatGrid.querySelectorAll(".hc").forEach((cell, cIdx) => {
        cell.classList.toggle("hc-active", cIdx === activeCellIdx);
      });
    };

    const updateFreeHeatDayBadge = (idx) => {
      const item = freeHeatDays[idx];
      if (!item) return;
      renderFreeHeatBadgeContent(item.key, item.a || 0, item.rate || 0, idx);
    };

    window.__updateStHeatDayBadgeByDate = (dateStr) => {
      const normDate = normalizeDateKey(dateStr);
      if (!normDate) return;
      const foundIdx = freeHeatDays.findIndex(x => x && x.key === normDate);
      if (foundIdx !== -1) {
        pinnedFreeIdx = foundIdx;
        updateFreeHeatDayBadge(foundIdx);
        return;
      }
      const { a, rate } = getFreeDayStat(normDate);
      renderFreeHeatBadgeContent(normDate, a, rate, -1);
    };

    updateFreeHeatDayBadge(pinnedFreeIdx);

    freeHeatGrid.querySelectorAll(".hc").forEach((cell) => {
      const idx = parseInt(cell.getAttribute("data-idx"), 10);
      cell.addEventListener("mouseenter", () => {
        if (!isNaN(idx)) updateFreeHeatDayBadge(idx);
      });
      cell.addEventListener("click", () => {
        if (!isNaN(idx)) {
          pinnedFreeIdx = idx;
          updateFreeHeatDayBadge(idx);
          if (freeHeatDays[idx] && freeHeatDays[idx].key && typeof window.__switchStRecordDate === "function") {
            window.__switchStRecordDate(freeHeatDays[idx].key);
          }
        }
      });
    });

    freeHeatGrid.onmouseleave = () => {
      if (typeof window.__updateStHeatDayBadgeByDate === "function") {
        window.__updateStHeatDayBadgeByDate(window.__activeStSelectedDate || (freeHeatDays[pinnedFreeIdx] ? freeHeatDays[pinnedFreeIdx].key : ""));
      } else {
        updateFreeHeatDayBadge(pinnedFreeIdx);
      }
    };
  }

  // 6. 渲染日期查詢、教師指定測驗作答紀錄與自由練習作答紀錄
  try {
    renderStudentDailyTaskAndFreeSections(resp);
  } catch (errDT) {
    console.error("renderStudentDailyTaskAndFreeSections error:", errDT);
  }

  // 確保點擊單字標籤可立即發音（事件委派備援）
  const summarySec = document.getElementById("summary");
  if (summarySec && !summarySec.__wordPillBound) {
    summarySec.__wordPillBound = true;
    summarySec.addEventListener("click", (ev) => {
      const pill = ev.target && ev.target.closest ? ev.target.closest(".word-pill-tag") : null;
      if (!pill) return;
      const w = pill.getAttribute("data-word");
      if (w) speakMasteredWord(w);
    });
  }

  // 7. 初始化底部使用紀錄匯出下載方塊 (PDF / Excel)
  try {
    initStudentExportRecordsCard(resp);
  } catch (errExp) {
    console.error("initStudentExportRecordsCard error:", errExp);
  }
}
