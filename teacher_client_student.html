// 🔮 學習曲線預測與成長推估模組 (Learning Curve Forecast)
// ════════════════════════════════════════
function renderForecast() {
  const card = document.getElementById("forecastCard");
  if (!card || card.style.display === "none") return;

  const velValEl   = document.getElementById("fcDailyVelocity");
  const velStatEl  = document.getElementById("fcVelocityStatus");
  const nextMilVal = document.getElementById("fcNextMilestoneDate");
  const nextMilSub = document.getElementById("fcNextMilestoneDesc");
  const goalMilVal = document.getElementById("fcGoalForecastDate");
  const goalMilSub = document.getElementById("fcGoalForecastStatus");
  const outValEl   = document.getElementById("fcOutlookVal");
  const outDescEl  = document.getElementById("fcOutlookDesc");
  const insightsEl = document.getElementById("fcInsightsText");

  if (!fullProcessedData || fullProcessedData.length === 0) {
    if (velValEl) velValEl.textContent = "+0.0 /天";
    if (velStatEl) velStatEl.textContent = "尚無足夠歷程數據";
    if (nextMilVal) nextMilVal.textContent = "尚無資料";
    if (goalMilVal) goalMilVal.textContent = "尚無資料";
    if (outValEl) outValEl.textContent = "+0";
    if (insightsEl) insightsEl.textContent = "尚無足夠學習紀錄。請先開始每日練習，系統將在記錄累積後自動為您推算成長曲線！";
    if (forecastChartInstance) { forecastChartInstance.destroy(); forecastChartInstance = null; }
    return;
  }

  const metricSelect = document.getElementById("forecastMetricSelect");
  const daysSelect   = document.getElementById("forecastDaysSelect");
  const metric = metricSelect ? metricSelect.value : "mastered";
  const horizonDays = daysSelect ? (parseInt(daysSelect.value, 10) || 30) : 30;

  // 1. 取得按時間遞增排序之歷史有效資料 (最早 -> 最新)
  const validHistory = [...fullProcessedData]
    .filter(r => r.date && r.date.trim() !== "")
    .reverse();

  if (validHistory.length === 0) {
    if (forecastChartInstance) { forecastChartInstance.destroy(); forecastChartInstance = null; }
    return;
  }

  // 聚合每日最後一筆（當天最新累積量）
  const dayMap = new Map();
  validHistory.forEach(r => {
    dayMap.set(r.date, r);
  });
  const distinctDays = Array.from(dayMap.values());

  // 抽取指標對應數值
  const getValue = r => {
    if (metric === "mastered") return r.mastered || 0;
    if (metric === "attempts") return r.cumAttempts || 0;
    if (metric === "score")    return (r.score && r.score.cum !== undefined) ? r.score.cum : 0;
    return r.mastered || 0;
  };

  const unitMap = {
    mastered: "個",
    attempts: "題",
    score: "分"
  };
  const unit = unitMap[metric] || "個";
  const labelName = metric === "mastered" ? "精通單字" : (metric === "attempts" ? "累積作答" : "累積總分");

  const latestRec = distinctDays[distinctDays.length - 1];
  const latestVal = getValue(latestRec);
  const latestDate = new Date(latestRec.date.replace(/-/g, "/"));

  // 2. 計算全歷程斜率 (vOverall) 與近期 14 天動能 (vRecent)
  let vOverall = 0;
  let vRecent  = 0;

  if (distinctDays.length >= 2) {
    const firstRec = distinctDays[0];
    const firstDate = new Date(firstRec.date.replace(/-/g, "/"));
    const firstVal = getValue(firstRec);
    const totalDaysSpan = Math.max(1, Math.round((latestDate - firstDate) / (1000 * 60 * 60 * 24)));
    
    // 線性迴歸全歷程斜率
    let sumT = 0, sumY = 0, sumTY = 0, sumTT = 0;
    const n = distinctDays.length;
    distinctDays.forEach(r => {
      const d = new Date(r.date.replace(/-/g, "/"));
      const t = Math.max(0, Math.round((d - firstDate) / (1000 * 60 * 60 * 24)));
      const y = getValue(r);
      sumT += t; sumY += y; sumTY += t * y; sumTT += t * t;
    });
    const denom = (n * sumTT - sumT * sumT);
    if (denom !== 0) {
      vOverall = Math.max(0, (n * sumTY - sumT * sumY) / denom);
    } else {
      vOverall = Math.max(0, (latestVal - firstVal) / totalDaysSpan);
    }

    // 近期 14 天動能
    const cutoffDate = new Date(latestDate);
    cutoffDate.setDate(cutoffDate.getDate() - 14);
    const recentPoints = distinctDays.filter(r => new Date(r.date.replace(/-/g, "/")) >= cutoffDate);

    if (recentPoints.length >= 2) {
      const rStart = recentPoints[0];
      const rStartDate = new Date(rStart.date.replace(/-/g, "/"));
      const rDays = Math.max(1, Math.round((latestDate - rStartDate) / (1000 * 60 * 60 * 24)));
      vRecent = Math.max(0, (latestVal - getValue(rStart)) / rDays);
    } else if (recentPoints.length === 1 && distinctDays.length >= 2) {
      const prevRec = distinctDays[distinctDays.length - 2];
      const prevDate = new Date(prevRec.date.replace(/-/g, "/"));
      const pDays = Math.max(1, Math.round((latestDate - prevDate) / (1000 * 60 * 60 * 24)));
      vRecent = Math.max(0, (latestVal - getValue(prevRec)) / pDays);
    } else {
      vRecent = vOverall;
    }
  } else {
    vOverall = 0.5;
    vRecent  = 0.5;
  }

  // 融合速率 (70% 近期動能 + 30% 全歷程基底)
  let vBlend = (vRecent * 0.70) + (vOverall * 0.30);
  if (vBlend < 0.05 && latestVal > 0) {
    vBlend = 0.05;
  }

  // 3. 更新 4 大指標卡
  // KPI 1: 每日成長動能
  if (velValEl) {
    velValEl.textContent = `+${vBlend.toFixed(1)} ${unit}/天`;
  }
  if (velStatEl) {
    if (vRecent > vOverall * 1.25) {
      velStatEl.textContent = "🔥 近期學習動能顯著加速中！";
      velStatEl.style.color = "#16a34a";
    } else if (vRecent < vOverall * 0.75 && vRecent > 0) {
      velStatEl.textContent = "⚡ 近期節奏稍緩，建議重拾作答頻率";
      velStatEl.style.color = "#d97706";
    } else if (vRecent === 0) {
      velStatEl.textContent = "⏸️ 近期暫無新增，待重啟練習";
      velStatEl.style.color = "var(--text-muted)";
    } else {
      velStatEl.textContent = "✨ 成長節奏穩定維持中";
      velStatEl.style.color = "var(--text-muted)";
    }
  }

  // KPI 2: 下個里程碑
  let milestoneTiers = [];
  if (metric === "mastered") {
    milestoneTiers = [10, 20, 30, 50, 75, 100, 150, 200, 300, 500, 800, 1000];
  } else if (metric === "attempts") {
    milestoneTiers = [50, 100, 200, 300, 500, 800, 1000, 1500, 2000, 3000, 5000];
  } else {
    milestoneTiers = [200, 500, 1000, 2000, 3500, 5000, 7500, 10000, 15000];
  }

  let nextMilestone = milestoneTiers.find(m => m > latestVal);
  if (!nextMilestone) nextMilestone = Math.ceil((latestVal + 10) / 50) * 50;

  const diffToMilestone = nextMilestone - latestVal;
  let nextMilestoneDays = vBlend > 0 ? Math.ceil(diffToMilestone / vBlend) : null;

  if (nextMilVal) {
    if (nextMilestoneDays !== null && nextMilestoneDays < 365) {
      const targetD = new Date(latestDate);
      targetD.setDate(targetD.getDate() + nextMilestoneDays);
      const mStr = `${targetD.getFullYear()}/${String(targetD.getMonth()+1).padStart(2,"0")}/${String(targetD.getDate()).padStart(2,"0")}`;
      nextMilVal.textContent = `${mStr} (${nextMilestoneDays} 天後)`;
    } else {
      nextMilVal.textContent = "維持練習即將達成";
    }
  }
  if (nextMilSub) {
    nextMilSub.textContent = `預計解鎖 ${nextMilestone} ${unit} 里程碑 (還差 ${diffToMilestone} ${unit})`;
  }

  // KPI 3: 目標達成推估
  const g = currentGoals || {};
  let targetGoalVal = 0;
  if (metric === "mastered") targetGoalVal = g.masteredTarget || 50;
  else if (metric === "attempts") targetGoalVal = g.attemptsTarget || 300;
  else targetGoalVal = Math.round((g.attemptsTarget || 300) * 8);

  const diffToGoal = targetGoalVal - latestVal;
  if (goalMilVal && goalMilSub) {
    if (diffToGoal <= 0) {
      goalMilVal.textContent = "🎉 目標已全數達成！";
      goalMilVal.style.color = "#16a34a";
      goalMilSub.textContent = `當前 ${latestVal} ${unit} 已超越目標 ${targetGoalVal} ${unit}`;
    } else if (vBlend <= 0.01) {
      goalMilVal.textContent = "尚需持續練習";
      goalMilVal.style.color = "var(--text)";
      goalMilSub.textContent = `距離目標還差 ${diffToGoal} ${unit}`;
    } else {
      const daysToGoal = Math.ceil(diffToGoal / vBlend);
      const estGoalDate = new Date(latestDate);
      estGoalDate.setDate(estGoalDate.getDate() + daysToGoal);
      const estGoalStr = `${estGoalDate.getFullYear()}/${String(estGoalDate.getMonth()+1).padStart(2,"0")}/${String(estGoalDate.getDate()).padStart(2,"0")}`;

      if (g.deadline) {
        const dLine = new Date(g.deadline.replace(/-/g, "/"));
        const deadlineDiffDays = Math.round((dLine - estGoalDate) / (1000 * 60 * 60 * 24));
        if (deadlineDiffDays >= 0) {
          goalMilVal.textContent = `${estGoalStr} (提前 ${deadlineDiffDays} 天)`;
          goalMilVal.style.color = "#16a34a";
          goalMilSub.textContent = `預定截止日 ${g.deadline}，步調超前！`;
        } else {
          goalMilVal.textContent = `${estGoalStr} (可能延後 ${Math.abs(deadlineDiffDays)} 天)`;
          goalMilVal.style.color = "#dc2626";
          goalMilSub.textContent = `目標截止日 ${g.deadline}，建議每日增加練習`;
        }
      } else {
        goalMilVal.textContent = `${estGoalStr} (${daysToGoal} 天後)`;
        goalMilVal.style.color = "var(--text)";
        goalMilSub.textContent = `達成目標 ${targetGoalVal} ${unit} (還差 ${diffToGoal} ${unit})`;
      }
    }
  }

  // KPI 4: 週期成果推估 (Outlook)
  const projectedGrowth = Math.round(vBlend * horizonDays);
  const projectedTotal = latestVal + projectedGrowth;
  if (outValEl) outValEl.textContent = `+${projectedGrowth} ${unit}`;
  if (outDescEl) outDescEl.textContent = `預估 ${horizonDays} 天後累積達 ${projectedTotal} ${unit}`;

  // 智能教練建議
  if (insightsEl) {
    let advice = "";
    if (diffToGoal <= 0) {
      advice = `🏆 太棒了！您設定的 ${labelName} 目標 (${targetGoalVal} ${unit}) 已經順利攻克！建議點擊「設定目標」挑戰更高峰，例如設定 ${nextMilestone} ${unit}，持續擴充英語實力！`;
    } else if (vRecent > vOverall * 1.25) {
      advice = `🚀 衝勁十足！近期的平均每日增速達到 +${vRecent.toFixed(1)} ${unit}，高於長期水平。依此節奏，預計將比原定時程更早解鎖下一個 ${nextMilestone} ${unit} 里程碑，請保持這份手感！`;
    } else if (vRecent < 0.2 && vOverall > 0) {
      advice = `💡 近期練習頻率稍微放緩。若每日撥出 10 分鐘完成 10~15 題，即可迅速拉抬動能至每日 +${Math.max(1, Math.round(vOverall * 1.5))} ${unit}，大幅縮短達成目標所需時間！`;
    } else {
      advice = `📈 學習步調穩健扎實！目前平均每日推進 +${vBlend.toFixed(1)} ${unit}，距離目標 ${targetGoalVal} ${unit} 僅差 ${diffToGoal} ${unit}。持續每日打卡，預計 ${nextMilestoneDays ? nextMilestoneDays + " 天內" : "近期"} 就會看見顯著成果！`;
    }
    insightsEl.textContent = advice;
  }

  // 4. 繪製 Chart.js 雙軌預測折線圖 (歷史實線 + AI推估虛線)
  const canvas = document.getElementById("forecastChart");
  if (!canvas) return;

  if (forecastChartInstance) {
    forecastChartInstance.destroy();
    forecastChartInstance = null;
  }

  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const labelColor = isDark ? "#cbd5e1" : "#475569";
  const gridColor  = isDark ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.06)";
  const isMobile = window.innerWidth <= 640;

  // 歷史點（最多取最近 20 個歷史點避免圖表過密）
  let histSlice = distinctDays;
  if (histSlice.length > 20) {
    const step = Math.ceil(histSlice.length / 20);
    histSlice = histSlice.filter((_, idx) => idx % step === 0 || idx === histSlice.length - 1);
  }

  const chartLabels = [];
  const histDataSeries = [];
  const predDataSeries = [];
  const goalLineSeries = [];

  // 填充歷史數據
  histSlice.forEach(r => {
    const label = r.date.substring(5).replace("-", "/");
    chartLabels.push(label);
    histDataSeries.push(getValue(r));
    predDataSeries.push(null);
    if (targetGoalVal > 0) goalLineSeries.push(targetGoalVal);
  });

  // 連接點：最新歷史點同時作為預測線的起點
  const connectIdx = chartLabels.length - 1;
  predDataSeries[connectIdx] = latestVal;

  // 未來預測點 (依據 horizonDays 生成 5~6 個觀測點)
  const numFuturePoints = horizonDays <= 14 ? 7 : (horizonDays <= 30 ? 6 : 6);
  const dayStep = Math.round(horizonDays / numFuturePoints);

  for (let step = 1; step <= numFuturePoints; step++) {
    const forwardDay = Math.min(step * dayStep, horizonDays);
    const futDate = new Date(latestDate);
    futDate.setDate(futDate.getDate() + forwardDay);
    const futLabel = `${String(futDate.getMonth()+1).padStart(2,"0")}/${String(futDate.getDate()).padStart(2,"0")} (預估)`;
    chartLabels.push(futLabel);
    histDataSeries.push(null);
    const projectedVal = Math.round(latestVal + vBlend * forwardDay);
    predDataSeries.push(projectedVal);
    if (targetGoalVal > 0) goalLineSeries.push(targetGoalVal);
    if (forwardDay === horizonDays) break;
  }

  const ctx = canvas.getContext("2d");
  forecastChartInstance = new Chart(ctx, {
    type: "line",
    data: {
      labels: chartLabels,
      datasets: [
        {
          label: `歷史實際成長 (${unit})`,
          data: histDataSeries,
          borderColor: isDark ? "#60a5fa" : "#2563eb",
          backgroundColor: isDark ? "rgba(96, 165, 250, 0.12)" : "rgba(37, 99, 235, 0.1)",
          borderWidth: 2.5,
          pointRadius: isMobile ? 2.5 : 4,
          pointHoverRadius: 6,
          fill: true,
          tension: 0.25,
          spanGaps: false
        },
        {
          label: `AI 預估推演未來 (${unit})`,
          data: predDataSeries,
          borderColor: isDark ? "#c084fc" : "#8b5cf6",
          backgroundColor: isDark ? "rgba(192, 132, 252, 0.08)" : "rgba(139, 92, 246, 0.08)",
          borderDash: [6, 5],
          borderWidth: 2.5,
          pointRadius: isMobile ? 3 : 4.5,
          pointHoverRadius: 7,
          pointBackgroundColor: isDark ? "#c084fc" : "#8b5cf6",
          fill: true,
          tension: 0.25,
          spanGaps: false
        },
        ...(targetGoalVal > 0 ? [{
          label: `設定學習目標 (${targetGoalVal} ${unit})`,
          data: goalLineSeries,
          borderColor: "#f59e0b",
          borderDash: [3, 3],
          borderWidth: 1.5,
          pointRadius: 0,
          fill: false,
          tension: 0
        }] : [])
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      interaction: {
        mode: "index",
        intersect: false
      },
      plugins: {
        legend: {
          display: true,
          position: "top",
          labels: {
            usePointStyle: true,
            boxWidth: 8,
            padding: 12,
            font: { weight: "600", size: isMobile ? 10.5 : 12 },
            color: labelColor
          }
        },
        tooltip: {
          padding: 10,
          callbacks: {
            label: function(context) {
              const val = context.parsed.y;
              if (val === null || val === undefined) return null;
              return ` ${context.dataset.label}: ${val} ${unit}`;
            }
          }
        }
      },
      scales: {
        y: {
          beginAtZero: false,
          grid: { color: gridColor },
          ticks: {
            color: labelColor,
            font: { size: isMobile ? 10 : 11 }
          },
          title: {
            display: true,
            text: `${labelName} (${unit})`,
            color: labelColor,
            font: { size: isMobile ? 10 : 12, weight: "bold" }
          }
        },
        x: {
          grid: { color: gridColor },
          ticks: {
            color: labelColor,
            font: { size: isMobile ? 9 : 11 },
            maxRotation: 45,
            minRotation: 0,
            autoSkip: true,
            maxTicksLimit: isMobile ? 7 : 12
          }
        }
      }
    }
  });
}

// ════════════════════════════════════════
// ⏱️ 練習頻率與習慣節奏分析模組 (Practice Frequency & Cadence Analysis)
// ════════════════════════════════════════
function renderFrequencyAnalysis() {
  const card = document.getElementById("frequencyCard");
  if (!card || card.style.display === "none") return;

  const weeklyDaysEl   = document.getElementById("freqWeeklyDays");
  const weeklyStatEl   = document.getElementById("freqWeeklyStatus");
  const avgIntervalEl  = document.getElementById("freqAvgInterval");
  const intervalStatEl = document.getElementById("freqIntervalStatus");
  const maxIntervalEl  = document.getElementById("freqMaxInterval");
  const maxIntervalSub = document.getElementById("freqMaxIntervalSub");
  const avgSessionEl   = document.getElementById("freqAvgSessionAtt");
  const intensitySubEl = document.getElementById("freqIntensitySub");

  const personaIconEl  = document.getElementById("freqPersonaIcon");
  const personaTitleEl = document.getElementById("freqPersonaTitle");
  const personaDescEl  = document.getElementById("freqPersonaDesc");
  const coachTextEl    = document.getElementById("freqCoachText");
  const weeksGridEl    = document.getElementById("freqWeeksGrid");
  const bestBadgeEl    = document.getElementById("freqWeekdayBestBadge");

  if (!fullProcessedData || fullProcessedData.length === 0) {
    if (weeklyDaysEl) weeklyDaysEl.textContent = "0.0 天/週";
    if (avgIntervalEl) avgIntervalEl.textContent = "0.0 天";
    if (maxIntervalEl) maxIntervalEl.textContent = "0 天";
    if (avgSessionEl) avgSessionEl.textContent = "0 題/次";
    if (personaTitleEl) personaTitleEl.textContent = "尚無足夠數據";
    if (personaDescEl) personaDescEl.textContent = "累積練習記錄後，系統將為您智慧診斷練習節奏與習慣原型！";
    if (coachTextEl) coachTextEl.textContent = "開始每日小量練習，建立科學間隔記憶習慣！";
    if (weeksGridEl) weeksGridEl.innerHTML = "";
    if (freqWeekdayChartInstance) { freqWeekdayChartInstance.destroy(); freqWeekdayChartInstance = null; }
    if (freqIntensityChartInstance) { freqIntensityChartInstance.destroy(); freqIntensityChartInstance = null; }
    return;
  }

  // 1. 範圍過濾
  const rangeSel = document.getElementById("freqRangeSelect");
  const rangeVal = rangeSel ? rangeSel.value : "30";

  let baseData = [...fullProcessedData].filter(r => r.date && r.date.trim() !== "");
  if (rangeVal === "30" || rangeVal === "90") {
    const daysLimit = parseInt(rangeVal, 10);
    const latestDate = new Date(baseData[0].date.replace(/-/g, "/"));
    const cutoffDate = new Date(latestDate);
    cutoffDate.setDate(cutoffDate.getDate() - daysLimit);
    baseData = baseData.filter(r => new Date(r.date.replace(/-/g, "/")) >= cutoffDate);
  }

  if (baseData.length === 0) {
    baseData = [...fullProcessedData].filter(r => r.date && r.date.trim() !== "");
  }

  // 聚合每日資料（由舊到新排序）
  const dayMap = new Map();
  [...baseData].reverse().forEach(r => {
    if (!dayMap.has(r.date)) {
      dayMap.set(r.date, {
        date: r.date,
        attempts: 0,
        correct: 0,
        score: 0,
        count: 0
      });
    }
    const dObj = dayMap.get(r.date);
    dObj.attempts += (r.dailyAttempts || 0);
    dObj.correct  += (r.dailyCorrect || 0);
    dObj.score    += (r.score && r.score.daily !== undefined) ? r.score.daily : 0;
    dObj.count++;
  });

  const dailyList = Array.from(dayMap.values());
  let activeDays = dailyList.filter(d => d.attempts > 0);
  if (activeDays.length === 0) activeDays = dailyList;

  const totalActiveDays = activeDays.length;
  const totalAttempts = activeDays.reduce((sum, d) => sum + d.attempts, 0);
  const totalCorrect  = activeDays.reduce((sum, d) => sum + d.correct, 0);

  // 2. 計算頻率指標：每週天數、平均間隔、最長間隔
  let weeklyAvgDays = 0;
  let avgIntervalDays = 0;
  let maxIntervalDays = 0;
  let intervals = [];

  if (activeDays.length >= 2) {
    const firstDate = new Date(activeDays[0].date.replace(/-/g, "/"));
    const lastDate  = new Date(activeDays[activeDays.length - 1].date.replace(/-/g, "/"));
    const totalDaySpan = Math.max(1, Math.round((lastDate - firstDate) / (1000 * 60 * 60 * 24)) + 1);
    const totalWeeks = Math.max(1, totalDaySpan / 7);

    weeklyAvgDays = Math.min(7.0, totalActiveDays / totalWeeks);

    for (let i = 0; i < activeDays.length - 1; i++) {
      const d1 = new Date(activeDays[i].date.replace(/-/g, "/"));
      const d2 = new Date(activeDays[i + 1].date.replace(/-/g, "/"));
      const gap = Math.max(1, Math.round((d2 - d1) / (1000 * 60 * 60 * 24)));
      intervals.push(gap);
    }
    avgIntervalDays = intervals.reduce((a, b) => a + b, 0) / intervals.length;
    maxIntervalDays = Math.max(...intervals);
  } else if (activeDays.length === 1) {
    weeklyAvgDays = 1.0;
    avgIntervalDays = 1.0;
    maxIntervalDays = 0;
  }

  const avgSessionAttempts = totalActiveDays > 0 ? Math.round(totalAttempts / totalActiveDays) : 0;

  // 更新 KPI 卡片
  if (weeklyDaysEl) weeklyDaysEl.textContent = `${weeklyAvgDays.toFixed(1)} 天/週`;
  if (weeklyStatEl) {
    if (weeklyAvgDays >= 5.0) {
      weeklyStatEl.textContent = "🔥 超高頻每日精進 (極佳)";
      weeklyStatEl.style.color = "#16a34a";
    } else if (weeklyAvgDays >= 3.0) {
      weeklyStatEl.textContent = "✨ 穩定規律學習 (良好)";
      weeklyStatEl.style.color = "var(--primary)";
    } else {
      weeklyStatEl.textContent = "⚡ 建議提高至每週 3 天以上";
      weeklyStatEl.style.color = "#d97706";
    }
  }

  if (avgIntervalEl) avgIntervalEl.textContent = `${avgIntervalDays.toFixed(1)} 天`;
  if (intervalStatEl) {
    if (avgIntervalDays <= 1.8) {
      intervalStatEl.textContent = "🎯 艾賓浩斯記憶黃金間隔";
      intervalStatEl.style.color = "#16a34a";
    } else if (avgIntervalDays <= 3.0) {
      intervalStatEl.textContent = "⏱️ 間隔尚可，記憶稍有淡化";
      intervalStatEl.style.color = "var(--text-muted)";
    } else {
      intervalStatEl.textContent = "⚠️ 間隔偏長，容易產生生疏感";
      intervalStatEl.style.color = "#dc2626";
    }
  }

  if (maxIntervalEl) maxIntervalEl.textContent = `${maxIntervalDays} 天`;
  if (maxIntervalSub) {
    maxIntervalSub.textContent = maxIntervalDays <= 3 ? "極少中斷，持續力超卓" : (maxIntervalDays <= 7 ? "曾短暫中斷，已迅速回歸" : "曾有較長停滯期，請保持手感");
  }

  if (avgSessionEl) avgSessionEl.textContent = `${avgSessionAttempts} 題/次`;
  if (intensitySubEl) {
    if (avgSessionAttempts >= 40) intensitySubEl.textContent = "💪 深度挑戰型刷題";
    else if (avgSessionAttempts >= 20) intensitySubEl.textContent = "🎯 扎實精準標準訓練";
    else intensitySubEl.textContent = "🌱 輕量多次快速溫習";
  }

  // 3. 星期分析 (Day of Week Distribution & Accuracy)
  const dayNames = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
  const weekdayAttempts = [0, 0, 0, 0, 0, 0, 0];
  const weekdayCorrect  = [0, 0, 0, 0, 0, 0, 0];
  const weekdayCounts   = [0, 0, 0, 0, 0, 0, 0];

  activeDays.forEach(d => {
    const dt = new Date(d.date.replace(/-/g, "/"));
    const w = dt.getDay();
    weekdayAttempts[w] += d.attempts;
    weekdayCorrect[w]  += d.correct;
    weekdayCounts[w]++;
  });

  const weekdayAccuracies = weekdayAttempts.map((att, idx) => {
    return att > 0 ? parseFloat(((weekdayCorrect[idx] / att) * 100).toFixed(1)) : 0;
  });

  // 尋找最佳星期
  let bestDayIdx = 0, bestAcc = -1;
  let maxDayIdx = 0, maxAtt = -1;
  weekdayAccuracies.forEach((acc, idx) => {
    if (weekdayAttempts[idx] >= 10 && acc > bestAcc) {
      bestAcc = acc;
      bestDayIdx = idx;
    }
    if (weekdayAttempts[idx] > maxAtt) {
      maxAtt = weekdayAttempts[idx];
      maxDayIdx = idx;
    }
  });

  if (bestBadgeEl) {
    if (bestAcc > 0) {
      bestBadgeEl.textContent = `💡 ${dayNames[bestDayIdx]} 答題正確率最高 (${bestAcc}%) ｜ ${dayNames[maxDayIdx]} 練習題量最多 (${maxAtt} 題)`;
    } else {
      bestBadgeEl.textContent = `💡 ${dayNames[maxDayIdx]} 練習題量最多 (${maxAtt} 題)`;
    }
  }

  // 4. 學習習慣原型 (Persona)
  const weekendAttempts = weekdayAttempts[0] + weekdayAttempts[6];
  const weekendRatio = totalAttempts > 0 ? (weekendAttempts / totalAttempts) : 0;

  let pIcon = "🌟", pTitle = "恆毅規律型 (Consistent Achiever)", pDesc = "";
  if (weeklyAvgDays >= 4.0 && avgIntervalDays <= 2.0) {
    pIcon = "🌟";
    pTitle = "恆毅規律型 (Consistent Achiever)";
    pDesc = `您的作答習慣具備極高的持續力與規律度！平均每週練習 ${weeklyAvgDays.toFixed(1)} 天、平均間隔僅 ${avgIntervalDays.toFixed(1)} 天，完全契合艾賓浩斯記憶鞏固曲線，單字長期留存率預估達 85% 以上！`;
  } else if (weekendRatio >= 0.50 && totalAttempts >= 30) {
    pIcon = "⚡";
    pTitle = "週末衝刺型 (Weekend Warrior)";
    pDesc = `您有超過 ${Math.round(weekendRatio * 100)}% 的練習集中在週末進行！單次爆發力十足。建議平日週一到週五每天撥出 5~8 分鐘輕量溫習 10 題，可有效防止週末前產生遺忘間隙。`;
  } else if (weeklyAvgDays >= 2.5) {
    pIcon = "📈";
    pTitle = "穩步精進型 (Steady Pacer)";
    pDesc = `您維持著穩健的學習步調（每週約 ${weeklyAvgDays.toFixed(1)} 天），每次平均作答 ${avgSessionAttempts} 題。若能再縮短練習間隔（例如將練習頻率由每 3 天一次微調至每 2 天一次），單字掌握速度將有爆發性提升！`;
  } else {
    pIcon = "🌱";
    pTitle = "起步蓄力型 (Developing Explorer)";
    pDesc = `目前的練習間隔平均為 ${avgIntervalDays.toFixed(1)} 天，屬於探索階段。認知心理學研究證實，「少量高頻（每日15題）」的學習效果遠高於「大量偶爾（單次100題）」，建議設定每日固定打卡時間！`;
  }

  if (personaIconEl) personaIconEl.textContent = pIcon;
  if (personaTitleEl) personaTitleEl.textContent = pTitle;
  if (personaDescEl) personaDescEl.textContent = pDesc;

  // 5. 單次練習強度分佈 (Session Intensity)
  let countLight = 0, countStd = 0, countDeep = 0, countMarathon = 0;
  activeDays.forEach(d => {
    if (d.attempts < 10) countLight++;
    else if (d.attempts <= 25) countStd++;
    else if (d.attempts <= 50) countDeep++;
    else countMarathon++;
  });

  // 6. 近 4 週對比週報
  if (weeksGridEl) {
    const today = new Date();
    today.setHours(23, 59, 59, 999);
    const weekBuckets = [
      { label: "本週 (近7天)", days: 0, att: 0, cor: 0, activeMap: new Array(7).fill(false) },
      { label: "上週 (8~14天前)", days: 0, att: 0, cor: 0, activeMap: new Array(7).fill(false) },
      { label: "2週前 (15~21天前)", days: 0, att: 0, cor: 0, activeMap: new Array(7).fill(false) },
      { label: "3週前 (22~28天前)", days: 0, att: 0, cor: 0, activeMap: new Array(7).fill(false) }
    ];

    dailyList.forEach(d => {
      const dt = new Date(d.date.replace(/-/g, "/"));
      const diffDays = Math.floor((today - dt) / (1000 * 60 * 60 * 24));
      if (diffDays >= 0 && diffDays < 28) {
        const wIdx = Math.floor(diffDays / 7);
        const dayInW = diffDays % 7;
        if (wIdx < 4) {
          if (d.attempts > 0) {
            weekBuckets[wIdx].days++;
            weekBuckets[wIdx].activeMap[6 - dayInW] = true;
          }
          weekBuckets[wIdx].att += d.attempts;
          weekBuckets[wIdx].cor += d.correct;
        }
      }
    });

    let weeksHtml = "";
    weekBuckets.forEach((wb, idx) => {
      const acc = wb.att > 0 ? ((wb.cor / wb.att) * 100).toFixed(1) + "%" : "0%";
      const dotsHtml = wb.activeMap.map(a => `<div class="freq-dot ${a ? "active" : ""}" title="${a ? "已打卡練習" : "未練習"}"></div>`).join("");

      let compareBadge = "";
      if (idx === 0 && weekBuckets[1].att > 0) {
        const diffPct = Math.round(((wb.att - weekBuckets[1].att) / weekBuckets[1].att) * 100);
        const sign = diffPct >= 0 ? `+${diffPct}%` : `${diffPct}%`;
        const col = diffPct >= 0 ? "#16a34a" : "#dc2626";
        compareBadge = `<span style="font-size:11px; font-weight:700; color:${col};">環比 ${sign}</span>`;
      }

      weeksHtml += `
        <div class="freq-week-card">
          <div class="freq-week-label">
            <span>${wb.label}</span>
            ${compareBadge}
          </div>
          <div class="freq-week-dots">${dotsHtml}</div>
          <div class="freq-week-stat">${wb.att.toLocaleString()} 題 ｜ ${wb.days} 天打卡</div>
          <div class="freq-week-sub">正確率：${acc} ｜ 日均 ${(wb.att / 7).toFixed(1)} 題</div>
        </div>
      `;
    });
    weeksGridEl.innerHTML = weeksHtml;
  }

  // 7. 智能教練建議
  if (coachTextEl) {
    let advice = "";
    if (avgIntervalDays <= 1.5) {
      advice = `🌟 卓越的記憶保鮮節奏！目前平均間隔僅 ${avgIntervalDays.toFixed(1)} 天，屬於「超高留存率」黃金頻率。大腦在即將遺忘前及時提取單字，神經突觸強化最顯著！建議維持目前的節奏，搭配攻克 LEVEL 3~5 進階詞彙！`;
    } else if (bestAcc >= 85 && bestDayIdx !== maxDayIdx) {
      advice = `💡 數據發現：您在【${dayNames[bestDayIdx]}】的正確率高達 ${bestAcc}%（最高！），但作答量最集中的卻是【${dayNames[maxDayIdx]}】。建議可在體力或專注度最好的 ${dayNames[bestDayIdx]} 嘗試挑戰更多進階題庫，學習效率將事半功倍！`;
    } else if (weeklyAvgDays < 3.0) {
      advice = `📈 根據艾賓浩斯遺忘曲線，學習新單字 24 小時後記憶保留約 33%，48 小時後降至 27%。若能將練習習慣由每週 ${weeklyAvgDays.toFixed(1)} 天提升至每週 4~5 天（即使每天只做 10 題），單字記憶牢固度將提升近一倍！`;
    } else {
      advice = `🎯 目前每週練習 ${weeklyAvgDays.toFixed(1)} 天，節奏十分健康！單次平均題量為 ${avgSessionAttempts} 題。建議可嘗試在週中安排 1 次「深度精熟練習（30+題）」，其餘日子以「輕量打卡（10題）」穿插，形成最佳的學習心流！`;
    }
    coachTextEl.textContent = advice;
  }

  // 8. 繪製 Chart 1: 星期練習量 vs 正確率雙軸圖
  const isDark = document.documentElement.getAttribute("data-theme") === "dark";
  const labelColor = isDark ? "#cbd5e1" : "#475569";
  const gridColor  = isDark ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.06)";
  const isMobile = window.innerWidth <= 640;

  const cvsWeekday = document.getElementById("freqWeekdayChart");
  if (cvsWeekday) {
    if (freqWeekdayChartInstance) {
      freqWeekdayChartInstance.destroy();
      freqWeekdayChartInstance = null;
    }
    const ctxW = cvsWeekday.getContext("2d");
    freqWeekdayChartInstance = new Chart(ctxW, {
      type: "bar",
      data: {
        labels: dayNames,
        datasets: [
          {
            type: "bar",
            label: "作答題數 (題)",
            data: weekdayAttempts,
            backgroundColor: isDark ? "rgba(56, 189, 248, 0.65)" : "rgba(2, 132, 199, 0.75)",
            borderRadius: 6,
            yAxisID: "y"
          },
          {
            type: "line",
            label: "平均正確率 (%)",
            data: weekdayAccuracies,
            borderColor: "#f59e0b",
            backgroundColor: "#f59e0b",
            borderWidth: 2.5,
            pointRadius: isMobile ? 3 : 4.5,
            pointHoverRadius: 6,
            tension: 0.25,
            yAxisID: "y1"
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: {
            display: true,
            position: "top",
            labels: {
              usePointStyle: true,
              boxWidth: 8,
              padding: 10,
              font: { weight: "600", size: isMobile ? 10 : 11.5 },
              color: labelColor
            }
          },
          tooltip: {
            padding: 10,
            callbacks: {
              label: function(ctx) {
                if (ctx.dataset.yAxisID === "y1") {
                  return ` 正確率: ${ctx.parsed.y}%`;
                }
                return ` 作答量: ${ctx.parsed.y} 題 (${weekdayCounts[ctx.dataIndex]} 次練習)`;
              }
            }
          }
        },
        scales: {
          y: {
            type: "linear",
            display: true,
            position: "left",
            beginAtZero: true,
            grid: { color: gridColor },
            ticks: { color: labelColor, font: { size: isMobile ? 9 : 11 } },
            title: { display: true, text: "作答題數", color: labelColor, font: { size: 10, weight: "bold" } }
          },
          y1: {
            type: "linear",
            display: true,
            position: "right",
            beginAtZero: true,
            max: 100,
            grid: { drawOnChartArea: false },
            ticks: {
              color: "#f59e0b",
              font: { size: isMobile ? 9 : 11 },
              callback: v => `${v}%`
            },
            title: { display: true, text: "正確率 (%)", color: "#f59e0b", font: { size: 10, weight: "bold" } }
          },
          x: {
            grid: { color: gridColor },
            ticks: { color: labelColor, font: { size: isMobile ? 9.5 : 11.5, weight: "bold" } }
          }
        }
      }
    });
  }

  // 9. 繪製 Chart 2: 單次練習強度分佈環形圖
  const cvsIntensity = document.getElementById("freqIntensityChart");
  if (cvsIntensity) {
    if (freqIntensityChartInstance) {
      freqIntensityChartInstance.destroy();
      freqIntensityChartInstance = null;
    }
    const ctxI = cvsIntensity.getContext("2d");
    const intensityData = [countLight, countStd, countDeep, countMarathon];
    const totalSessions = countLight + countStd + countDeep + countMarathon;

    freqIntensityChartInstance = new Chart(ctxI, {
      type: "doughnut",
      data: {
        labels: ["輕量溫習 (<10題)", "標準精實 (10~25題)", "深度精熟 (26~50題)", "馬拉松 (50+題)"],
        datasets: [
          {
            data: intensityData,
            backgroundColor: [
              "#10b981",
              "#3b82f6",
              "#8b5cf6",
              "#f97316"
            ],
            borderWidth: 2,
            borderColor: isDark ? "#1e293b" : "#ffffff"
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
          legend: {
            display: true,
            position: "bottom",
            labels: {
              usePointStyle: true,
              boxWidth: 7,
              padding: 8,
              font: { size: isMobile ? 9.5 : 11 },
              color: labelColor
            }
          },
          tooltip: {
            callbacks: {
              label: function(ctx) {
                const val = ctx.parsed;
                const pct = totalSessions > 0 ? Math.round((val / totalSessions) * 100) : 0;
                return ` ${ctx.label}: ${val} 次 (${pct}%)`;
              }
            }
          }
        },
        cutout: "60%"
      }
    });
  }
}

// ════════════════════════════════════════
// 🎯 學習弱點與失誤深度診斷 (Weakness & Error Analysis)
// ════════════════════════════════════════
function renderWeaknessAnalysis() {
  const card = document.getElementById("weaknessCard");
  if (!card) return;

  if (!fullProcessedData || fullProcessedData.length === 0) {
    card.style.display = "none";
    if (weaknessChartInstance) { weaknessChartInstance.destroy(); weaknessChartInstance = null; }
    return;
  }

  const scopeSelect = document.getElementById("weaknessScopeSelect");
  const scope = scopeSelect ? scopeSelect.value : "all";
  const isAll = (scope === "all");
  const activeData = (scope === "filtered" && lastFilteredData && lastFilteredData.length > 0)
    ? lastFilteredData
    : fullProcessedData;

  const latest = activeData[0] || fullProcessedData[0];
  if (!latest) return;

  // 1. 各難度 (LEVEL 1 ~ 5) 統計
  const levelNames = [
    { key: "l1", lvl: 1, name: "LEVEL 1", title: "入門基礎" },
    { key: "l2", lvl: 2, name: "LEVEL 2", title: "初階應用" },
    { key: "l3", lvl: 3, name: "LEVEL 3", title: "進階拓展" },
    { key: "l4", lvl: 4, name: "LEVEL 4", title: "高階挑戰" },
    { key: "l5", lvl: 5, name: "LEVEL 5", title: "精熟攻頂" }
  ];

  let levelStats = [];
  let totalAtt = 0, totalCor = 0;

  if (isAll) {
    totalAtt = latest.cumAttempts || 0;
    totalCor = latest.cumCorrect || 0;
    levelStats = levelNames.map(info => {
      const lObj = latest[info.key] || { cumNum: 0, cumDen: 0 };
      const att = lObj.cumDen || 0;
      const cor = lObj.cumNum || 0;
      const err = Math.max(0, att - cor);
      const errRate = att > 0 ? (err / att) * 100 : 0;
      return { ...info, attempts: att, correct: cor, errors: err, errorRate: errRate };
    });
  } else {
    // 篩選區間：累加該區間內的每日作答與答對
    levelStats = levelNames.map(info => {
      let att = 0, cor = 0;
      activeData.forEach(r => {
        if (r[info.key]) {
          att += (r[info.key].dailyDen || 0);
          cor += (r[info.key].dailyNum || 0);
        }
      });
      totalAtt += att;
      totalCor += cor;
      const err = Math.max(0, att - cor);
      const errRate = att > 0 ? (err / att) * 100 : 0;
      return { ...info, attempts: att, correct: cor, errors: err, errorRate: errRate };
    });
    // 若區間內無 dailyDen（例如僅單一快照點），採用前後累計相減
    if (totalAtt === 0 && activeData.length > 0) {
      const oldest = activeData[activeData.length - 1];
      totalAtt = Math.max(0, (latest.cumAttempts || 0) - (oldest.cumAttempts || 0) + (oldest.dailyAttempts || 0));
      totalCor = Math.max(0, (latest.cumCorrect || 0) - (oldest.cumCorrect || 0) + (oldest.dailyCorrect || 0));
      levelStats = levelNames.map(info => {
        const cObj = latest[info.key] || { cumNum: 0, cumDen: 0 };
        const oObj = oldest[info.key] || { cumNum: 0, cumDen: 0 };
        const att = Math.max(0, (cObj.cumDen || 0) - (oObj.cumDen || 0) + (oObj.dailyDen || 0));
        const cor = Math.max(0, (cObj.cumNum || 0) - (oObj.cumNum || 0) + (oObj.dailyNum || 0));
        const err = Math.max(0, att - cor);
        const errRate = att > 0 ? (err / att) * 100 : 0;
        return { ...info, attempts: att, correct: cor, errors: err, errorRate: errRate };
      });
    }
  }

  const totalErrors = Math.max(0, totalAtt - totalCor);
  const overallErrRate = totalAtt > 0 ? ((totalErrors / totalAtt) * 100) : 0;

  // 2. 最需加強難度等級判定 (有作答中，失誤題數最多或失誤率 >= 25% 者)
  const attemptedLevels = levelStats.filter(l => l.attempts >= 5);
  let worstLevel = null;
  if (attemptedLevels.length > 0) {
    worstLevel = [...attemptedLevels].sort((a, b) => {
      if (b.errors !== a.errors) return b.errors - a.errors;
      return b.errorRate - a.errorRate;
    })[0];
  } else if (levelStats.some(l => l.attempts > 0)) {
    worstLevel = [...levelStats.filter(l => l.attempts > 0)].sort((a, b) => b.errors - a.errors)[0];
  }

  // 3. 填充 4 大核心 KPI 卡片
  // KPI 1: 最需加強難度
  const topLvlEl = document.getElementById("weaknessTopLevel");
  const topLvlSub = document.getElementById("weaknessTopLevelSub");
  if (topLvlEl && topLvlSub) {
    if (worstLevel && worstLevel.errors > 0) {
      topLvlEl.textContent = `${worstLevel.name} (${worstLevel.title})`;
      topLvlEl.style.color = worstLevel.errorRate >= 25 ? "var(--danger)" : "var(--warning)";
      topLvlSub.textContent = `失誤率 ${worstLevel.errorRate.toFixed(1)}% (累計 ${worstLevel.errors} 題失誤)`;
    } else {
      topLvlEl.textContent = "全級表現穩固";
      topLvlEl.style.color = "var(--success)";
      topLvlSub.textContent = "各難度失誤率皆在健康安全區";
    }
  }

  // KPI 2: 累積失誤總題數
  const totErrEl = document.getElementById("weaknessTotalErrors");
  const errRateEl = document.getElementById("weaknessErrorRate");
  if (totErrEl && errRateEl) {
    totErrEl.textContent = `${totalErrors.toLocaleString()} 題`;
    errRateEl.textContent = `整體失誤率 ${overallErrRate.toFixed(1)}% (答對 ${totalCor.toLocaleString()} 題)`;
  }

  // KPI 3: 易遺忘脆弱生字 (學習中單字，僅答對過 1 次)
  const fragileEl = document.getElementById("weaknessFragileCount");
  const fragileSub = document.getElementById("weaknessFragileSub");
  const fragileCount = latest.learning || 0;
  const totalWords = (latest.distWord && latest.distWord.cum !== undefined)
    ? latest.distWord.cum
    : ((latest.mastered || 0) + (latest.practicing || 0) + fragileCount);
  const fragilePct = totalWords > 0 ? Math.round((fragileCount / totalWords) * 100) : 0;
  if (fragileEl && fragileSub) {
    fragileEl.textContent = `${fragileCount.toLocaleString()} 個`;
    fragileSub.textContent = `僅答對 1 次，佔接觸字庫 ${fragilePct}%`;
  }

  // KPI 4: 平均失誤間隔答題 (Combo Tolerance)
  const comboEl = document.getElementById("weaknessComboTolerance");
  const comboSub = document.getElementById("weaknessComboSub");
  const comboTol = totalErrors > 0 ? (totalCor / totalErrors).toFixed(1) : (totalCor > 0 ? `${totalCor}+` : "0");
  if (comboEl && comboSub) {
    comboEl.textContent = `${comboTol} 題/失誤`;
    const numCombo = parseFloat(comboTol) || 0;
    if (numCombo >= 10 || totalErrors === 0) {
      comboSub.textContent = "🔥 專注度極高 (平均10題以上才失誤)";
    } else if (numCombo >= 5) {
      comboSub.textContent = "👍 專注穩定 (平均5~9題失誤一次)";
    } else {
      comboSub.textContent = "⚠️ 專注力需補強 (易因粗心出現失誤)";
    }
  }

  // 4. 動態診斷橫幅 Banner
  const bannerIcon = document.getElementById("weaknessBannerIcon");
  const bannerTitle = document.getElementById("weaknessBannerTitle");
  const bannerDesc = document.getElementById("weaknessBannerDesc");
  if (bannerIcon && bannerTitle && bannerDesc) {
    if (worstLevel && worstLevel.errors > 0 && worstLevel.errorRate >= 20) {
      bannerIcon.textContent = "🎯";
      bannerTitle.textContent = `靶向弱點鎖定：${worstLevel.name} ${worstLevel.title}（失誤率 ${worstLevel.errorRate.toFixed(1)}%）`;
      bannerDesc.textContent = `該難度級別已累積失誤 ${worstLevel.errors} 題，是目前阻礙進一步突破的核心瓶頸。建議搭配間隔重複法，在每日熱身時優先進行 10 題專案強化！`;
    } else if (fragileCount > 30) {
      bannerIcon.textContent = "🌪️";
      bannerTitle.textContent = `生字遺忘風險提示：共有 ${fragileCount} 個脆弱單字待鞏固`;
      bannerDesc.textContent = `目前有 ${fragileCount} 個單字僅答對過 1 次，處於易遺忘臨界區。建議適度放緩推進新字，先將脆弱字庫轉化為熟練記憶！`;
    } else {
      bannerIcon.textContent = "🌟";
      bannerTitle.textContent = "作答基礎穩固！整體失誤率維持在極佳水準";
      bannerDesc.textContent = `目前整體失誤率僅 ${overallErrRate.toFixed(1)}%，且各級別掌握度良好。建議保持目前節奏，並勇敢挑戰更高等級或更長連勝目標！`;
    }
  }

  // 5. 渲染 LEVEL 1 ~ 5 難度失誤率診斷表格
  const tableBody = document.getElementById("weaknessLevelTableBody");
  if (tableBody) {
    let rowsHtml = "";
    levelStats.forEach(lv => {
      let tagClass = "tag-none", tagText = "未涉獵";
      if (lv.attempts === 0) {
        tagClass = "tag-none"; tagText = "未涉獵";
      } else if (lv.errorRate >= 30 || (lv.errors >= 15 && lv.errorRate >= 25)) {
        tagClass = "tag-severe"; tagText = "⚠️ 重點弱點";
      } else if (lv.errorRate >= 18) {
        tagClass = "tag-moderate"; tagText = "⚡ 尚可提升";
      } else {
        tagClass = "tag-safe"; tagText = "✅ 穩固精熟";
      }

      const errRateColor = lv.errorRate >= 25 ? "var(--danger)" : (lv.errorRate >= 18 ? "var(--warning)" : "var(--success)");

      rowsHtml += `
        <tr>
          <td style="text-align:left; font-weight:700;">
            ${lv.name} <span style="font-size:11.5px; font-weight:normal; color:var(--text-muted);">(${lv.title})</span>
          </td>
          <td style="font-weight:600;">${lv.attempts.toLocaleString()}</td>
          <td style="font-weight:600; color:${lv.errors > 0 ? 'var(--danger)' : 'var(--text-muted)'};">${lv.errors.toLocaleString()}</td>
          <td style="font-weight:800; color:${lv.attempts > 0 ? errRateColor : 'var(--text-muted)'};">
            ${lv.attempts > 0 ? lv.errorRate.toFixed(1) + "%" : "-"}
          </td>
          <td><span class="weakness-tag ${tagClass}">${tagText}</span></td>
        </tr>
      `;
    });
    tableBody.innerHTML = rowsHtml;
  }

  // 6. 渲染單字熟練度轉化與遺忘漏斗模型
  const funnelContainer = document.getElementById("weaknessFunnelContainer");
  if (funnelContainer) {
    const masteredCount = latest.mastered || 0;
    const practicingCount = latest.practicing || 0;
    const learningWords = latest.learning || 0;
    const distCum = (latest.distWord && latest.distWord.cum !== undefined)
      ? latest.distWord.cum
      : (masteredCount + practicingCount + learningWords);
    const maxVal = Math.max(1, distCum);

    const stages = [
      {
        icon: "🏆",
        title: "精通單字 (Mastered)",
        sub: "連續答對 ≥ 3 次",
        count: masteredCount,
        pct: Math.round((masteredCount / maxVal) * 100),
        color: "#16a34a",
        note: "已建立神經長程記憶，極難遺忘的安全基石"
      },
      {
        icon: "🔄",
        title: "練習中單字 (Practicing)",
        sub: "累積答對 2 次",
        count: practicingCount,
        pct: Math.round((practicingCount / maxVal) * 100),
        color: "#2563eb",
        note: "邁向精通的關鍵轉化期，再鞏固 1 次即可升級"
      },
      {
        icon: "🟡",
        title: "學習中生字 (Fragile)",
        sub: "僅答對 1 次",
        count: learningWords,
        pct: Math.round((learningWords / maxVal) * 100),
        color: "#f59e0b",
        note: "高遺忘風險脆弱期，需透過間隔重複及時固化"
      },
      {
        icon: "📚",
        title: "總接觸字庫 (Total Indexed)",
        sub: "已涉獵單字母體",
        count: distCum,
        pct: 100,
        color: "#7c3aed",
        note: "已作答並收錄於個人學習記憶庫中的單字總量"
      }
    ];

    let funnelHtml = "";
    stages.forEach(st => {
      funnelHtml += `
        <div class="funnel-stage">
          <div class="funnel-stage-icon">${st.icon}</div>
          <div class="funnel-stage-body">
            <div class="funnel-stage-top">
              <span>${st.title} <span style="font-size:11px; font-weight:normal; color:var(--text-muted);">(${st.sub})</span></span>
              <span style="color:${st.color};">${st.count.toLocaleString()} 字 (${st.pct}%)</span>
            </div>
            <div class="funnel-stage-bar">
              <div class="funnel-stage-fill" style="width:${st.pct}%; background:${st.color};"></div>
            </div>
            <div style="font-size:11px; color:var(--text-muted); margin-top:3px;">${st.note}</div>
          </div>
        </div>
      `;
    });
    funnelContainer.innerHTML = funnelHtml;
  }

  // 7. 渲染歷史作答失誤率走勢圖 (weaknessChart)
  const chartCanvas = document.getElementById("weaknessChart");
  if (chartCanvas) {
    if (weaknessChartInstance) {
      weaknessChartInstance.destroy();
      weaknessChartInstance = null;
    }

    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    const textColor = isDark ? "#cbd5e1" : "#475569";
    const gridColor = isDark ? "rgba(255,255,255,0.08)" : "rgba(0,0,0,0.06)";

    // 按時間正序（舊 -> 新）
    const chrono = [...activeData].filter(r => r.date).reverse();
    const labels = chrono.map(r => r.date);

    const errorRates = chrono.map(r => {
      const dAtt = r.dailyAttempts || 0;
      const dCor = r.dailyCorrect || 0;
      if (dAtt <= 0) return 0;
      const dErr = Math.max(0, dAtt - dCor);
      return Math.round((dErr / dAtt) * 1000) / 10;
    });

    const errorCounts = chrono.map(r => {
      const dAtt = r.dailyAttempts || 0;
      const dCor = r.dailyCorrect || 0;
      return Math.max(0, dAtt - dCor);
    });

    const safeLineData = labels.map(() => 20); // 20% 健康容錯基準線

    const maxRate = Math.max(...errorRates, 30);
    const maxCount = Math.max(...errorCounts, 5);

    const ctx = chartCanvas.getContext("2d");
    weaknessChartInstance = new Chart(ctx, {
      type: "line",
      data: {
        labels: labels,
        datasets: [
          {
            label: "單日失誤率 (%)",
            data: errorRates,
            borderColor: "#ef4444",
            backgroundColor: "rgba(239, 68, 68, 0.12)",
            borderWidth: 2.5,
            fill: true,
            tension: 0.3,
            pointRadius: 4,
            pointHoverRadius: 6,
            pointBackgroundColor: "#ef4444",
            yAxisID: "yRate"
          },
          {
            type: "bar",
            label: "單日失誤題數 (題)",
            data: errorCounts,
            backgroundColor: isDark ? "rgba(248, 113, 113, 0.35)" : "rgba(220, 38, 38, 0.22)",
            borderColor: "#dc2626",
            borderWidth: 1,
            borderRadius: 4,
            yAxisID: "yCount"
          },
          {
            label: "20% 安全容錯基準線",
            data: safeLineData,
            borderColor: "#16a34a",
            borderWidth: 1.5,
            borderDash: [6, 4],
            pointRadius: 0,
            fill: false,
            yAxisID: "yRate"
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: "index", intersect: false },
        plugins: {
          legend: {
            position: "top",
            labels: { boxWidth: 14, color: textColor, font: { size: 11.5, weight: "600" } }
          },
          tooltip: {
            callbacks: {
              label: function(c) {
                if (c.dataset.label === "20% 安全容錯基準線") return " 🟢 20% 健康容錯基準線";
                if (c.datasetIndex === 0) return ` 🔴 單日失誤率: ${c.parsed.y}%`;
                if (c.datasetIndex === 1) return ` 📊 單日失誤題數: ${c.parsed.y} 題`;
                return ` ${c.dataset.label}: ${c.parsed.y}`;
              }
            }
          }
        },
        scales: {
          x: {
            ticks: { color: textColor, font: { size: 10.5 }, maxRotation: 45 },
            grid: { color: gridColor }
          },
          yRate: {
            type: "linear",
            position: "left",
            min: 0,
            max: Math.min(100, Math.ceil((maxRate + 10) / 10) * 10),
            ticks: {
              color: textColor,
              callback: v => v + "%",
              font: { size: 10.5 }
            },
            title: { display: true, text: "失誤率 (%)", color: textColor, font: { size: 11, weight: "bold" } },
            grid: { color: gridColor }
          },
          yCount: {
            type: "linear",
            position: "right",
            min: 0,
            max: Math.ceil((maxCount + 2) / 5) * 5,
            ticks: {
              color: textColor,
              stepSize: 5,
              callback: v => v + " 題",
              font: { size: 10.5 }
            },
            title: { display: true, text: "失誤題數 (題)", color: textColor, font: { size: 11, weight: "bold" } },
            grid: { drawOnChartArea: false }
          }
        }
      }
    });
  }

  // 8. 靶向攻堅處方與學習建議 (Action Prescriptions)
  const actionList = document.getElementById("weaknessActionList");
  if (actionList) {
    const actions = [];

    // 難度梯級攻堅處方
    if (worstLevel && worstLevel.errors > 0) {
      actions.push(`<li>🎯 <strong>難度攻堅處方 (${worstLevel.name})</strong>：目前在 ${worstLevel.name}（${worstLevel.title}）已累積失誤 <strong>${worstLevel.errors} 題</strong>（失誤率 <strong>${worstLevel.errorRate.toFixed(1)}%</strong>）。建議每日練習中固定安排 10~15 題該難度專屬題目，實施「錯題當日回顧 + 隔日再次測試」，打破該難度瓶頸。</li>`);
    } else {
      actions.push(`<li>🌟 <strong>難度拓寬處方</strong>：各難度正確率皆達 85% 以上，基礎非常紮實！建議勇於向 LEVEL 4~5 高階字彙題庫進攻，拓展詞彙深度與難度適應力。</li>`);
    }

    // 生字轉化抗遺忘處方
    if (fragileCount > 30) {
      actions.push(`<li>🌪️ <strong>抗遺忘固化處方</strong>：目前共有 <strong>${fragileCount} 個脆弱生字</strong> 僅答對過 1 次，極易隨時間遺忘。強烈建議在接下來的 3 次練習中，優先透過複習模式加強這批生字，促使其儘速累積 2~3 次正確作答，安全轉化為「精通」狀態。</li>`);
    } else if (fragileCount > 0) {
      actions.push(`<li>⚡ <strong>生字鞏固處方</strong>：目前有 <strong>${fragileCount} 個學習中生字</strong>，比例在健康範圍內。建議每次練習結束前，花 2 分鐘重溫今日遇見的新單字，維持高轉化率。</li>`);
    } else {
      actions.push(`<li>🏆 <strong>生字零滯留處方</strong>：所有遇過的單字皆已進入熟練或精通階段，記憶留存表現完美！</li>`);
    }

    // 專注度與連勝防粗心處方
    const numTol = parseFloat(comboTol) || 0;
    if (numTol < 5 && totalErrors > 5) {
      actions.push(`<li>🧘 <strong>專注防粗心處方</strong>：目前平均每作答 <strong>${comboTol} 題</strong> 就會出現一次失誤。分析可能源於拼寫過快或連續答題疲倦，建議在點擊提交前進行「1 秒核對覆查」，可顯著減少粗心失誤並提升連勝紀錄！</li>`);
    } else {
      actions.push(`<li>🔥 <strong>專注連勝處方</strong>：平均每 <strong>${comboTol} 題</strong> 才出現單次失誤，作答專注力與抗干擾表現優異！可將目標設定在挑戰突破 <strong>${Math.max(latest.bestStreak || 0, 15)} 連勝</strong> 紀錄。</li>`);
    }

    actionList.innerHTML = actions.join("");
  }
}

// ════════════════════════════════════════
// 🌊 單字流轉追蹤與狀態遷移看板 (Word Flow Tracking)
// ════════════════════════════════════════
function renderWordFlowTracking() {
  const card = document.getElementById("wordFlowCard");
  if (!card) return;

  if (!fullProcessedData || fullProcessedData.length === 0) {
    card.style.display = "none";
    if (wordFlowStreamChartInstance) { wordFlowStreamChartInstance.destroy(); wordFlowStreamChartInstance = null; }
    if (wordFlowDailyChartInstance) { wordFlowDailyChartInstance.destroy(); wordFlowDailyChartInstance = null; }
    return;
  }

  const scopeSelect = document.getElementById("wordFlowScopeSelect");
  const scope = scopeSelect ? scopeSelect.value : "all";
  const activeData = (scope === "filtered" && lastFilteredData && lastFilteredData.length > 0)
    ? lastFilteredData
    : fullProcessedData;

  const latest = activeData[0] || fullProcessedData[0];
  const oldest = activeData[activeData.length - 1] || fullProcessedData[fullProcessedData.length - 1];
  if (!latest) return;

  // 1. 單字當前四態計數
  const mastered = latest.mastered || 0;
  const practicing = latest.practicing || 0;
  const learning = latest.learning || 0;
  const distWords = (latest.distWord && latest.distWord.cum !== undefined)
    ? latest.distWord.cum
    : (mastered + practicing + learning);
  const totalIndexed = Math.max(distWords, mastered + practicing + learning, 1);

  // 2. 流速與週期計算 (按時間正序：舊 -> 新)
  const chrono = [...activeData].filter(r => r.date).reverse();
  let daySpan = 1;
  let netInflow = 0;
  let netMastered = 0;

  if (chrono.length >= 2) {
    const firstD = new Date(chrono[0].date.replace(/-/g, "/"));
    const lastD  = new Date(chrono[chrono.length - 1].date.replace(/-/g, "/"));
    daySpan = Math.max(1, Math.round((lastD - firstD) / (1000 * 60 * 60 * 24)));

    const startDist = (chrono[0].distWord && chrono[0].distWord.cum !== undefined)
      ? chrono[0].distWord.cum
      : ((chrono[0].mastered || 0) + (chrono[0].practicing || 0) + (chrono[0].learning || 0));
    netInflow = Math.max(0, totalIndexed - startDist);

    const startM = chrono[0].mastered || 0;
    netMastered = Math.max(0, mastered - startM);
  } else {
    netInflow = (latest.distWord && latest.distWord.daily !== undefined) ? latest.distWord.daily : 0;
    netMastered = (latest.mastered || 0) - (oldest.mastered || 0);
  }

  const inflowSpeed = (netInflow / daySpan).toFixed(1);
  const masterySpeed = (netMastered / daySpan).toFixed(1);
  const masteryRate = ((mastered / totalIndexed) * 100).toFixed(1);
  const pendingWords = practicing + learning;

  let maturationDaysText = "約 14 天";
  let maturationSubText = `尚有 ${pendingWords} 個在途單字推進中`;
  if (pendingWords === 0) {
    maturationDaysText = "已全數精通";
    maturationSubText = "字庫 100% 轉化為長期記憶";
  } else if (parseFloat(masterySpeed) > 0) {
    const mDays = Math.ceil(pendingWords / parseFloat(masterySpeed));
    maturationDaysText = `約 ${mDays} 天`;
    maturationSubText = `依當前升級流速推算全數精通`;
  } else {
    maturationDaysText = "累積推進中";
    maturationSubText = `尚有 ${pendingWords} 個單字待固化`;
  }

  // 3. 填充 4 大核心流速 KPI 卡片
  const mrEl = document.getElementById("wfMasteryRate");
  const mrSub = document.getElementById("wfMasteryRateSub");
  if (mrEl && mrSub) {
    mrEl.textContent = `${masteryRate}%`;
    mrSub.textContent = `精通 ${mastered.toLocaleString()} 字 / 接觸 ${totalIndexed.toLocaleString()} 字`;
  }

  const ifEl = document.getElementById("wfInflowSpeed");
  const ifSub = document.getElementById("wfInflowSpeedSub");
  if (ifEl && ifSub) {
    ifEl.textContent = `+${inflowSpeed} 字/天`;
    ifSub.textContent = `歷經 ${daySpan} 天累計新拓展 ${netInflow} 字`;
  }

  const msEl = document.getElementById("wfMasterySpeed");
  const msSub = document.getElementById("wfMasterySpeedSub");
  if (msEl && msSub) {
    msEl.textContent = `+${masterySpeed} 字/天`;
    msSub.textContent = `歷經 ${daySpan} 天累計晉升 ${netMastered} 字`;
  }

  const mdEl = document.getElementById("wfMaturationDays");
  const mdSub = document.getElementById("wfMaturationDaysSub");
  if (mdEl && mdSub) {
    mdEl.textContent = maturationDaysText;
    mdSub.textContent = maturationSubText;
  }

  // 4. 動態診斷橫幅 Banner
  const bannerIcon = document.getElementById("wordFlowBannerIcon");
  const bannerTitle = document.getElementById("wordFlowBannerTitle");
  const bannerDesc = document.getElementById("wordFlowBannerDesc");
  if (bannerIcon && bannerTitle && bannerDesc) {
    if (pendingWords === 0 && mastered > 0) {
      bannerIcon.textContent = "🏆";
      bannerTitle.textContent = "🌟 單字流轉典範：字庫已全數達成精通長效記憶！";
      bannerDesc.textContent = `目前所有涉獵單字皆已連續答對 3 次以上（總精通 ${mastered} 字），流轉管道無任何滯留淤積，單字記憶極其扎實！`;
    } else if (parseFloat(inflowSpeed) > parseFloat(masterySpeed) * 2.5 && learning >= 30) {
      bannerIcon.textContent = "⚠️";
      bannerTitle.textContent = `⚠️ 單字管道淤積警示：新詞流入過快，複習升級滯後`;
      bannerDesc.textContent = `近期日均開拓新詞（+${inflowSpeed} 字/天）明顯高於精通晉升流速（+${masterySpeed} 字/天），導致 ${learning} 個生字滯留於高遺忘風險區。建議暫緩刷取新題，優先進行 2~3 天複習攻堅！`;
    } else if (parseFloat(masterySpeed) >= 1.5) {
      bannerIcon.textContent = "🌊";
      bannerTitle.textContent = `🌊 單字流轉狀態極佳：精通晉級流速強勁高效！`;
      bannerDesc.textContent = `平均每日將 ${masterySpeed} 個在途單字推進至長效精通，新詞吸收與精熟固化平衡推進，全期精通轉化率高達 ${masteryRate}%！`;
    } else {
      bannerIcon.textContent = "🔄";
      bannerTitle.textContent = "🔄 單字流轉平穩推進中";
      bannerDesc.textContent = `目前有 ${practicing} 個練習中單字與 ${learning} 個生字在管道中運轉，持續維持每日微習慣作答，預計 ${maturationDaysText} 內將迎來大批精通成果！`;
    }
  }

  // 5. 渲染 4 階動態流動管道看板 (Pipeline Kanban)
  const pipelineEl = document.getElementById("wfPipelineContainer");
  if (pipelineEl) {
    const pSteps = [
      {
        title: "🚪 接觸總字庫",
        sub: "Total Pool",
        count: totalIndexed,
        pct: 100,
        color: "#4338ca",
        badge: { text: "母體基底", bg: "#e0e7ff", color: "#3730a3" },
        desc: "歷次作答收錄之全部單字"
      },
      {
        title: "🟡 學習中生字",
        sub: "Learning (1次)",
        count: learning,
        pct: Math.round((learning / totalIndexed) * 100),
        color: "#f59e0b",
        badge: learning > 35
          ? { text: "⚠️ 待固化", bg: "rgba(239,68,68,0.15)", color: "#dc2626" }
          : { text: "🌱 初始吸收", bg: "rgba(245,158,11,0.15)", color: "#d97706" },
        desc: "僅答對 1 次，處於易遺忘期"
      },
      {
        title: "🔄 練習中詞彙",
        sub: "Practicing (2次)",
        count: practicing,
        pct: Math.round((practicing / totalIndexed) * 100),
        color: "#2563eb",
        badge: { text: "⚡ 關鍵轉化", bg: "rgba(37,99,235,0.15)", color: "#1d4ed8" },
        desc: "累積答對 2 次，即將邁入精通"
      },
      {
        title: "🏆 長效精通庫",
        sub: "Mastered (≥3次)",
        count: mastered,
        pct: Math.round((mastered / totalIndexed) * 100),
        color: "#16a34a",
        badge: { text: "⭐ 穩固精熟", bg: "rgba(22,163,74,0.15)", color: "#15803d" },

// 工具函式
// ════════════════════════════════════════
function toIntSafe(v) {
  if (!v) return 0;
  const n = parseInt(String(v).replace(/,/g,"").trim(), 10);
  return isNaN(n) ? 0 : n;
}
function parseRatio(s) {
  s = String(s || "");
  if (s.includes("/")) {
    const p = s.split("/");
    return { num: toIntSafe(p[0]), den: toIntSafe(p[1]) };
  }
  return { num: toIntSafe(s), den: 0 };
}
function escapeHtml(s) {
  return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function formatSigned(n) { return n > 0 ? `+${n}` : `${n}`; }
function formatDateYMD(d) {
  if (!d) return "";
  if (typeof d === "string") {
    const s = d.trim().replace(/\//g, "-");
    const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) return `${m[1]}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
    try {
      const parsed = new Date(s);
      if (!isNaN(parsed.getTime())) {
        return `${parsed.getFullYear()}-${String(parsed.getMonth()+1).padStart(2,"0")}-${String(parsed.getDate()).padStart(2,"0")}`;
      }
    } catch(_) {}
    return s;
  }
  if (d instanceof Date && !isNaN(d.getTime())) {
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
  }
  return "";
}

function getWeekRangeDates(baseDate = new Date()) {
  const d = new Date(baseDate);
  const day = d.getDay();
  const diffToMon = d.getDate() - day + (day === 0 ? -6 : 1);
  const mon = new Date(d.getFullYear(), d.getMonth(), diffToMon);
  const fri = new Date(d.getFullYear(), d.getMonth(), diffToMon + 4);
  const sat = new Date(d.getFullYear(), d.getMonth(), diffToMon + 5);
  const sun = new Date(d.getFullYear(), d.getMonth(), diffToMon + 6);
  const fmt = (dt) => dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
  return {
    monday: fmt(mon),
    friday: fmt(fri),
    saturday: fmt(sat),
    sunday: fmt(sun)
  };
}

function getBiweeklyCycleInfo(baseDate = new Date()) {
  const d = new Date(baseDate);
  const target = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const dayNr = (target.getUTCDay() + 6) % 7;
  target.setUTCDate(target.getUTCDate() - dayNr + 3);
  const firstThursday = target.valueOf();
  target.setUTCMonth(0, 1);
  if (target.getUTCDay() !== 4) {
    target.setUTCMonth(0, 1 + ((4 - target.getUTCDay()) + 7) % 7);
  }
  const isoWeek = 1 + Math.ceil((firstThursday - target) / 604800000);

  let semesterStartDate = "";
  let manualCurrentWeek = 0;
  try {
    const raw = localStorage.getItem("conquer_roll_settings");
    if (raw) {
      const cfg = JSON.parse(raw);
      if (cfg.semesterStartDate) semesterStartDate = String(cfg.semesterStartDate).trim();
      if (cfg.manualCurrentWeek) manualCurrentWeek = parseInt(cfg.manualCurrentWeek, 10) || 0;
    }
  } catch(_) {}

  let semesterWeek = 1;
  if (manualCurrentWeek > 0) {
    semesterWeek = manualCurrentWeek;
  } else if (semesterStartDate) {
    const sDate = new Date(semesterStartDate + "T00:00:00");
    if (!isNaN(sDate.getTime())) {
      const sDay = sDate.getDay();
      const sMon = new Date(sDate.getFullYear(), sDate.getMonth(), sDate.getDate() - sDay + (sDay === 0 ? -6 : 1));
      const curMon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dayNr);
      const diffWeeks = Math.floor((curMon - sMon) / (7 * 86400000));
      semesterWeek = Math.max(1, diffWeeks + 1);
    }
  } else {
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const defStart = (m >= 2 && m <= 7) ? new Date(y, 1, 15) : (m < 2 ? new Date(y - 1, 7, 30) : new Date(y, 7, 30));
    const sDay = defStart.getDay();
    const sMon = new Date(defStart.getFullYear(), defStart.getMonth(), defStart.getDate() - sDay + (sDay === 0 ? -6 : 1));
    const curMon = new Date(d.getFullYear(), d.getMonth(), d.getDate() - dayNr);
    const diffWeeks = Math.floor((curMon - sMon) / (7 * 86400000));
    semesterWeek = Math.max(1, diffWeeks + 1);
  }
  
  const isBiweeklyBossWeek = (semesterWeek % 2 === 0);
  const weekOfCycle = isBiweeklyBossWeek ? 2 : 1;
  const currentWeek = getWeekRangeDates(d);
  
  const day = d.getDay();
  const diffToMon = d.getDate() - day + (day === 0 ? -6 : 1);
  const prevMon = new Date(d.getFullYear(), d.getMonth(), diffToMon - 7);
  const prevFri = new Date(d.getFullYear(), d.getMonth(), diffToMon - 3);
  const fmt = (dt) => dt.getFullYear() + "-" + String(dt.getMonth() + 1).padStart(2, "0") + "-" + String(dt.getDate()).padStart(2, "0");
  const prevWeek = {
    monday: fmt(prevMon),
    friday: fmt(prevFri)
  };

  return {
    isoWeek,
    semesterWeek,
    manualCurrentWeek,
    semesterStartDate,
    isBiweeklyBossWeek,
    weekOfCycle,
    currentWeek,
    prevWeek,
    scanStartStr: isBiweeklyBossWeek ? prevWeek.monday : currentWeek.monday,
    scanEndStr: currentWeek.friday
  };
}

function formatWeekendTaskDate(ds, fallbackText = "") {
  let target = ds || "";
  if (!target && fallbackText) {
    const match = String(fallbackText).match(/\b(\d{4}[-/]\d{1,2}[-/]\d{1,2})\b/);
    if (match) target = match[1];
  }
  if (!target) return "";
  const clean = String(target).trim().split(/[T\s]/)[0].replace(/\//g, "-");
  const m = clean.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) {
    return `${m[1]}/${m[2].padStart(2, "0")}/${m[3].padStart(2, "0")}`;
  }
  return clean.replace(/-/g, "/");
}

// ════════════════════════════════════════
function downloadChartImage(canvasId, title) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) {
    showToast("找不到對應的圖表畫布", "danger");
    return;
  }
  if (!canvas.width || !canvas.height) {
    showToast("圖表尚未繪製完成，請稍候再試", "danger");
    return;
  }

  try {
    const isDark = document.documentElement.getAttribute("data-theme") === "dark";
    const bgColor = isDark ? "#1e293b" : "#ffffff";
    const textColor = isDark ? "#f8fafc" : "#0f172a";
    const subColor = isDark ? "#94a3b8" : "#64748b";

    // 建立離屏 Canvas 進行壓印排版
    const offCanvas = document.createElement("canvas");
    const headerHeight = 70;
    const padding = 20;
    offCanvas.width = canvas.width + padding * 2;
    offCanvas.height = canvas.height + headerHeight + padding * 2;

    const ctx = offCanvas.getContext("2d");

    // 1. 繪製底色
    ctx.fillStyle = bgColor;
    ctx.fillRect(0, 0, offCanvas.width, offCanvas.height);

    // 2. 繪製標題與學生帳號時戳
    const targetUser = viewingStudent || currentUser || "學生";
    const timeStr = new Date().toLocaleString("zh-TW", { hour12: false });
    ctx.fillStyle = textColor;
    ctx.font = "bold 20px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillText(title, padding, padding + 28);

    ctx.fillStyle = subColor;
    ctx.font = "13px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    ctx.fillText(`學生：${targetUser} ｜ 匯出時間：${timeStr} ｜ 英語單字學習歷程儀表板`, padding, padding + 52);

    // 3. 繪製分隔細線
    ctx.strokeStyle = isDark ? "#334155" : "#e2e8f0";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding, padding + 62);
    ctx.lineTo(offCanvas.width - padding, padding + 62);
    ctx.stroke();

    // 4. 將原圖繪製到離屏 Canvas
    ctx.drawImage(canvas, padding, padding + headerHeight);

    // 5. 輸出下載
    const dataUrl = offCanvas.toDataURL("image/png");
    const link = document.createElement("a");
    const cleanTitle = title.replace(/[\\/:*?"<>|]/g, "_");
    link.download = `${targetUser}_${cleanTitle}_${formatDateYMD(new Date())}.png`;
    link.href = dataUrl;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast(`✅ 圖表已成功下載：${cleanTitle}.png`, "success");
  } catch (err) {
    showToast(`圖表下載失敗：${err.message || err}`, "danger");
  }
}
