<script>
function processHistoryWithDiffs(originalHeaders, originalRows) {
  const exclude = ["完整JSON","等級","連勝","最佳連勝"];
  const keepIndices = [];
  displayHeaders = [];

  for (let i = 0; i < originalHeaders.length; i++) {
    const h = originalHeaders[i];
    if (exclude.includes(h)) continue;
    displayHeaders.push(h === "備份時間" ? "日期" : h);
    keepIndices.push(i);
  }

  const rows  = originalRows.map(r => keepIndices.map(idx => r[idx]));
  const total = rows.length;

  const streakColIdx = originalHeaders.findIndex(h => {
    const s = String(h || "").trim();
    return s === "連勝" || s === "目前連勝" || s === "當前連勝" || (s.includes("連勝") && !s.includes("最佳") && !s.includes("最長") && !s.includes("最高"));
  });
  const bestColIdx = originalHeaders.findIndex(h => {
    const s = String(h || "").trim();
    return s === "最佳連勝" || s === "最長連勝" || s === "最高連勝" || s.includes("最佳連勝") || s.includes("最長連勝") || s.includes("最高連勝");
  });
  const rawJsonColIdx = originalHeaders.indexOf("完整JSON");

  const dateCol     = 0;
  const attemptsCol = displayHeaders.findIndex(h => h.includes("受測單字") || h.includes("作答題數"));
  const correctCol  = displayHeaders.findIndex(h => h.includes("共答對單字") || h.includes("答對單字") || h.includes("答對題數"));
  const accCol      = displayHeaders.findIndex(h => h.includes("單字掌握率") || h.includes("正確率"));
  const masteredCol = displayHeaders.findIndex(h => h.includes("精通"));
  const scoreCol    = displayHeaders.findIndex(h => h.includes("分數"));
  const distWordCol = displayHeaders.findIndex(h => h.includes("共答對單字") || h.includes("答對單字"));
  const learningCol = displayHeaders.findIndex(h => h.includes("學習中"));
  const practicingCol = displayHeaders.findIndex(h => h.includes("練習中"));
  const l1Col = displayHeaders.findIndex(h => h.includes("LEVEL1") || h.includes("LEVEL 1"));
  const l2Col = displayHeaders.findIndex(h => h.includes("LEVEL2") || h.includes("LEVEL 2"));
  const l3Col = displayHeaders.findIndex(h => h.includes("LEVEL3") || h.includes("LEVEL 3"));
  const l4Col = displayHeaders.findIndex(h => h.includes("LEVEL4") || h.includes("LEVEL 4"));
  const l5Col = displayHeaders.findIndex(h => h.includes("LEVEL5") || h.includes("LEVEL 5"));

  fullProcessedData = [];

  for (let i = 0; i < total; i++) {
    const curr = rows[i];
    const prev = (i + 1 < total) ? rows[i + 1] : null;

    const currAtt = attemptsCol >= 0 ? toIntSafe(curr[attemptsCol]) : 0;
    const currCor = correctCol  >= 0 ? toIntSafe(curr[correctCol])  : 0;
    const prevAtt = prev && attemptsCol >= 0 ? toIntSafe(prev[attemptsCol]) : 0;
    const prevCor = prev && correctCol  >= 0 ? toIntSafe(prev[correctCol])  : 0;

    const dAtt = prev ? (currAtt - prevAtt) : currAtt;
    const dCor = prev ? (currCor - prevCor) : currCor;
    const dAcc = dAtt > 0 ? ((dCor / dAtt) * 100) : 0;

    const getRatioDiff = col => {
      const cR = parseRatio(col >= 0 ? String(curr[col] || "") : "");
      const pR = prev && col >= 0 ? parseRatio(String(prev[col] || "")) : { num: 0, den: 0 };
      return { cumNum: cR.num, cumDen: cR.den, dailyNum: cR.num - pR.num, dailyDen: cR.den - pR.den };
    };
    const getIntDiff = col => {
      const cVal = col >= 0 ? toIntSafe(curr[col]) : 0;
      const pVal = prev && col >= 0 ? toIntSafe(prev[col]) : 0;
      return { cum: cVal, daily: prev ? (cVal - pVal) : cVal };
    };

    const cellsHtml = [];
    for (let c = 0; c < displayHeaders.length; c++) {
      const valStr = String(curr[c] || "").trim();
      const colHeader = String(displayHeaders[c] || "");
      if (c === accCol) {
        const accClass = dAcc >= 80 ? "acc-high" : (dAcc < 50 ? "acc-low" : "acc-mid");
        cellsHtml.push(`
          <div class="cum-val">${escapeHtml(valStr || "0%")}</div>
          <div class="accuracy-pill ${accClass}" title="單日作答正確率">單日: ${dAtt > 0 ? dAcc.toFixed(1)+"%" : "0.0%"}</div>
        `);
      } else if (colHeader.includes("指定測驗成績") || colHeader.includes("測驗成績")) {
        cellsHtml.push(`
          <div class="cum-val" style="font-size:14px; font-weight:800; color:var(--primary);">${escapeHtml(valStr || "—")}</div>
        `);
      } else if (colHeader.includes("自由練習")) {
        cellsHtml.push(`
          <div class="cum-val" style="font-size:13px; font-weight:700;">${escapeHtml(valStr || "—")}</div>
        `);
      } else if (colHeader.includes("狀態")) {
        let statusColor = "var(--ink)";
        if (valStr.includes("已完成")) statusColor = "#15803d";
        else if (valStr.includes("未完成") || valStr.includes("中斷")) statusColor = "#c2410c";
        else if (valStr.includes("未受測") || valStr.includes("缺席")) statusColor = "#dc2626";
        cellsHtml.push(`
          <span style="font-weight:750; color:${statusColor};">${escapeHtml(valStr)}</span>
        `);
      } else if (valStr.includes("/")) {
        const currR = parseRatio(valStr);
        const prevR = prev ? parseRatio(prev[c]) : { num: 0, den: 0 };
        const dNum = prev ? (currR.num - prevR.num) : currR.num;
        const dDen = prev ? (currR.den - prevR.den) : currR.den;
        const badge = dNum > 0 ? "diff-up" : (dNum < 0 ? "diff-down" : "diff-zero");
        const pct   = currR.den > 0 ? Math.round((currR.num / currR.den) * 100) : 0;
        cellsHtml.push(`
          <div class="${currR.den === 0 ? "zero-val" : ""}">
            <span class="cum-val" style="font-size:14px;">${currR.num}/${currR.den}</span>
            ${currR.den > 0 ? `<br><span style="font-size:11px;font-weight:bold;color:var(--text-muted);">答對率: ${pct}%</span>` : ""}
            <div class="diff-badge ${badge}">(${formatSigned(dNum)}/${formatSigned(dDen)})</div>
          </div>`);
      } else if (valStr !== "" && /^[-+]?\d[\d,]*$/.test(valStr)) {
        const currN = toIntSafe(valStr);
        const prevN = prev ? toIntSafe(prev[c]) : 0;
        const diff  = prev ? (currN - prevN) : currN;
        const badge = diff > 0 ? "diff-up" : (diff < 0 ? "diff-down" : "diff-zero");
        cellsHtml.push(`
          <div class="${currN === 0 ? "zero-val" : ""}">
            <span class="cum-val">${currN}</span>
            <span class="diff-badge ${badge}">(${formatSigned(diff)})</span>
          </div>`);
      } else {
        cellsHtml.push(escapeHtml(valStr));
      }
    }

    let rowStreak = streakColIdx >= 0 ? toIntSafe(originalRows[i][streakColIdx]) : 0;
    let rowBest   = bestColIdx   >= 0 ? toIntSafe(originalRows[i][bestColIdx])   : 0;

    const rawJsonStr = rawJsonColIdx >= 0 ? originalRows[i][rawJsonColIdx] : "";
    if (rowStreak === 0 && rowBest === 0 && rawJsonStr) {
      try {
        if (!rawJsonStr.startsWith("GZ:")) {
          const parsed = JSON.parse(rawJsonStr);
          const rawAgent = parsed["spellAgent.v2"];
          const agent = (typeof rawAgent === "string") ? JSON.parse(rawAgent) : (rawAgent || {});
          if (agent.streak) rowStreak = toIntSafe(agent.streak);
          if (agent.best) rowBest = toIntSafe(agent.best);
        }
      } catch (_) {}
    }
    rowBest = Math.max(rowBest, rowStreak);

    fullProcessedData.push({
      date: String(curr[dateCol] || "").substring(0, 10).replace(/\//g, "-"),
      rawTimestamp: String(curr[dateCol] || ""),
      rawRow: curr,
      rawJsonText: rawJsonStr,
      cellsHtml,
      dailyAttempts: dAtt, dailyCorrect: dCor,
      cumAttempts: currAtt, cumCorrect: currCor,
      streak: rowStreak,
      bestStreak: rowBest,
      mastered:   masteredCol   >= 0 ? toIntSafe(curr[masteredCol])   : 0,
      learning:   learningCol   >= 0 ? toIntSafe(curr[learningCol])   : 0,
      practicing: practicingCol >= 0 ? toIntSafe(curr[practicingCol]) : 0,
      accuracyStr: curr[accCol] || "0%",
      score:    getIntDiff(scoreCol),
      distWord: getIntDiff(distWordCol),
      l1: getRatioDiff(l1Col), l2: getRatioDiff(l2Col),
      l3: getRatioDiff(l3Col), l4: getRatioDiff(l4Col),
      l5: getRatioDiff(l5Col)
    });
  }

  // 全歷程最高連勝保護：確保任一紀錄的 bestStreak 均至少為該生歷史最高
  const allTimeBestOverall = fullProcessedData.reduce((max, r) => Math.max(max, r.bestStreak || 0, r.streak || 0), 0);
  fullProcessedData.forEach(r => {
    r.bestStreak = Math.max(r.bestStreak || 0, allTimeBestOverall);
  });
}

// ════════════════════════════════════════
// 篩選 & 渲染
// ════════════════════════════════════════
function applyFilter(resetPage = true) {
  const startDate = document.getElementById("startDate").value;
  const endDate   = document.getElementById("endDate").value;
  const rc        = document.getElementById("resultTable");

  if (!fullProcessedData || fullProcessedData.length === 0) {
    rc.innerHTML = noDataHtml("📭", "尚無學習歷程資料", "目前尚無任何同步的學習記錄。");
    updateKpis([]); updateCharts(); renderHeatmap(); updateGoalsProgress(); renderForecast(); renderFrequencyAnalysis(); renderWeaknessAnalysis(); renderWordFlowTracking(); return;
  }

  lastFilteredData = fullProcessedData.filter(item => {
    if (!item.date) return true;
    if (startDate && item.date < startDate) return false;
    if (endDate   && item.date > endDate)   return false;
    return true;
  });

  if (lastFilteredData.length === 0) {
    rc.innerHTML = noDataHtml("📭", "查無學習紀錄", "此日期範圍內沒有任何練習資料，請調整篩選條件。");
    updateKpis([]); updateCharts(); renderHeatmap(); updateGoalsProgress(); renderForecast(); renderFrequencyAnalysis(); renderWeaknessAnalysis(); renderWordFlowTracking(); return;
  }

  if (resetPage) currentPage = 1;
  updateKpis(lastFilteredData);
  renderTableAndCards(lastFilteredData.slice((currentPage-1)*pageSize, currentPage*pageSize));

  // 🚀 關鍵效能優化 (Idle / Lazy Deferred Rendering)：
  // 優先保障首屏 KPI 與分頁表格 0 延遲秒開，將 6 大重型圖表移至 requestIdleCallback 延遲繪製，徹底杜絕畫面卡死
  const scheduleIdle = (typeof window !== "undefined" && window.requestIdleCallback)
    ? window.requestIdleCallback
    : ((cb) => setTimeout(cb, 40));

  scheduleIdle(() => {
    updateCharts();
    renderHeatmap();
    updateGoalsProgress();
    scheduleIdle(() => {
      renderForecast();
      renderFrequencyAnalysis();
      renderWeaknessAnalysis();
      renderWordFlowTracking();
    });
  });
}

function noDataHtml(icon, title, desc) {
  return `<div class="no-data"><span class="no-data-icon">${icon}</span><div class="no-data-title">${title}</div><div>${desc}</div></div>`;
}

function renderTableAndCards(pagedData) {
  const rc = document.getElementById("resultTable");

  let tableHtml = `<table class="student-data-table"><thead><tr>`;
  displayHeaders.forEach(h => { tableHtml += `<th>${escapeHtml(h).replace(/\n/g,"<br>")}</th>`; });
  tableHtml += `</tr></thead><tbody>`;
  pagedData.forEach(row => {
    tableHtml += "<tr>";
    row.cellsHtml.forEach(c => { tableHtml += `<td>${c}</td>`; });
    tableHtml += "</tr>";
  });
  tableHtml += "</tbody></table>";

  let cardsHtml = "";
  pagedData.forEach(row => {
    const dScore = row.score.daily;
    const scoreDiffBadge = dScore > 0 ? `<span class="diff-badge diff-up">(+${dScore})</span>` : (dScore < 0 ? `<span class="diff-badge diff-down">(${dScore})</span>` : "");
    const dAttText = row.dailyAttempts > 0 ? `+${row.dailyAttempts}` : "0";
    const dCorText = row.dailyCorrect > 0 ? `+${row.dailyCorrect}` : "0";
    const accVal = parseFloat(row.accuracyStr) || 0;
    const accClass = accVal >= 80 ? "acc-high" : (accVal < 50 ? "acc-low" : "acc-mid");

    cardsHtml += `
      <div class="mobile-card">
        <div class="mobile-card-header">
          <span style="font-size:13.5px; font-weight:700;">📅 ${escapeHtml(row.date)}</span>
          <span style="color:var(--primary); font-weight:800; font-size:14.5px;">${row.score.cum} 分 ${scoreDiffBadge}</span>
        </div>
        <div class="mobile-card-body">
          <div class="mobile-item">
            <span class="mobile-label">累計作答 (今日)</span>
            <strong>${row.cumAttempts.toLocaleString()} 題 <span class="diff-badge ${row.dailyAttempts > 0 ? 'diff-up' : 'diff-zero'}">(+${dAttText})</span></strong>
          </div>
          <div class="mobile-item">
            <span class="mobile-label">累計答對 (今日)</span>
            <strong>${row.cumCorrect.toLocaleString()} 題 <span class="diff-badge ${row.dailyCorrect > 0 ? 'diff-up' : 'diff-zero'}">(+${dCorText})</span></strong>
          </div>
          <div class="mobile-item">
            <span class="mobile-label">正確率 (歷史/單日)</span>
            <div>
              <span class="accuracy-pill ${accClass}">${escapeHtml(row.accuracyStr)}</span>
              <span style="font-size:11px; color:var(--text-muted); font-weight:600; margin-left:3px;">(單日 ${row.dailyAttempts > 0 ? ((row.dailyCorrect/row.dailyAttempts)*100).toFixed(1)+'%' : '0%'})</span>
            </div>
          </div>
          <div class="mobile-item">
            <span class="mobile-label">單字熟練 (精/練/學)</span>
            <strong style="color:var(--success);">🟢${row.mastered} <span style="color:var(--primary);">🔵${row.practicing}</span> <span style="color:var(--warning);">🟠${row.learning}</span></strong>
          </div>
          <div class="mobile-item">
            <span class="mobile-label">連續打卡 / 最佳</span>
            <strong style="color:#ea580c;">🔥 ${row.streak} 天 <span style="color:var(--text-muted); font-size:11px; font-weight:normal;">(最佳 ${row.bestStreak} 天)</span></strong>
          </div>
          <div class="mobile-item">
            <span class="mobile-label">答對不重複單字</span>
            <strong style="color:var(--primary);">${row.distWord.cum} 個</strong>
          </div>
          <div class="mobile-item" style="grid-column: 1 / -1; background:var(--table-header-bg); padding:8px 10px; border-radius:8px; border:1px solid var(--border); margin-top:2px;">
            <span class="mobile-label" style="margin-bottom:4px;">各關卡累積答對率 (LEVEL 1 ~ 5)</span>
            <div style="display:flex; justify-content:space-between; font-size:11.5px; font-weight:700; flex-wrap:wrap; gap:4px;">
              <span>L1: ${row.l1.cumNum}/${row.l1.cumDen}</span>
              <span>L2: ${row.l2.cumNum}/${row.l2.cumDen}</span>
              <span>L3: ${row.l3.cumNum}/${row.l3.cumDen}</span>
              <span>L4: ${row.l4.cumNum}/${row.l4.cumDen}</span>
              <span>L5: ${row.l5.cumNum}/${row.l5.cumDen}</span>
            </div>
          </div>
        </div>
      </div>`;
  });

  const totalPages = Math.ceil(lastFilteredData.length / pageSize);
  let pagHtml = "";
  if (totalPages > 1) {
    pagHtml += `<div class="pagination-wrapper">`;
    pagHtml += `<button class="pagination-btn" onclick="changePage(1)" ${currentPage===1?"disabled":""}>« 首頁</button>`;
    pagHtml += `<button class="pagination-btn" onclick="changePage(${currentPage-1})" ${currentPage===1?"disabled":""}>‹ 上頁</button>`;
    const sp = Math.max(1, currentPage-2), ep = Math.min(totalPages, currentPage+2);
    for (let p = sp; p <= ep; p++) {
      pagHtml += `<button class="pagination-btn page-num ${p===currentPage?"active":""}" onclick="changePage(${p})">${p}</button>`;
    }
    pagHtml += `<button class="pagination-btn" onclick="changePage(${currentPage+1})" ${currentPage===totalPages?"disabled":""}>下頁 ›</button>`;
    pagHtml += `<button class="pagination-btn" onclick="changePage(${totalPages})" ${currentPage===totalPages?"disabled":""}>末頁 »</button>`;
    pagHtml += `<span class="pagination-info">第 ${currentPage} / ${totalPages} 頁 (共 ${lastFilteredData.length} 筆)</span>`;
    pagHtml += `</div>`;
  }

  // 🚀 DOM 節點主動回收清理：釋放舊分頁的 DOM 參考，防止行動裝置記憶體洩漏與發燙
  while (rc.firstChild) {
    rc.removeChild(rc.firstChild);
  }
  rc.innerHTML = tableHtml + cardsHtml + pagHtml;
}

function changePage(page) {
  currentPage = page;
  renderTableAndCards(lastFilteredData.slice((currentPage-1)*pageSize, currentPage*pageSize));
  document.getElementById("resultCard").scrollIntoView({ behavior:"smooth", block:"start" });
}

// ════════════════════════════════════════
// KPI 更新
// ════════════════════════════════════════
function updateKpis(filteredList) {
  if (!filteredList || filteredList.length === 0) {
    ["kpiAttempts","kpiTotalAttempts","kpiCorrect","kpiTotalCorrect",
     "kpiAccuracy","kpiTotalAccuracy","kpiMastered","kpiLearning",
     "kpiCurrentStreak","kpiCurrentStreakSub","kpiBestStreak","kpiBestStreakSub",
     "kpiAttemptsTrend","kpiCorrectTrend","kpiAccuracyTrend","kpiMasteredTrend",
     "kpiCurrentStreakTrend","kpiBestStreakTrend"]
      .forEach(id => { const el=document.getElementById(id); if(el) el.innerHTML=""; });
    return;
  }
  let totalDailyAtt = 0, totalDailyCor = 0;
  filteredList.forEach(r => { totalDailyAtt += r.dailyAttempts; totalDailyCor += r.dailyCorrect; });
  const periodAcc = totalDailyAtt > 0 ? ((totalDailyCor/totalDailyAtt)*100).toFixed(1)+"%" : "0%";
  const latest  = filteredList[0];
  const earliest = filteredList[filteredList.length - 1];

  animateKpiValue("kpiAttempts",     `${totalDailyAtt} 題`);
  animateKpiValue("kpiTotalAttempts",`總累積：${latest.cumAttempts} 題`);
  animateKpiValue("kpiCorrect",      `${totalDailyCor} 題`);
  animateKpiValue("kpiTotalCorrect", `總累積：${latest.cumCorrect} 題`);
  animateKpiValue("kpiAccuracy",      periodAcc);
  animateKpiValue("kpiTotalAccuracy",`歷史總正確率：${latest.accuracyStr}`);
  animateKpiValue("kpiMastered",     `${latest.mastered} 個精通`);
  document.getElementById("kpiLearning").innerText = `學習中 / 練習中：${latest.learning} / ${latest.practicing}`;

  // ── 連勝紀錄（目前連勝 & 最長連勝）──
  const curStreak = latest.streak || 0;
  const bestStreak = Math.max(latest.bestStreak || 0, curStreak);

  animateKpiValue("kpiCurrentStreak", `${curStreak} 次`);
  const curStreakSubEl = document.getElementById("kpiCurrentStreakSub");
  if (curStreakSubEl) {
    if (curStreak > 0 && curStreak >= bestStreak) {
      curStreakSubEl.innerHTML = `<span style="color:var(--success); font-weight:700;">🏆 創個人歷史新高！</span>`;
    } else if (curStreak >= 10) {
      curStreakSubEl.innerHTML = `<span style="color:#ea580c; font-weight:600;">🔥 火燙狀態！連續 ${curStreak} 題</span>`;
    } else if (curStreak > 0) {
      curStreakSubEl.innerHTML = `<span style="color:var(--primary); font-weight:600;">⚡ 連續答對保持中</span>`;
    } else {
      curStreakSubEl.innerHTML = `<span style="color:var(--text-muted);">歷史最長：${bestStreak} 次連勝</span>`;
    }
  }

  animateKpiValue("kpiBestStreak", `${bestStreak} 次`);
  const bestStreakSubEl = document.getElementById("kpiBestStreakSub");
  if (bestStreakSubEl) {
    if (curStreak >= bestStreak && bestStreak > 0) {
      bestStreakSubEl.innerHTML = `<span style="color:#e11d48; font-weight:700;">🌟 當前即為歷史巔峰！</span>`;
    } else if (bestStreak > 0) {
      bestStreakSubEl.innerHTML = `個人歷史最高連續答對`;
    } else {
      bestStreakSubEl.innerHTML = `尚未建立連勝紀錄`;
    }
  }

  function renderTrend(nv, ov, isP = false) {
    const diff = nv - ov;
    const cls = diff > 0 ? "up" : (diff < 0 ? "down" : "flat");
    const arrow = diff > 0 ? "▲" : (diff < 0 ? "▼" : "●");
    const sign  = diff > 0 ? "+" : "";
    const txt   = isP ? `${sign}${diff.toFixed(1)}%` : `${sign}${diff}`;
    return `<span class="kpi-trend ${cls}" title="對比區間最早一筆: ${txt}">${arrow}</span>`;
  }
  document.getElementById("kpiAttemptsTrend").innerHTML = renderTrend(latest.cumAttempts, earliest.cumAttempts);
  document.getElementById("kpiCorrectTrend").innerHTML  = renderTrend(latest.cumCorrect,  earliest.cumCorrect);
  document.getElementById("kpiAccuracyTrend").innerHTML = renderTrend(parseFloat(latest.accuracyStr)||0, parseFloat(earliest.accuracyStr)||0, true);
  document.getElementById("kpiMasteredTrend").innerHTML = renderTrend(latest.mastered, earliest.mastered);
  document.getElementById("kpiCurrentStreakTrend").innerHTML = renderTrend(curStreak, earliest.streak || 0);
  document.getElementById("kpiBestStreakTrend").innerHTML    = renderTrend(bestStreak, earliest.bestStreak || 0);
}

// ════════════════════════════════════════
// 圖表更新（Chart.js，三級智能聚合）
// ════════════════════════════════════════
function updateCharts() {
  if (!lastFilteredData || lastFilteredData.length === 0) { destroyCharts(); return; }

  const isDark     = document.documentElement.getAttribute("data-theme") === "dark";
  const gridColor  = isDark ? "rgba(255,255,255,0.1)" : "rgba(0,0,0,0.05)";
  const labelColor = isDark ? "#94a3b8" : "#64748b";
  const isMobile   = window.innerWidth < 768;
  const metric     = document.getElementById("chartMetricSelect").value;
  const modeBadge  = document.getElementById("chartModeBadge");
  const sparseNotice = document.getElementById("sparseDataNotice");

  let rawChrono = [...lastFilteredData].reverse();
  const totalRecords = rawChrono.length;

  if (totalRecords < 3) {
    sparseNotice.style.display = "block";
    sparseNotice.innerHTML = `💡 目前僅有 <strong>${totalRecords} 筆</strong>練習紀錄，資料不足以繪製完整趨勢圖。`;
  } else { sparseNotice.style.display = "none"; }

  let daySpan = 0;
  if (totalRecords >= 2) {
    daySpan = Math.round(Math.abs(new Date(rawChrono[totalRecords-1].date) - new Date(rawChrono[0].date)) / 86400000);
  }

  function groupByCalendarWeek(data) {
    const buckets={}, order=[];
    data.forEach(item => {
      const d = new Date(item.date), day = d.getDay()||7;
      const thu = new Date(d); thu.setDate(d.getDate()+4-day);
      const ys = new Date(thu.getFullYear(),0,1);
      const wn = Math.ceil(((thu-ys)/86400000+1)/7);
      const key = `${thu.getFullYear()}-W${String(wn).padStart(2,"0")}`;
      if(!buckets[key]){buckets[key]=[];order.push(key);}
      buckets[key].push(item);
    });
    return order.map(k=>buckets[k]);
  }
  function groupByMonth(data) {
    const buckets={}, order=[];
    data.forEach(item => {
      const key = item.date.substring(0,7);
      if(!buckets[key]){buckets[key]=[];order.push(key);}
      buckets[key].push(item);
    });
    return order.map(k=>buckets[k]);
  }
  function aggregateBuckets(buckets, labelFn) {
    return buckets.map((bucket, bIdx) => {
      const last = bucket[bucket.length-1];
      const levels={};
      ["l1","l2","l3","l4","l5"].forEach(lk => {
        levels[lk]={ cumNum:last[lk].cumNum, cumDen:last[lk].cumDen,
          dailyNum:bucket.reduce((s,i)=>s+i[lk].dailyNum,0),
          dailyDen:bucket.reduce((s,i)=>s+i[lk].dailyDen,0) };
      });
      return { date:labelFn(bIdx,bucket),
        score:{cum:last.score.cum, daily:bucket.reduce((s,i)=>s+i.score.daily,0)},
        distWord:{cum:last.distWord.cum, daily:bucket.reduce((s,i)=>s+i.distWord.daily,0)},
        dailyAttempts:bucket.reduce((s,i)=>s+i.dailyAttempts,0),
        dailyCorrect:bucket.reduce((s,i)=>s+i.dailyCorrect,0),
        cumAttempts:last.cumAttempts, cumCorrect:last.cumCorrect,
        accuracyStr:last.accuracyStr, mastered:last.mastered,
        learning:last.learning, practicing:last.practicing, ...levels };
    });
  }

  let chronoData=[], labels=[], modeText="";
  const weekTh  = isMobile ? 14 : 30;
  const monthTh = isMobile ? 45 : 90;

  if (totalRecords < 3) {
    chronoData=rawChrono; labels=chronoData.map(d=>d.date.substring(5)); modeText=`📅 日視圖 (${totalRecords} 筆)`;
  } else if (daySpan > monthTh || totalRecords > (isMobile?30:60)) {
    const b=groupByMonth(rawChrono);
    chronoData=aggregateBuckets(b,(i,bk)=>bk[0].date.substring(0,7));
    labels=chronoData.map(d=>d.date); modeText=`📅 月視圖 (聚合自 ${daySpan} 天 / ${totalRecords} 筆)`;
  } else if (daySpan > weekTh || totalRecords > weekTh) {
    const b=groupByCalendarWeek(rawChrono);
    chronoData=aggregateBuckets(b,(i,bk)=>{const d=new Date(bk[0].date);return `${d.getMonth()+1}/${d.getDate()} 週`;});
    labels=chronoData.map(d=>d.date); modeText=`📅 週視圖 (聚合自 ${daySpan} 天 / ${totalRecords} 筆)`;
  } else {
    chronoData=rawChrono; labels=chronoData.map(d=>d.date.substring(5)); modeText=`📅 日視圖 (${totalRecords} 筆 / ${daySpan} 天)`;
  }

  modeBadge.textContent=modeText; modeBadge.style.display="inline-block";

  const colorPrimary = isDark?"#60a5fa":"#2563eb";
  const colorSuccess = "#16a34a";
  const colorAttempt = isDark?"#475569":"#94a3b8";

  const linDS = (label,data,color) => ({
    label, data, borderColor:color,
    backgroundColor: color===colorPrimary ? (isDark?"rgba(96,165,250,0.1)":"rgba(37,99,235,0.1)") : "rgba(22,163,74,0.1)",
    borderWidth: isMobile?1.5:2, fill:true, tension:0.3,
    pointRadius:isMobile?2:4, pointHoverRadius:isMobile?4:6
  });
  const barDS = (label,data,color) => ({label, data, backgroundColor:color, borderRadius:4});

  const commonOpts = (yTitle, showLegend, forceInt=false, stacked=false) => ({
    responsive:true, maintainAspectRatio:false,
    plugins:{
      legend:{display:showLegend, position:"top",
        labels:{usePointStyle:true, boxWidth:isMobile?6:8, padding:isMobile?8:12,
          font:{weight:"bold", size:isMobile?10:11}, color:labelColor}},
      tooltip:{padding:isMobile?6:10}
    },
    scales:{
      y:{stacked, beginAtZero:true,
        title:{display:!!yTitle, text:yTitle, color:labelColor, font:{size:isMobile?10:12, weight:"600"}},
        grid:{color:gridColor},
        ticks:{color:labelColor, font:{size:isMobile?9:11},
          ...(forceInt?{stepSize:1, callback:v=>Math.floor(v)===v?v:undefined}:{})}},
      x:{stacked, grid:{color:gridColor},
        ticks:{color:labelColor, font:{size:isMobile?9:11},
          maxRotation:isMobile?45:30, minRotation:0,
          maxTicksLimit:isMobile?7:12, autoSkip:true}}
    },
    interaction:{mode:"index", intersect:false}
  });

  destroyCharts();

  // 圖 1：累積歷程
  let cumDS=[], cumYT="累積數值";
  if(metric==="score") { cumDS.push(linDS("總分數",chronoData.map(d=>d.score.cum),colorPrimary)); }
  else if(metric==="accuracy") { cumYT="正確率(%)"; cumDS.push(linDS("總正確率(%)",chronoData.map(d=>parseFloat(d.accuracyStr)||0),colorPrimary)); }
  else if(metric==="distinct_words") { cumDS.push(linDS("總答對單字數",chronoData.map(d=>d.distWord.cum),colorPrimary)); }
  else if(metric==="total_attempts_correct") { cumYT="正確率(%)"; cumDS.push(linDS("累積正確率(%)",chronoData.map(d=>d.cumAttempts>0?parseFloat((d.cumCorrect/d.cumAttempts*100).toFixed(1)):0),colorPrimary)); }
  else if(metric.startsWith("l")) {
    const tMap={l1:"LEVEL 1",l2:"LEVEL 2",l3:"LEVEL 3",l4:"LEVEL 4",l5:"LEVEL 5"}; cumYT="正確率(%)";
    cumDS.push(linDS(`${tMap[metric]} 累積正確率(%)`,chronoData.map(d=>d[metric].cumDen>0?parseFloat((d[metric].cumNum/d[metric].cumDen*100).toFixed(1)):0),colorPrimary));
  } else { cumDS.push(linDS("總分數",chronoData.map(d=>d.score.cum),colorPrimary)); }

  cumChartInstance = new Chart(document.getElementById("cumChart").getContext("2d"),
    {type:"line", data:{labels,datasets:cumDS}, options:commonOpts(cumYT,true,false,false)});

  // 圖 2：單日練習
  let dailyDS=[], dailyYT="單日數量";
  if(metric==="score") { dailyDS.push(barDS("單日獲得分數",chronoData.map(d=>d.score.daily),colorSuccess)); }
  else if(metric==="accuracy") { dailyYT="正確率(%)"; dailyDS.push(barDS("單日正確率(%)",chronoData.map(d=>d.dailyAttempts>0?parseFloat((d.dailyCorrect/d.dailyAttempts*100).toFixed(1)):0),colorPrimary)); }
  else if(metric==="distinct_words") { dailyDS.push(barDS("單日新增單字數",chronoData.map(d=>d.distWord.daily),colorSuccess)); }
  else if(metric==="total_attempts_correct") { dailyDS.push(barDS("作答題數(灰)",chronoData.map(d=>d.dailyAttempts),colorAttempt)); dailyDS.push(barDS("答對題數(綠)",chronoData.map(d=>d.dailyCorrect),colorSuccess)); }
  else if(metric.startsWith("l")) { dailyDS.push(barDS("作答題數(灰)",chronoData.map(d=>d[metric].dailyDen),colorAttempt)); dailyDS.push(barDS("答對題數(綠)",chronoData.map(d=>d[metric].dailyNum),colorSuccess)); }
  else { dailyDS.push(barDS("作答題數(灰)",chronoData.map(d=>d.dailyAttempts),colorAttempt)); dailyDS.push(barDS("答對題數(綠)",chronoData.map(d=>d.dailyCorrect),colorSuccess)); }

  dailyChartInstance = new Chart(document.getElementById("dailyChart").getContext("2d"),
    {type:"bar", data:{labels,datasets:dailyDS}, options:commonOpts(dailyYT,dailyDS.length>1,true,false)});

  // 圖 3：單字累積掌握
  const cM="#16a34a", cP="#2563eb", cL="#d97706", cT=isDark?"#f8fafc":"#0f172a";
  const lIdx = chronoData.length-1;
  wordCumChartInstance = new Chart(document.getElementById("wordCumChart").getContext("2d"), {
    data:{labels, datasets:[
      {type:"line",label:"總答對單字數",data:chronoData.map(d=>d.distWord.cum),borderColor:cT,borderWidth:2,pointRadius:3,fill:false,tension:0.3,order:-1},
      {type:"bar",label:"精通(累積)",data:chronoData.map((d,i)=>i===lIdx?d.mastered:0),backgroundColor:cM},
      {type:"bar",label:"練習中(累積)",data:chronoData.map((d,i)=>i===lIdx?d.practicing:0),backgroundColor:cP},
      {type:"bar",label:"學習中(累積)",data:chronoData.map((d,i)=>i===lIdx?d.learning:0),backgroundColor:cL}
    ]},
    options:commonOpts("單字量",true,true,true)
  });

  // 圖 4：單日單字增減
  wordDailyChartInstance = new Chart(document.getElementById("wordDailyChart").getContext("2d"), {
    type:"bar",
    data:{labels, datasets:[
      {label:"精通淨增",   data:chronoData.map((d,i)=>i===0?d.mastered   :d.mastered   -chronoData[i-1].mastered),   backgroundColor:cM},
      {label:"練習中淨增", data:chronoData.map((d,i)=>i===0?d.practicing :d.practicing -chronoData[i-1].practicing), backgroundColor:cP},
      {label:"學習中淨增", data:chronoData.map((d,i)=>i===0?d.learning   :d.learning   -chronoData[i-1].learning),   backgroundColor:cL}
    ]},
    options:commonOpts("變化量",true,true,true)
  });

  // 圖 5：LEVEL 1~5 能力進度雷達圖
  updateRadarChart();
}

// ════════════════════════════════════════
// 圖 5：LEVEL 1~5 能力進度雷達圖
// ════════════════════════════════════════
function updateRadarChart() {
  const radarCanvas = document.getElementById("radarChart");
  if (!radarCanvas) return;
  if (radarChartInstance) { radarChartInstance.destroy(); radarChartInstance = null; }

  if (!lastFilteredData || lastFilteredData.length === 0) return;

  const isDark     = document.documentElement.getAttribute("data-theme") === "dark";
  const gridColor  = isDark ? "rgba(255,255,255,0.12)" : "rgba(0,0,0,0.06)";
  const labelColor = isDark ? "#94a3b8" : "#64748b";
  const isMobile   = window.innerWidth < 768;
  const metricType = (document.getElementById("radarMetricSelect")?.value) || "accuracy";

  const latest = lastFilteredData[0]; // 最新一筆紀錄（第一列）
  const lvKeys = ["l1", "l2", "l3", "l4", "l5"];
  const labels = ["LEVEL 1 入門", "LEVEL 2 基礎", "LEVEL 3 進階", "LEVEL 4 挑戰", "LEVEL 5 精熟"];

  // 計算選定區間總和（所有篩選筆數的每日增量累計）
  const periodTotals = lvKeys.map(k => {
    let num = 0, den = 0;
    lastFilteredData.forEach(row => {
      if (row[k]) {
        num += (row[k].dailyNum || 0);
        den += (row[k].dailyDen || 0);
      }
    });
    return { num, den, acc: den > 0 ? Math.round((num / den) * 100) : 0 };
  });

  // 最新累積數據
  const cumData = lvKeys.map(k => {
    const obj = (latest && latest[k]) ? latest[k] : { cumNum: 0, cumDen: 0 };
    return {
      num: obj.cumNum || 0,
      den: obj.cumDen || 0,
      acc: obj.cumDen > 0 ? Math.round((obj.cumNum / obj.cumDen) * 100) : 0
    };
  });

  let datasets = [];
  let rScaleOpts = {
    grid: { color: gridColor },
    angleLines: { color: gridColor },
    pointLabels: { color: labelColor, font: { size: isMobile ? 10 : 12, weight: "bold" } }
  };

  if (metricType === "accuracy") {
    datasets = [
      {
        label: "總累積正確率 (%)",
        data: cumData.map(d => d.acc),
        backgroundColor: isDark ? "rgba(96, 165, 250, 0.25)" : "rgba(37, 99, 235, 0.2)",
        borderColor: isDark ? "#60a5fa" : "#2563eb",
        borderWidth: 2,
        pointBackgroundColor: isDark ? "#60a5fa" : "#2563eb",
        pointRadius: isMobile ? 2.5 : 3.5
      },
      {
        label: "選定區間正確率 (%)",
        data: periodTotals.map(d => d.acc),
        backgroundColor: isDark ? "rgba(34, 197, 94, 0.2)" : "rgba(22, 163, 74, 0.15)",
        borderColor: "#16a34a",
        borderWidth: 1.8,
        pointBackgroundColor: "#16a34a",
        pointRadius: isMobile ? 2.5 : 3.5
      },
      {
        label: "精通門檻 (80%)",
        data: [80, 80, 80, 80, 80],
        borderColor: "#f59e0b",
        borderWidth: 1.5,
        borderDash: [4, 4],
        pointRadius: 0,
        fill: false
      }
    ];

    rScaleOpts.min = 0;
    rScaleOpts.max = 100;
    rScaleOpts.ticks = {
      stepSize: 20,
      callback: v => v + "%",
      backdropColor: "transparent",
      color: labelColor,
      font: { size: isMobile ? 9 : 10 }
    };

  } else if (metricType === "correct") {
    datasets = [
      {
        label: "總累積答對題數",
        data: cumData.map(d => d.num),
        backgroundColor: isDark ? "rgba(34, 197, 94, 0.25)" : "rgba(22, 163, 74, 0.2)",
        borderColor: "#16a34a",
        borderWidth: 2,
        pointBackgroundColor: "#16a34a",
        pointRadius: isMobile ? 2.5 : 3.5
      },
      {
        label: "選定區間答對題數",
        data: periodTotals.map(d => d.num),
        backgroundColor: isDark ? "rgba(96, 165, 250, 0.2)" : "rgba(37, 99, 235, 0.15)",
        borderColor: isDark ? "#60a5fa" : "#2563eb",
        borderWidth: 1.8,
        pointBackgroundColor: isDark ? "#60a5fa" : "#2563eb",
        pointRadius: isMobile ? 2.5 : 3.5
      }
    ];
    rScaleOpts.beginAtZero = true;
    rScaleOpts.ticks = {
      stepSize: 5,
      callback: v => Math.floor(v) === v ? v : "",
      backdropColor: "transparent",
      color: labelColor,
      font: { size: isMobile ? 9 : 10 }
    };

  } else { // attempts
    datasets = [
      {
        label: "總累積作答題數",
        data: cumData.map(d => d.den),
        backgroundColor: isDark ? "rgba(148, 163, 184, 0.25)" : "rgba(100, 116, 139, 0.2)",
        borderColor: isDark ? "#94a3b8" : "#64748b",
        borderWidth: 2,
        pointBackgroundColor: isDark ? "#94a3b8" : "#64748b",
        pointRadius: isMobile ? 2.5 : 3.5
      },
      {
        label: "選定區間作答題數",
        data: periodTotals.map(d => d.den),
        backgroundColor: isDark ? "rgba(96, 165, 250, 0.2)" : "rgba(37, 99, 235, 0.15)",
        borderColor: isDark ? "#60a5fa" : "#2563eb",
        borderWidth: 1.8,
        pointBackgroundColor: isDark ? "#60a5fa" : "#2563eb",
        pointRadius: isMobile ? 2.5 : 3.5
      }
    ];
    rScaleOpts.beginAtZero = true;
    rScaleOpts.ticks = {
      stepSize: 5,
      callback: v => Math.floor(v) === v ? v : "",
      backdropColor: "transparent",
      color: labelColor,
      font: { size: isMobile ? 9 : 10 }
    };
  }

  radarChartInstance = new Chart(radarCanvas.getContext("2d"), {
    type: "radar",
    data: { labels, datasets },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          display: true,
          position: "bottom",
          labels: {
            usePointStyle: true,
            boxWidth: isMobile ? 6 : 8,
            padding: isMobile ? 8 : 12,
            font: { weight: "bold", size: isMobile ? 10 : 11 },
            color: labelColor
          }
        },
        tooltip: {
          padding: isMobile ? 6 : 10,
          callbacks: {
            label: ctx => ` ${ctx.dataset.label}: ${ctx.raw}${metricType === "accuracy" ? "%" : " 題"}`
          }
        }
      },
      scales: {
        r: rScaleOpts
      }
    }
  });
}

// 匯出 CSV（個別學生）
// ════════════════════════════════════════
function exportToCsv() {
  if (!lastFilteredData || lastFilteredData.length === 0) { showToast("無可匯出的資料"); return; }
  let csv = "\uFEFF" + displayHeaders.map(safeCsvCell).join(",") + "\n";
  lastFilteredData.forEach(item => {
    csv += item.rawRow.map(safeCsvCell).join(",") + "\n";
  });
  const blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
  const url  = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `學習歷程_${viewingStudent||currentUser}_${formatDateYMD(new Date())}.csv`;
  document.body.appendChild(link); link.click(); document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

// ════════════════════════════════════════
// 學習活動熱力圖 (Activity Heatmap)
// ════════════════════════════════════════
function renderHeatmap() {
  const container = document.getElementById("heatmapGridContainer");
  const card = document.getElementById("heatmapCard");
  if (!container || !card) return;

  if (!fullProcessedData || fullProcessedData.length === 0) {
    document.getElementById("hmCurrentStreak").textContent = "0 天";
    document.getElementById("hmCurrentStreakSub").textContent = "尚無練習紀錄";
    document.getElementById("hmMaxStreak").textContent = "0 天";
    document.getElementById("hmActiveDays").textContent = "0 天";
    document.getElementById("hmActiveRate").textContent = "活躍率 0%";
    document.getElementById("hmTotalMetricVal").textContent = "0 題";
    document.getElementById("hmTotalAverage").textContent = "日均 0 題";
    container.innerHTML = `<div class="no-data" style="padding:24px 0;"><span class="no-data-icon">📭</span><div class="no-data-title">尚無活動紀錄</div></div>`;
    const bars = document.getElementById("heatmapWeekdayBars");
    if (bars) bars.innerHTML = "";
    return;
  }

  const metricSel = document.getElementById("heatmapMetricSelect");
  const rangeSel = document.getElementById("heatmapRangeSelect");
  const metric = metricSel ? metricSel.value : "attempts";
  const range = rangeSel ? rangeSel.value : "1year";

  // 1. 日期聚合 Map (以全歷史 fullProcessedData 為準，確保打卡連續性真實無誤)
  const dailyMap = {};
  fullProcessedData.forEach(row => {
    const d = row.date;
    if (!d) return;
    if (!dailyMap[d]) {
      dailyMap[d] = { attempts: 0, correct: 0, score: 0, count: 0 };
    }
    dailyMap[d].attempts += (row.dailyAttempts || 0);
    dailyMap[d].correct  += (row.dailyCorrect  || 0);
    dailyMap[d].score    += (row.score && row.score.daily ? row.score.daily : 0);
    dailyMap[d].count++;
  });

  // 2. 計算連續打卡天數 (Streak)
  const allDates = Object.keys(dailyMap).sort();
  const today = new Date();
  const todayStr = formatDateYMD(today);
  const yest = new Date(today);
  yest.setDate(today.getDate() - 1);
  const yestStr = formatDateYMD(yest);

  let currentStreak = 0;
  let checkD = new Date(today);
  // 若今天尚未練習，則由昨日往前推進檢驗
  if (!dailyMap[todayStr] || dailyMap[todayStr].attempts <= 0) {
    checkD = yest;
  }
  while (true) {
    const s = formatDateYMD(checkD);
    if (dailyMap[s] && dailyMap[s].attempts > 0) {
      currentStreak++;
      checkD.setDate(checkD.getDate() - 1);
    } else {
      break;
    }
  }

  // 歷史最長打卡天數
  let maxStreak = 0;
  if (allDates.length > 0) {
    let curS = 0;
    const startD = new Date(allDates[0]);
    const endD = new Date(today);
    let iter = new Date(startD);
    while (iter <= endD) {
      const s = formatDateYMD(iter);
      if (dailyMap[s] && dailyMap[s].attempts > 0) {
        curS++;
        if (curS > maxStreak) maxStreak = curS;
      } else {
        curS = 0;
      }
      iter.setDate(iter.getDate() + 1);
    }
  }

  // 3. 根據選定時間範圍決定週數
  let numWeeks = 52;
  if (range === "6months") numWeeks = 26;
  else if (range === "3months") numWeeks = 13;
  else if (range === "all") {
    if (allDates.length > 0) {
      const earliest = new Date(allDates[0]);
      const diffDays = Math.ceil(Math.abs(today - earliest) / 86400000);
      numWeeks = Math.max(13, Math.min(104, Math.ceil(diffDays / 7) + 1));
    } else {
      numWeeks = 52;
    }
  }

  // 計算網格起訖日（以本週六為截止日，週日為起始日）
  const gridEnd = new Date(today);
  gridEnd.setDate(today.getDate() + (6 - today.getDay()));
  const gridStart = new Date(gridEnd);
  gridStart.setDate(gridEnd.getDate() - (numWeeks * 7 - 1));

  // 4. 生成週列數據
  const weeks = [];
  let iterDate = new Date(gridStart);
  let totalMetricInView = 0;
  let activeDaysInView = 0;
  const weekdayTotals = [0, 0, 0, 0, 0, 0, 0];
  const weekdayCounts = [0, 0, 0, 0, 0, 0, 0];

  for (let w = 0; w < numWeeks; w++) {
    const days = [];
    for (let d = 0; d < 7; d++) {
      const dStr = formatDateYMD(iterDate);
      const isFuture = iterDate > today;
      const dataObj = dailyMap[dStr] || { attempts: 0, correct: 0, score: 0, count: 0 };

      let val = 0;
      if (metric === "correct") val = dataObj.correct;
      else if (metric === "score") val = dataObj.score;
      else val = dataObj.attempts;

      if (!isFuture) {
        if (dataObj.attempts > 0) activeDaysInView++;
        totalMetricInView += val;
        weekdayTotals[d] += val;
        weekdayCounts[d]++;
      }

      days.push({
        dateStr: dStr,
        dayOfWeek: d,
        val: isFuture ? 0 : val,
        attempts: isFuture ? 0 : dataObj.attempts,
        correct: isFuture ? 0 : dataObj.correct,
        score: isFuture ? 0 : dataObj.score,
        isFuture,
        month: iterDate.getMonth(),
        dayOfMonth: iterDate.getDate()
      });

      iterDate.setDate(iterDate.getDate() + 1);
    }
    weeks.push(days);
  }

  // 5. 更新 KPI 看板數值
  document.getElementById("hmCurrentStreak").textContent = `${currentStreak} 天`;
  document.getElementById("hmCurrentStreakSub").textContent = currentStreak > 0
    ? (dailyMap[todayStr] && dailyMap[todayStr].attempts > 0 ? "今日已打卡 🎉" : "今日尚未打卡，快去練習！")
    : "尚未開始連續打卡";
  document.getElementById("hmMaxStreak").textContent = `${maxStreak} 天`;

  const totalDaysInView = numWeeks * 7;
  const activeRate = totalDaysInView > 0 ? ((activeDaysInView / totalDaysInView) * 100).toFixed(1) : "0";
  document.getElementById("hmActiveDays").textContent = `${activeDaysInView} 天`;
  document.getElementById("hmActiveRate").textContent = `近 ${numWeeks} 週活躍率 ${activeRate}%`;

  const metricNames = { attempts: "作答題數", correct: "答對題數", score: "獲得分數" };
  const metricUnits = { attempts: "題", correct: "題", score: "分" };
  document.getElementById("hmTotalMetricLabel").textContent = `📊 區間總${metricNames[metric] || "練習"}`;
  document.getElementById("hmTotalMetricVal").textContent = `${totalMetricInView.toLocaleString()} ${metricUnits[metric] || ""}`;
  const avgPerActive = activeDaysInView > 0 ? (totalMetricInView / activeDaysInView).toFixed(1) : "0";
  document.getElementById("hmTotalAverage").textContent = `活躍日均 ${avgPerActive} ${metricUnits[metric] || ""}`;

  // 更新圖例提示
  const leg1 = document.getElementById("legLvl1");
  const leg2 = document.getElementById("legLvl2");
  const leg3 = document.getElementById("legLvl3");
  const leg4 = document.getElementById("legLvl4");
  if (leg1) {
    if (metric === "score") {
      leg1.title = "1 ~ 50 分"; leg2.title = "51 ~ 150 分"; leg3.title = "151 ~ 300 分"; leg4.title = "300+ 分";
    } else {
      leg1.title = "1 ~ 10 題"; leg2.title = "11 ~ 25 題"; leg3.title = "26 ~ 50 題"; leg4.title = "50+ 題";
    }
  }

  const getLvlClass = val => {
    if (!val || val <= 0) return "lvl-0";
    if (metric === "score") {
      if (val <= 50) return "lvl-1";
      if (val <= 150) return "lvl-2";
      if (val <= 300) return "lvl-3";
      return "lvl-4";
    } else {
      if (val <= 10) return "lvl-1";
      if (val <= 25) return "lvl-2";
      if (val <= 50) return "lvl-3";
      return "lvl-4";
    }
  };

  // 6. 生成月份列
  const monthNames = ["1月","2月","3月","4月","5月","6月","7月","8月","9月","10月","11月","12月"];
  let monthsHtml = `<div class="heatmap-months-row">`;
  let lastMarkedCol = -10;
  const colWidth = 16.5; // cell 13px + gap 3.5px

  weeks.forEach((w, wIdx) => {
    const d0 = w[0];
    if (d0.dayOfMonth <= 7 && (wIdx - lastMarkedCol) >= 3) {
      monthsHtml += `<span class="heatmap-month-label" style="left:${wIdx * colWidth}px;">${monthNames[d0.month]}</span>`;
      lastMarkedCol = wIdx;
    }
  });
  monthsHtml += `</div>`;

  // 星期標籤列
  const daysColHtml = `
    <div class="heatmap-days-col">
      <div class="heatmap-day-label"></div>
      <div class="heatmap-day-label">週一</div>
      <div class="heatmap-day-label"></div>
      <div class="heatmap-day-label">週三</div>
      <div class="heatmap-day-label"></div>
      <div class="heatmap-day-label">週五</div>
      <div class="heatmap-day-label"></div>
    </div>
  `;

  // 繪製週欄位與儲存格
  let weeksHtml = `<div class="heatmap-weeks-row">`;
  weeks.forEach(w => {
    weeksHtml += `<div class="heatmap-week-col">`;
    w.forEach(d => {
      if (d.isFuture) {
        weeksHtml += `<div class="heatmap-cell lvl-0" style="opacity:0.25; cursor:default;" data-future="1"></div>`;
      } else {
        const lvlCls = getLvlClass(d.val);
        const accStr = d.attempts > 0 ? ((d.correct / d.attempts) * 100).toFixed(1) + "%" : "0%";
        const dayLabel = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"][d.dayOfWeek] || "";
        weeksHtml += `<div class="heatmap-cell ${lvlCls}" 
          role="button" tabindex="0" aria-label="${d.dateStr} ${dayLabel}，作答 ${d.attempts} 題，正確率 ${accStr}"
          data-date="${d.dateStr}" 
          data-dow="${d.dayOfWeek}"
          data-att="${d.attempts}" 
          data-cor="${d.correct}" 
          data-score="${d.score}" 
          data-acc="${accStr}"></div>`;
      }
    });
    weeksHtml += `</div>`;
  });
  weeksHtml += `</div>`;

  container.innerHTML = `
    ${monthsHtml}
    <div class="heatmap-body">
      ${daysColHtml}
      ${weeksHtml}
    </div>
  `;

  // 自動捲動至最新日期（最右側）
  const scrollArea = document.querySelector(".heatmap-scroll-area");
  if (scrollArea) {
    scrollArea.scrollLeft = scrollArea.scrollWidth;
  }

  // 7. 綁定 Tooltip
  setupHeatmapTooltips();

  // 8. 渲染星期偏好長條圖
  renderWeekdayBars(weekdayTotals, weekdayCounts, metricUnits[metric] || "題");
}

function setupHeatmapTooltips() {
  const tooltip = document.getElementById("heatmapTooltip");
  if (!tooltip) return;
  const cells = document.querySelectorAll(".heatmap-cell:not([data-future='1'])");
  const dayNames = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];

  cells.forEach(cell => {
    const showTip = e => {
      const date = cell.getAttribute("data-date");
      const dow = parseInt(cell.getAttribute("data-dow") || "0", 10);
      const att = parseInt(cell.getAttribute("data-att") || "0", 10);
      const cor = parseInt(cell.getAttribute("data-cor") || "0", 10);
      const score = parseInt(cell.getAttribute("data-score") || "0", 10);
      const acc = cell.getAttribute("data-acc") || "0%";
      const accVal = parseFloat(acc);

      if (att === 0) {
        tooltip.innerHTML = `
          <div style="font-weight:700; color:#cbd5e1;">📅 ${date} (${dayNames[dow]})</div>
          <div style="color:#94a3b8; margin-top:2px;">當日無練習紀錄</div>
        `;
      } else {
        const accColor = accVal >= 80 ? "#4ade80" : (accVal < 60 ? "#f87171" : "#60a5fa");
        tooltip.innerHTML = `
          <div style="font-weight:700; margin-bottom:3px; color:#f8fafc;">📅 ${date} (${dayNames[dow]})</div>
          <div>作答：<strong>${att}</strong> 題 ｜ 答對：<strong style="color:#4ade80;">${cor}</strong> 題</div>
          <div>正確率：<strong style="color:${accColor};">${acc}</strong> ｜ 得分：<strong style="color:#fbbf24;">+${score}</strong> 分</div>
        `;
      }

      tooltip.style.display = "block";
      const rect = cell.getBoundingClientRect();
      tooltip.style.left = `${rect.left + rect.width / 2}px`;
      tooltip.style.top = `${rect.top}px`;
    };

    cell.addEventListener("mouseenter", showTip);
    cell.addEventListener("click", e => {
      showTip(e);
      const date = cell.getAttribute("data-date");
      if (date) {
        const qDate = document.getElementById("queryDate") || document.getElementById("targetDate");
        if (qDate) {
          qDate.value = date;
          const qBtn = document.getElementById("btnQuery") || document.getElementById("btnSearch");
          if (qBtn) qBtn.click();
        }
      }
    });
    cell.addEventListener("focus", showTip);
    cell.addEventListener("blur", () => {
      tooltip.style.display = "none";
    });
    cell.addEventListener("mouseleave", () => {
      tooltip.style.display = "none";
    });
  });
}

function renderWeekdayBars(weekdayTotals, weekdayCounts, unit) {
  const container = document.getElementById("heatmapWeekdayBars");
  if (!container) return;
  const dayNames = ["週日", "週一", "週二", "週三", "週四", "週五", "週六"];
  const maxVal = Math.max(...weekdayTotals, 1);

  let html = `<span style="font-weight:600; color:var(--text); margin-right:4px;">📅 星期練習偏好：</span>`;
  dayNames.forEach((name, idx) => {
    const tot = weekdayTotals[idx];
    const avg = weekdayCounts[idx] > 0 ? (tot / weekdayCounts[idx]).toFixed(1) : 0;
    const pct = Math.round((tot / maxVal) * 100);
    html += `
      <div class="weekday-bar-item" title="${name} 累積練習 ${tot} ${unit}，平均每日 ${avg} ${unit}">
        <span>${name}</span>
        <div class="weekday-bar-track">
          <div class="weekday-bar-fill" style="width:${pct}%;"></div>
        </div>
        <span style="font-size:10.5px; color:var(--text-muted);">${tot}</span>
      </div>
    `;
  });
  container.innerHTML = html;
}

// 學習目標與里程碑 (Goals & Milestones)
// ════════════════════════════════════════
let currentGoals = {
  masteredTarget: 50,
  attemptsTarget: 300,
  accuracyTarget: 80,
  streakTarget: 7,
  deadline: ""
};

function updateGoalsProgress() {
  const card = document.getElementById("goalsCard");
  if (!card) return;

  if (!fullProcessedData || fullProcessedData.length === 0) {
    document.getElementById("overallGoalText").textContent = "尚無學習紀錄可計算目標";
    document.getElementById("overallGoalFill").style.width = "0%";
    return;
  }

  // 最新數據
  const latest = fullProcessedData[0];
  const curMastered = latest.mastered || 0;
  const curAttempts = latest.cumAttempts || 0;
  const curAcc = parseFloat(latest.accuracyStr) || 0;

  // Streak 計算（取當前連續打卡）
  const hmStreakEl = document.getElementById("hmCurrentStreak");
  let curStreak = 0;
  if (hmStreakEl) {
    curStreak = parseInt(hmStreakEl.textContent) || 0;
  } else {
    const todayStr = formatDateYMD(new Date());
    const yest = new Date(); yest.setDate(yest.getDate() - 1);
    let sCount = 0;
    const dateSet = new Set(fullProcessedData.filter(r => r.dailyAttempts > 0).map(r => r.date));
    let checkD = dateSet.has(todayStr) ? new Date() : yest;
    while (dateSet.has(formatDateYMD(checkD))) {
      sCount++;
      checkD.setDate(checkD.getDate() - 1);
    }
    curStreak = sCount;
  }

  const g = currentGoals;
  const tMastered = g.masteredTarget || 50;
  const tAttempts = g.attemptsTarget || 300;
  const tAcc      = g.accuracyTarget || 80;
  const tStreak   = g.streakTarget   || 7;

  // 1. 精通單字
  const pctMastered = Math.round((curMastered / tMastered) * 100);
  document.getElementById("goalCurrMastered").textContent = `${curMastered} 個`;
  document.getElementById("goalTargetMastered").textContent = `目標：${tMastered} 個`;
  document.getElementById("goalPctMastered").textContent = `${pctMastered}%`;
  document.getElementById("goalFillMastered").style.width = `${Math.min(pctMastered, 100)}%`;
  const chipMastered = document.getElementById("goalStatusMastered");
  const cardMastered = document.getElementById("goalCardMastered");
  if (curMastered >= tMastered) {
    chipMastered.className = "goal-status-chip status-achieved";
    chipMastered.textContent = "🎉 已達成！";
    cardMastered.classList.add("achieved");
  } else if (pctMastered >= 80) {
    chipMastered.className = "goal-status-chip status-near";
    chipMastered.textContent = `⚡ 即將達成 (還差 ${tMastered - curMastered} 個)`;
    cardMastered.classList.remove("achieved");
  } else {
    chipMastered.className = "goal-status-chip status-in-progress";
    chipMastered.textContent = `🚀 進行中 (還差 ${tMastered - curMastered} 個)`;
    cardMastered.classList.remove("achieved");
  }

  // 2. 累積作答
  const pctAttempts = Math.round((curAttempts / tAttempts) * 100);
  document.getElementById("goalCurrAttempts").textContent = `${curAttempts.toLocaleString()} 題`;
  document.getElementById("goalTargetAttempts").textContent = `目標：${tAttempts.toLocaleString()} 題`;
  document.getElementById("goalPctAttempts").textContent = `${pctAttempts}%`;
  document.getElementById("goalFillAttempts").style.width = `${Math.min(pctAttempts, 100)}%`;
  const chipAttempts = document.getElementById("goalStatusAttempts");
  const cardAttempts = document.getElementById("goalCardAttempts");
  if (curAttempts >= tAttempts) {
    chipAttempts.className = "goal-status-chip status-achieved";
    chipAttempts.textContent = "🎉 已達成！";
    cardAttempts.classList.add("achieved");
  } else if (pctAttempts >= 80) {
    chipAttempts.className = "goal-status-chip status-near";
    chipAttempts.textContent = `⚡ 即將達標 (還差 ${(tAttempts - curAttempts).toLocaleString()} 題)`;
    cardAttempts.classList.remove("achieved");
  } else {
    chipAttempts.className = "goal-status-chip status-in-progress";
    chipAttempts.textContent = `🚀 進行中 (還差 ${(tAttempts - curAttempts).toLocaleString()} 題)`;
    cardAttempts.classList.remove("achieved");
  }

  // 3. 答題正確率
  const pctAcc = tAcc > 0 ? Math.round((curAcc / tAcc) * 100) : 0;
  document.getElementById("goalCurrAccuracy").textContent = `${curAcc.toFixed(1)}%`;
  document.getElementById("goalTargetAccuracy").textContent = `目標：${tAcc}%`;
  document.getElementById("goalPctAccuracy").textContent = `${pctAcc}%`;
  document.getElementById("goalFillAccuracy").style.width = `${Math.min(pctAcc, 100)}%`;
  const chipAccuracy = document.getElementById("goalStatusAccuracy");
  const cardAccuracy = document.getElementById("goalCardAccuracy");
  if (curAcc >= tAcc) {
    chipAccuracy.className = "goal-status-chip status-achieved";
    chipAccuracy.textContent = curAcc > tAcc ? `🎉 超標達陣 (+${(curAcc - tAcc).toFixed(1)}%)` : "🎉 剛好達標！";
    cardAccuracy.classList.add("achieved");
  } else if (pctAcc >= 85) {
    chipAccuracy.className = "goal-status-chip status-near";
    chipAccuracy.textContent = `⚡ 距離目標還差 ${(tAcc - curAcc).toFixed(1)}%`;
    cardAccuracy.classList.remove("achieved");
  } else {
    chipAccuracy.className = "goal-status-chip status-in-progress";
    chipAccuracy.textContent = `🚀 進行中 (還差 ${(tAcc - curAcc).toFixed(1)}%)`;
    cardAccuracy.classList.remove("achieved");
  }

  // 4. 連續打卡
  const pctStreak = Math.round((curStreak / tStreak) * 100);
  document.getElementById("goalCurrStreak").textContent = `${curStreak} 天`;
  document.getElementById("goalTargetStreak").textContent = `目標：${tStreak} 天`;
  document.getElementById("goalPctStreak").textContent = `${pctStreak}%`;
  document.getElementById("goalFillStreak").style.width = `${Math.min(pctStreak, 100)}%`;
  const chipStreak = document.getElementById("goalStatusStreak");
  const cardStreak = document.getElementById("goalCardStreak");
  if (curStreak >= tStreak) {
    chipStreak.className = "goal-status-chip status-achieved";
    chipStreak.textContent = "🎉 已達成打卡挑戰！";
    cardStreak.classList.add("achieved");
  } else if (curStreak > 0) {
    chipStreak.className = "goal-status-chip status-near";
    chipStreak.textContent = `🔥 已連續 ${curStreak} 天，再堅持 ${tStreak - curStreak} 天！`;
    cardStreak.classList.remove("achieved");
  } else {
    chipStreak.className = "goal-status-chip status-in-progress";
    chipStreak.textContent = `🚀 今日開始打卡，目標 ${tStreak} 天！`;
    cardStreak.classList.remove("achieved");
  }

  // 計算總體達成率 (4 項目標)
  let achievedCount = 0;
  if (curMastered >= tMastered) achievedCount++;
  if (curAttempts >= tAttempts) achievedCount++;
  if (curAcc >= tAcc) achievedCount++;
  if (curStreak >= tStreak) achievedCount++;

  const overallPct = Math.round((achievedCount / 4) * 100);
  const overallBadge = document.getElementById("overallGoalBadge");
  const overallText = document.getElementById("overallGoalText");
  const overallFill = document.getElementById("overallGoalFill");

  overallFill.style.width = `${overallPct}%`;
  overallText.innerHTML = `總體目標進度：已達成 <strong>${achievedCount} / 4</strong> 個目標 (${overallPct}%)`;

  if (achievedCount === 4) {
    overallBadge.className = "overall-goal-badge all-completed";
    overallBadge.innerHTML = "🏆 全數目標達成！太神了！";
    document.getElementById("goalMotivationalTip").textContent = "恭喜完成全部挑戰！可點擊「設定目標」設定更高挑戰！";
  } else if (achievedCount >= 2) {
    overallBadge.className = "overall-goal-badge";
    overallBadge.innerHTML = "⚡ 漸入佳境！已完成過半";
    document.getElementById("goalMotivationalTip").textContent = "維持現在的練習節奏，勝利就在眼前！";
  } else {
    overallBadge.className = "overall-goal-badge";
    overallBadge.innerHTML = "持續進行中 🚀";
    document.getElementById("goalMotivationalTip").textContent = "每天進步一點點，持續打卡累積實力！";
  }

  // 期限天數計算
  const dlEl = document.getElementById("goalDeadlineInfo");
  if (g.deadline) {
    const todayD = new Date();
    todayD.setHours(0, 0, 0, 0);
    const dlD = new Date(g.deadline);
    dlD.setHours(0, 0, 0, 0);
    const diffDays = Math.round((dlD - todayD) / 86400000);
    if (diffDays > 0) {
      dlEl.innerHTML = `⏳ 目標期限：<strong>${g.deadline}</strong> (還有 <strong>${diffDays}</strong> 天)`;
      dlEl.style.color = diffDays <= 3 ? "var(--danger)" : "var(--text-muted)";
    } else if (diffDays === 0) {
      dlEl.innerHTML = `⚠️ 目標期限：<strong>今日到期！</strong>`;
      dlEl.style.color = "var(--danger)";
    } else {
      dlEl.innerHTML = `⌛ 目標期限：<strong>${g.deadline}</strong> (已截止 ${Math.abs(diffDays)} 天)`;
      dlEl.style.color = "var(--text-muted)";
    }
  } else {
    dlEl.textContent = "📅 尚未設定截止期限";
    dlEl.style.color = "var(--text-muted)";
  }
}

// ── 目標設定 Modal 操作 ──
function openGoalModal() {
  document.getElementById("inputGoalMastered").value = currentGoals.masteredTarget || 50;
  document.getElementById("inputGoalAttempts").value = currentGoals.attemptsTarget || 300;
  document.getElementById("inputGoalAccuracy").value = currentGoals.accuracyTarget || 80;
  document.getElementById("inputGoalStreak").value   = currentGoals.streakTarget   || 7;
  document.getElementById("inputGoalDeadline").value = currentGoals.deadline       || "";
  document.getElementById("goalModal").classList.add("open");
}

function closeGoalModal() {
  document.getElementById("goalModal").classList.remove("open");
}

function handleGoalModalBackdropClick(e) {
  if (e.target === document.getElementById("goalModal")) closeGoalModal();
}

function applyGoalPreset(type) {
  const presets = {
    beginner: { m: 20, a: 100, acc: 70, s: 3 },
    steady:   { m: 50, a: 300, acc: 80, s: 7 },
    advanced: { m: 100, a: 600, acc: 88, s: 14 },
    master:   { m: 200, a: 1000, acc: 92, s: 30 }
  };
  const p = presets[type] || presets.steady;
  document.getElementById("inputGoalMastered").value = p.m;
  document.getElementById("inputGoalAttempts").value = p.a;
  document.getElementById("inputGoalAccuracy").value = p.acc;
  document.getElementById("inputGoalStreak").value   = p.s;
}

function handleSaveGoalsSubmit(e) {
  e.preventDefault();
  const m   = parseInt(document.getElementById("inputGoalMastered").value, 10) || 50;
  const a   = parseInt(document.getElementById("inputGoalAttempts").value, 10) || 300;
  const acc = parseFloat(document.getElementById("inputGoalAccuracy").value)   || 80;
  const s   = parseInt(document.getElementById("inputGoalStreak").value, 10)   || 7;
  const dl  = document.getElementById("inputGoalDeadline").value || "";

  const updatedGoals = {
    masteredTarget: m,
    attemptsTarget: a,
    accuracyTarget: acc,
    streakTarget: s,
    deadline: dl
  };

  currentGoals = updatedGoals;
  const targetUser = viewingStudent || currentUser;
  if (targetUser) {
    try {
      localStorage.setItem("goals_" + targetUser, JSON.stringify(updatedGoals));
    } catch (_) {}
  }

  updateGoalsProgress();
  renderForecast();
  closeGoalModal();
  showToast("✅ 學習目標已儲存並生效！", "success");

  // 同步儲存至 Google 試算表
  const credentials = {
    username: currentUser,
    password: currentPass,
    targetStudent: viewingStudent || ""
  };
  google.script.run
    .withSuccessHandler(resp => {
      if (resp && resp.status === "success") {
        // 成功儲存
      }
    })
    .withFailureHandler(() => {})
    .saveStudentGoals(credentials, updatedGoals);
}

function loadStudentGoals(targetUsername) {
  const user = targetUsername || viewingStudent || currentUser;
  if (!user) return;

  // 1. 先從 localStorage 快取載入
  try {
    const cached = localStorage.getItem("goals_" + user);
    if (cached) {
      currentGoals = JSON.parse(cached);
      updateGoalsProgress();
      renderForecast();
    }
  } catch (_) {}

  // 2. 從 Google 試算表抓取最新目標
  const credentials = {
    username: currentUser,
    password: currentPass,
    targetStudent: viewingStudent || ""
  };
  google.script.run
    .withSuccessHandler(resp => {
      if (resp && resp.status === "success" && resp.goals) {
        currentGoals = resp.goals;
        try {
          localStorage.setItem("goals_" + user, JSON.stringify(resp.goals));
        } catch (_) {}
        updateGoalsProgress();
        renderForecast();
      }
    })
    .withFailureHandler(() => {})
    .getStudentGoals(credentials);
}
