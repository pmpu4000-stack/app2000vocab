<script>
async function _exportStudentRecordToExcel(payload) {
  const fileName = `學習歷程_使用紀錄_${payload.studentId}_${payload.fileScopeTag}`;
  const advice = _generatePedagogicalAdvice(payload);

  try {
    const XLSX = await _ensureExternalScript(
      "XLSX",
      "https:\x2F\x2Fcdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js",
      "https:\x2F\x2Fcdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
    );
    const wb = XLSX.utils.book_new();

    // ════════════════════════════════════════════════════════════════
    // Sheet 1: 📋 每日學習紀錄表 (家長專用聯絡簿 · 一眼看懂無門檻)
    // ════════════════════════════════════════════════════════════════
    const ws1Data = [
      ["【拼字小特工 · 學生每日單字作答成果紀錄表（家長查閱專用）】"],
      ["學生帳號", payload.studentId, "查閱統計區間", payload.scopeTitle, "製表時間", payload.exportTime],
      [
        "📌 學習活躍天數", `${payload.periodSummary.activeDaysCount} 天`,
        "🎯 學校指定測驗完成", `${payload.periodSummary.taskDoneCount} 次`,
        "⭐ 指定測驗平均成績", `${payload.periodSummary.avgRate}%`,
        "🎮 自由自學練習累積", `${payload.periodSummary.freeTotalAttempts || 0} 題`,
        "❌ 需加強錯題單字", `${payload.uniqueWrongWords.length} 字`
      ],
      [],
      [
        "日期",
        "星期",
        "任務類型 (指定測驗 / 週末攻克 / 自由自學)",
        "測驗成績 (答對題數 / 總題數)",
        "正確率",
        "測驗答錯的單字 (需家長協助叮嚀)",
        "測驗答對的單字 (孩子已熟練學會)",
        "未作答單字",
        "自由自學練習成果 (孩子主動自主練習)",
        "自由練習答錯單字",
        "導師叮嚀與學習診斷 (大白話解說)"
      ]
    ];

    payload.dailyRecords.forEach(r => {
      const isWeekend = (r.dayOfWeek === "週六" || r.dayOfWeek === "週日" || String(r.formattedTaskName || "").includes("週末"));
      
      // 1. 任務類型
      let taskType = "☕ 本日無指定任務";
      if (r.hasTask) {
        taskType = isWeekend ? "🎯 週末錯題攻克消滅戰" : "📝 學校每日指定單字測驗";
      } else if (r.hasFree) {
        taskType = "🎮 自由闖關練習 (自學)";
      }

      // 2. 測驗成績 (答對題數 / 總題數)
      let scoreText = "— (無測驗)";
      let rateText = "—";
      if (r.hasTask) {
        if (r.taskStatus.includes("未受測")) {
          scoreText = `🔴 缺席未測驗 (0/${r.assignedTotWords} 題)`;
          rateText = "0%";
        } else if (r.hasUnanswered || r.taskStatus.includes("中斷") || r.taskStatus.includes("未完成")) {
          scoreText = `🟠 未完成 (${r.taskCorrWords}/${r.assignedTotWords} 題)`;
          rateText = `${r.overallScoreRate}%`;
        } else if (r.actualWrong === 0 && r.taskCorrWords > 0) {
          scoreText = `🌟 ${r.taskCorrWords} / ${r.assignedTotWords} 題 (全對！)`;
          rateText = `${r.overallScoreRate}% 🌟`;
        } else {
          scoreText = `${r.taskCorrWords} / ${r.assignedTotWords} 題 (對 ${r.taskCorrWords} 錯 ${r.actualWrong})`;
          rateText = `${r.overallScoreRate}%`;
        }
      }

      // 3. 答錯與答對單字
      const wrongStr = r.taskWrongDetails.length > 0 
        ? r.taskWrongDetails.map(d => `${d.word}${d.zh ? ` (${d.zh})` : ''}`).join(", ") 
        : (r.hasTask ? (r.taskStatus.includes("未受測") ? "未受測" : "🎉 太棒了，全部答對無錯題！") : "—");

      const corrStr = r.taskCorrectDetails.length > 0 
        ? r.taskCorrectDetails.map(d => `${d.word}${d.zh ? ` (${d.zh})` : ''}`).join(", ") 
        : (r.hasTask ? (r.taskStatus.includes("未受測") ? "未施測" : "無") : "—");

      const unansStr = r.unansweredDetails.length > 0 
        ? r.unansweredDetails.map(d => `${d.word}${d.zh ? ` (${d.zh})` : ''}`).join(", ") 
        : (r.hasTask ? (r.hasUnanswered ? `${r.actualUnanswered} 題未作答` : "無 (全部作答完畢)") : "—");

      // 4. 自由自學練習成果
      const freeScoreText = r.hasFree 
        ? `🎮 挑戰 ${r.freeAttempts} 題 (答對 ${r.freeCorrect} 題 / 正確率 ${r.freeRate}%)` 
        : "今日未額外自主練習";

      const freeWrongStr = r.freeWrongDetails.length > 0 
        ? r.freeWrongDetails.map(d => `${d.word}${d.zh ? ` (${d.zh})` : ''}`).join(", ") 
        : (r.hasFree ? "🎉 自由練習全數答對" : "—");

      // 5. 導師叮嚀大白話
      let teacherComment = "";
      if (r.hasTask) {
        if (r.taskStatus.includes("未受測")) {
          teacherComment = "⚠️ 今日有指定單字測驗尚未受測，請家長提醒孩子利用空檔完成。";
        } else if (isWeekend && r.actualWrong === 0 && r.taskCorrWords > 0) {
          teacherComment = "🌟 太厲害了！本週弱點錯題已在週六全部消滅，週日可以好好休息放鬆！";
        } else if (!isWeekend && r.actualWrong === 0 && r.taskCorrWords > 0) {
          teacherComment = "🎉 太棒了！今日學校指定單字全數過關，記憶力與專注度極佳！";
        } else if (r.actualWrong > 0) {
          teacherComment = `💡 今日答錯 ${r.actualWrong} 字，系統已自動安排至六日「週末消滅戰」加強，請家長多給孩子鼓勵！`;
        } else if (r.hasUnanswered) {
          teacherComment = `⚠️ 尚有 ${r.actualUnanswered} 題未作答完畢，建議提醒孩子答完再交卷喔。`;
        }
      } else if (r.hasFree) {
        teacherComment = "👍 孩子今天主動進行自由練習，自發學習態度非常值得嘉許！";
      } else {
        teacherComment = "☕ 本日無指定測驗，孩子今日適度放鬆休息。";
      }

      ws1Data.push([
        r.date,
        r.dayOfWeek,
        taskType,
        scoreText,
        rateText,
        wrongStr,
        corrStr,
        unansStr,
        freeScoreText,
        freeWrongStr,
        teacherComment
      ]);
    });

    ws1Data.push([]);
    ws1Data.push([
      "【區間整體成果合計】",
      "",
      `活躍練習 ${payload.periodSummary.activeDaysCount} 天`,
      `測驗總成績 ${payload.periodSummary.totalCorrect} / ${payload.periodSummary.totalAssigned || payload.periodSummary.totalAttempts} 題`,
      `平均正確率 ${payload.periodSummary.avgRate}%`,
      `累計錯題 ${payload.periodSummary.totalWrong || 0} 題次`,
      "",
      `未作答 ${payload.periodSummary.totalUnanswered || 0} 題次`,
      `自主練習 ${payload.periodSummary.freeTotalAttempts || 0} 題 (對 ${payload.periodSummary.freeTotalCorrect || 0} 題)`,
      "",
      ""
    ]);

    const ws1 = XLSX.utils.aoa_to_sheet(ws1Data);
    ws1["!cols"] = [
      { wch: 13 }, // 日期
      { wch: 8 },  // 星期
      { wch: 26 }, // 任務類型
      { wch: 22 }, // 測驗成績
      { wch: 12 }, // 正確率
      { wch: 38 }, // 測驗答錯的單字
      { wch: 38 }, // 測驗答對的單字
      { wch: 22 }, // 未作答單字
      { wch: 30 }, // 自由自學練習成果
      { wch: 28 }, // 自由練習答錯單字
      { wch: 42 }  // 導師叮嚀與學習診斷
    ];
    XLSX.utils.book_append_sheet(wb, ws1, "每日學習紀錄(家長聯絡簿)");

    // ════════════════════════════════════════════════════════════════
    // Sheet 2: 📊 孩子學習總進度與能力分析 (家長了解孩子成長軌跡)
    // ════════════════════════════════════════════════════════════════
    const ov = payload.overall;
    const ms = ov.modeStats || {};
    const mRate = (m) => (m && m.a > 0) ? `${Math.round((m.c / m.a) * 100)}%` : "0%";
    const getBar = (pct) => {
      const filled = Math.min(10, Math.max(0, Math.round(pct / 10)));
      return "■".repeat(filled) + "□".repeat(10 - filled) + ` ${pct}%`;
    };

    const ws2Data = [
      ["【拼字小特工 · 孩子整體學習進度與英語能力總表】"],
      ["學生帳號", payload.studentId, "評估時間", payload.exportTime],
      [],
      ["━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"],
      ["【一、教育部國中小必背 2000 單字 · 總掌握進度】"],
      ["━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"],
      ["📚 課程總單字量", `${ov.totalVocab} 字`, "⭐ 已徹底精通單字", `${ov.mast} 字`, "🏆 總單字掌握率", `${Math.round(ov.mast / (ov.totalVocab || 2055) * 100)}%`],
      ["📖 練習熟記中單字", `${ov.prac} 字`, "🌱 初步學習中單字", `${ov.learn} 字`, "✏️ 累計作答總題數", `${ov.attempts} 題`],
      ["🔥 連續登入練習", `${ov.streak} 天`, "🏅 最佳連續紀錄", `${ov.best} 天`, "📅 累計練習天數", `${ov.totalDays} 天`],
      [],
      ["━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"],
      ["【二、英語 4 大核心能力指標 (遊戲題型成效)】"],
      ["━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"],
      ["能力指標 (遊戲題型)", "練習題數", "答對題數", "正確率", "熟練程度進度條", "這項能力對孩子的重要性 (家長白話解說)"],
      ["🎧 聽音辨字 (聽與拼)", `${(ms.listen && ms.listen.a) || 0} 題`, `${(ms.listen && ms.listen.c) || 0} 題`, mRate(ms.listen), getBar(parseInt(mRate(ms.listen))), "培養英聽敏銳度與自然發音 (Phonics)，聽到發音就能拼出單字"],
      ["✅ 單字辨析 (選拼法)", `${(ms.pick && ms.pick.a) || 0} 題`, `${(ms.pick && ms.pick.c) || 0} 題`, mRate(ms.pick), getBar(parseInt(mRate(ms.pick))), "訓練細心度，分清長得很像的形近字與同音字，避免考試粗心"],
      ["🧩 結構拆解 (單字重組)", `${(ms.scramble && ms.scramble.a) || 0} 題`, `${(ms.scramble && ms.scramble.c) || 0} 題`, mRate(ms.scramble), getBar(parseInt(mRate(ms.scramble))), "培養音節與字母組合邏輯，幫助孩子不死背、輕鬆背長單字"],
      ["🖍️ 陷阱克服 (填空陷阱)", `${(ms.trap && ms.trap.a) || 0} 題`, `${(ms.trap && ms.trap.c) || 0} 題`, mRate(ms.trap), getBar(parseInt(mRate(ms.trap))), "專攻台灣學生最常漏寫的母音盲區與雙寫字母，強化拼寫準度"],
      [],
      ["━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"],
      ["【三、教育部／CEFR 分級難度關卡 (Level 1 ~ Level 5)】"],
      ["━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"],
      ["關卡難度", "難度名稱", "適合年級 / 難度說明", "掌握進度 (已測/總字數)", "掌握率", "精通⭐字數", "關卡總字數"]
    ];

    const lvGradeDesc = [
      "國小基礎單字 · 奠定日常溝通基石",
      "國小核心單字 · 擴充生活常見詞彙",
      "國中進階單字 · 銜接會考常用句型",
      "國中挑戰單字 · 深入閱讀與多元主題",
      "會考精熟高分單字 · 挑戰滿分與高階閱讀"
    ];

    (ov.levels || []).forEach(L => {
      ws2Data.push([
        `Level ${L.level}`,
        L.name || "",
        lvGradeDesc[L.level - 1] || "分級核心單字",
        L.summaryText || `${L.correct || 0} / ${L.total || 0}`,
        `${L.rate || (L.total > 0 ? Math.round(((L.mast || 0) / L.total) * 100) : 0)}%`,
        L.mast || 0,
        L.total || 0
      ]);
    });

    ws2Data.push([]);
    ws2Data.push(["━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"]);
    ws2Data.push(["【四、導師給家長的指導與陪伴建議】"]);
    ws2Data.push(["━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"]);
    ws2Data.push(["🌟 孩子的學習優勢", advice.highlight]);
    ws2Data.push(["🔍 錯題弱點特徵", advice.diagnosis]);
    ws2Data.push(["💡 在家陪伴與複習指南", advice.actionPlan]);

    const ws2 = XLSX.utils.aoa_to_sheet(ws2Data);
    ws2["!cols"] = [
      { wch: 18 }, { wch: 14 }, { wch: 32 }, { wch: 22 },
      { wch: 14 }, { wch: 14 }, { wch: 14 }
    ];
    XLSX.utils.book_append_sheet(wb, ws2, "孩子進度與能力總表");

    // ════════════════════════════════════════════════════════════════
    // Sheet 3: 🎯 本期待攻克單字專區 (可直接列印隨身考)
    // ════════════════════════════════════════════════════════════════
    const conquerList = (payload.pendingConquerWords && payload.pendingConquerWords.length > 0)
      ? payload.pendingConquerWords
      : payload.uniqueWrongWords;

    const ws3Data = [
      ["【拼字小特工 · 本期待攻克單字與弱點特徵清單（可直接列印隨身考）】"],
      ["學生帳號", payload.studentId, "待攻克單字總數", `${conquerList.length} 字`, "整理時間", payload.exportTime],
      ["家長小提示：本清單為平日指定測驗錯題與待補強單字，在自由練習中只要拼對該單字即可自動消滅！建議每天抽考 3~5 個單字，唸中文讓孩子拼英文。"],
      [],
      ["編號", "英文單字", "中文釋義", "常錯原因 (弱點標籤)", "弱點特徵解析", "攻克狀態", "在家複習記憶口訣 / 建議"]
    ];

    if (conquerList.length === 0) {
      ws3Data.push(["—", "（太棒了！本期無待攻克單字）", "全部掌握", "無錯題", "平時測驗單字皆已掌握或於自由練習中全數攻克", "已消滅", "表現優秀，請繼續保持！"]);
    } else {
      conquerList.forEach((w, idx) => {
        ws3Data.push([
          idx + 1,
          w.word,
          w.zh || "—",
          w.tag || "拼寫弱點",
          w.desc || "需加強拼寫記憶",
          "待攻克 (自由練習答對可隨時消滅)",
          "利用自然發音拆音節記憶，系統已自動排入六日週末消滅戰複習"
        ]);
      });
    }

    const ws3 = XLSX.utils.aoa_to_sheet(ws3Data);
    ws3["!cols"] = [
      { wch: 6 },  // 編號
      { wch: 18 }, // 英文單字
      { wch: 22 }, // 中文釋義
      { wch: 18 }, // 常錯原因
      { wch: 28 }, // 弱點特徵解析
      { wch: 30 }, // 攻克狀態
      { wch: 45 }  // 在家複習記憶口訣
    ];
    XLSX.utils.book_append_sheet(wb, ws3, "待攻克單字清單(可列印)");

    try {
      const wbout = XLSX.write(wb, { bookType: "xlsx", type: "array" });
      const blob = new Blob([wbout], { type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet" });
      triggerBlobDownload(blob, `${fileName}.xlsx`);
    } catch (writeErr) {
      console.warn("XLSX write blob failed, trying XLSX.writeFile:", writeErr);
      XLSX.writeFile(wb, `${fileName}.xlsx`);
    }
  } catch (err) {
    console.warn("XLSX fallback to CSV:", err);
    const rows = [
      ["日期", "星期", "任務類型", "測驗成績", "正確率", "測驗答錯的單字", "測驗答對的單字", "未作答單字", "自由自學練習成果", "自由練習答錯單字", "導師叮嚀與學習診斷"]
    ];
    payload.dailyRecords.forEach(r => {
      const isWeekend = (r.dayOfWeek === "週六" || r.dayOfWeek === "週日" || String(r.formattedTaskName || "").includes("週末"));
      const taskType = r.hasTask ? (isWeekend ? "🎯 週末錯題攻克消滅戰" : "📝 學校每日指定單字測驗") : (r.hasFree ? "🎮 自由闖關練習" : "☕ 本日無指定任務");
      const scoreText = r.hasTask ? (r.taskStatus.includes("未受測") ? `🔴 缺席未測驗` : `${r.taskCorrWords}/${r.assignedTotWords} 題`) : "—";
      const rateText = r.hasTask ? (r.taskStatus.includes("未受測") ? "0%" : `${r.overallScoreRate}%`) : "—";
      const wrongStr = r.taskWrongDetails.length > 0 ? r.taskWrongDetails.map(d => `${d.word}${d.zh ? ` (${d.zh})` : ''}`).join(" ") : (r.hasTask ? "🎉 全數答對無錯題" : "—");
      const corrStr = r.taskCorrectDetails.length > 0 ? r.taskCorrectDetails.map(d => `${d.word}${d.zh ? ` (${d.zh})` : ''}`).join(" ") : "—";
      const unansStr = r.unansweredDetails.length > 0 ? r.unansweredDetails.map(d => `${d.word}${d.zh ? ` (${d.zh})` : ''}`).join(" ") : "無";
      const freeScoreText = r.hasFree ? `挑戰 ${r.freeAttempts} 題 (對 ${r.freeCorrect} 題 / ${r.freeRate}%)` : "未練習";
      const freeWrongStr = r.freeWrongDetails.length > 0 ? r.freeWrongDetails.map(d => `${d.word}${d.zh ? ` (${d.zh})` : ''}`).join(" ") : (r.hasFree ? "🎉 全對" : "—");

      rows.push([
        r.date, r.dayOfWeek, taskType, scoreText, rateText, wrongStr, corrStr, unansStr,
        freeScoreText, freeWrongStr, r.remarks
      ]);
    });
    const csvContent = "\uFEFF" + rows.map(row => row.map(c => `"${String(c ?? "").replace(/"/g, '""')}"`).join(",")).join("\r\n");
    const blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    triggerBlobDownload(blob, `${fileName}.csv`);
  }
}

      <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:2.5px solid #6C4CE0; padding-bottom:8px; margin-bottom:8px;">
        <div>
          <div style="font-size:18px; font-weight:900; color:#232A4D;">🎯 拼字小特工 · 學生使用與作答紀錄報表</div>
          <div style="font-size:12px; color:#5A6183; font-weight:700; margin-top:2px;">${esc(payload.scopeTitle)}</div>
        </div>
        <div style="text-align:right; font-size:11.5px; color:#5A6183; font-weight:700;">
          <div>👤 學生帳號：<b style="color:#6C4CE0; font-size:13px;">${esc(payload.studentId)}</b></div>
          <div>🕒 匯出時間：${esc(payload.exportTime)}</div>
        </div>
      </div>

      <!-- 區間統計摘要 -->
      <div style="display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:8px;">
        <div style="background:#F8F9FD; border:1px solid #E7E9F5; border-radius:8px; padding:6px 6px; text-align:center;">
          <div style="font-size:10.5px; color:#5A6183; font-weight:700;">📅 區間練習天數</div>
          <div style="font-size:16px; font-weight:900; color:#6C4CE0;">${ps.activeDaysCount} 天</div>
        </div>
        <div style="background:#F8F9FD; border:1px solid #E7E9F5; border-radius:8px; padding:6px 6px; text-align:center;">
          <div style="font-size:10.5px; color:#5A6183; font-weight:700;">✍️ 區間施測單字數</div>
          <div style="font-size:16px; font-weight:900; color:#0284C7;">${ps.totalAttempts} 字</div>
        </div>
        <div style="background:#F8F9FD; border:1px solid #E7E9F5; border-radius:8px; padding:6px 6px; text-align:center;">
          <div style="font-size:10.5px; color:#5A6183; font-weight:700;">✅ 區間答對單字數</div>
          <div style="font-size:16px; font-weight:900; color:#2FB47C;">${ps.totalCorrect} 字</div>
        </div>
        <div style="background:#F8F9FD; border:1px solid #E7E9F5; border-radius:8px; padding:6px 6px; text-align:center;">
          <div style="font-size:10.5px; color:#5A6183; font-weight:700;">📊 區間平均正確率</div>
          <div style="font-size:16px; font-weight:900; color:${ps.avgRate >= 80 ? '#1E9A66' : '#E8892B'};">${ps.avgRate}%</div>
        </div>
      </div>

      <!-- 整體進度 Progress 獨立方塊（比照遊戲網頁整體進度） -->
      <div style="border:1.5px solid #E7E9F5; border-radius:12px; padding:8px 10px; margin-bottom:8px; background:#FFFFFF; page-break-inside:avoid; box-shadow:0 2px 6px rgba(0,0,0,0.03);">
        <div style="font-size:13.5px; font-weight:800; color:#232A4D; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center;">
          <span>整體進度 Progress</span>
        </div>
        <!-- 三色三階熟練度進度條 -->
        <div style="height:14px; border-radius:8px; background:#E8EBF5; overflow:hidden; display:flex; border:1.5px solid rgba(35,42,77,0.12); margin-bottom:6px; box-sizing:border-box;">
          <div style="width:${Math.min(100, Math.max(0, ((ov.learn || 0) / (ov.totalVocab || 2055) * 100)))}%; height:100%; background:linear-gradient(90deg, #6366F1, #818CF8);"></div>
          <div style="width:${Math.min(100, Math.max(0, ((ov.prac || 0) / (ov.totalVocab || 2055) * 100)))}%; height:100%; background:linear-gradient(90deg, #0284C7, #38BDF8);"></div>
          <div style="width:${Math.min(100, Math.max(0, ((ov.mast || 0) / (ov.totalVocab || 2055) * 100)))}%; height:100%; background:linear-gradient(90deg, #10B981, #34D399);"></div>
        </div>
        <!-- 圖例與指標說明 -->
        <div style="display:flex; flex-direction:column; gap:4px; font-size:12px; color:#5A6183;">
          <div style="display:flex; align-items:center; gap:14px; font-weight:700;">
            <span style="display:inline-flex; align-items:center; gap:5px;"><i style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#6366F1;"></i>學習中 <b style="color:#4F46E5; font-size:13px;">${ov.learn || 0}</b></span>
            <span style="display:inline-flex; align-items:center; gap:5px;"><i style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#0284C7;"></i>練習中 <b style="color:#0284C7; font-size:13px;">${ov.prac || 0}</b></span>
            <span style="display:inline-flex; align-items:center; gap:5px;"><i style="display:inline-block; width:10px; height:10px; border-radius:50%; background:#10B981;"></i>精通 <b style="color:#059669; font-size:13px;">${ov.mast || 0}</b></span>
          </div>
          <div style="display:flex; align-items:center; gap:8px; font-weight:700; color:#232A4D; padding-top:3px; border-top:1px dashed #E7E9F5;">
            <span>答對 <b style="color:#D97706; font-size:13px;">${ov.distinctCorrect || ((ov.learn || 0) + (ov.prac || 0) + (ov.mast || 0))}</b> 字，共 <b style="color:#D97706; font-size:13px;">${ov.totalVocab || 2055}</b> 字，掌握率 <b style="color:#D97706; font-size:13px;">${ov.passRate || 0}%</b></span>
            <span style="color:#CBD5E1;">/</span>
            <span>獲得 <b style="color:#D97706; font-size:13px;">${ov.points || 0}</b> 分</span>
          </div>
        </div>
        <div style="font-size:11px; color:#9AA0BD; margin-top:6px; line-height:1.4;">
          熟練度定義：<b>學習中</b>＝答對 1 次 · <b>練習中</b>＝連續答對 2 次 · <b>精通</b>＝連續答對 3 次（答錯會退回「學習中」）
        </div>
      </div>

      <!-- 各關卡進度（比照整體進度版型） -->
      <div style="border:1.5px solid #E7E9F5; border-radius:12px; padding:8px 10px; margin-bottom:8px; background:#FFFFFF; page-break-inside:avoid; box-shadow:0 2px 6px rgba(0,0,0,0.03);">
        <div style="font-size:13.5px; font-weight:800; color:#232A4D; margin-bottom:6px; display:flex; justify-content:space-between; align-items:center; border-bottom:1.5px solid #E7E9F5; padding-bottom:6px;">
          <span>📊 各關卡進度</span>
          <span style="font-size:12px; color:#5A6183; font-weight:700;">全書掌握 ${ov.distinctCorrect} 字 / 2055 字（掌握率 ${ov.passRate}%）</span>
        </div>
        <table class="sumtable" style="width:100%; border-collapse:collapse; font-size:12.5px;">
          ${lvRowsHtml}
        </table>
      </div>

      <!-- 🎯 本期待攻克單字庫 -->
      ${conquerSectionHtml}

      <!-- 每日使用紀錄明細 -->
      <div style="font-size:13.5px; font-weight:800; color:#232A4D; margin-bottom:8px;">📋 每日使用與作答紀錄明細（共 ${payload.dailyRecords.length} 日）</div>
      ${dailyCardsHtml}
    </div>
  `;
}


</script>
