name: CI / Code Integrity & Syntax Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run JavaScript Syntax Check
        run: |
          node -c sw.js
          node -c src/auth.js
          node -c src/time_limits.js
          node -c src/teacher_portal.js
          node -c src/sync.js

      - name: Validate Index.html HTML/JS Integrity
        run: |
          node -e "
            const fs = require('fs');
            const html = fs.readFileSync('index.html', 'utf8');
            const scripts = html.match(/<script[\s\S]*?<\/script>/gi) || [];
            scripts.forEach((s, idx) => {
              if (!s.includes('src=')) {
                const code = s.replace(/<script[^>]*>/, '').replace(/<\/script>/, '');
                try {
                  new Function(code);
                } catch(e) {
                  console.error('Syntax error in inline script ' + idx + ':', e.message);
                  process.exit(1);
                }
              }
            });
            console.log('All inline scripts validated successfully!');
          "
