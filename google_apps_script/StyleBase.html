    /* ── 日期選擇器日曆圖示強化 (Light / Dark 模式一律清晰顯眼) ── */

    }

      border: 1px solid rgba(108, 76, 224, 0.22) !important;
      transition: all 0.2s ease !important;
    }
    input[type="date"]::-webkit-calendar-picker-indicator:hover,
    .date-picker-input::-webkit-calendar-picker-indicator:hover {
      opacity: 1 !important;
      background-color: rgba(108, 76, 224, 0.18) !important;

    /* ── 按鈕 ── */
    button {
      padding: 8px 16px; min-height: 40px; background-color: var(--primary); color: #fff;
      border: none; border-radius: 8px; font-size: 14px; font-weight: 600;
      cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
      transition: all 0.18s ease; user-select: none;
    }
    button:hover:not(:disabled) { background-color: var(--primary-hover); transform: translateY(-1px); }
    button:active:not(:disabled) { transform: scale(0.97); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    .btn-secondary { background-color: var(--card); color: var(--text); border: 1.5px solid var(--border); }
    .btn-secondary:hover:not(:disabled) { background-color: var(--table-hover-bg); }

      background-color: #232A40 !important;
      border-color: #333D5C !important;
      color: #F0F3FA !important;

    [data-theme="dark"] .btn-secondary:hover:not(:disabled) {

    /* ── KPI 卡片 ── */
    .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(175px, 1fr)); gap: 16px; margin-bottom: 22px; }
    .kpi-card {
      background: var(--card); border: 1.5px solid var(--border); border-radius: 14px;
      padding: 18px 18px 18px 22px; box-shadow: var(--shadow-xs);
      transition: background-color 0.3s, border-color 0.3s, transform 0.15s, box-shadow 0.15s;
      border-left: 5px solid var(--kpi1); position: relative; cursor: default;
    }
    .kpi-card:nth-child(1) { border-left-color: var(--kpi1); }
    .kpi-card:nth-child(2) { border-left-color: var(--kpi2); }
    .kpi-card:nth-child(3) { border-left-color: var(--kpi3); }
    .kpi-card:nth-child(4) { border-left-color: var(--kpi4); }
    .kpi-card:nth-child(5) { border-left-color: var(--kpi5); }
    .kpi-card:nth-child(6) { border-left-color: var(--kpi6); }
    .kpi-card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-color: var(--primary); }

      content: attr(data-tip); position: absolute; bottom: calc(100% + 8px); left: 50%;
