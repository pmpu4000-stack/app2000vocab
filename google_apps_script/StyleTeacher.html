<style>

    .filter-chip { padding: 5px 12px; border-radius: 9999px; font-size: 12.5px; font-weight: 600; border: 1.5px solid var(--border); background: var(--card); color: var(--text-muted); cursor: pointer; transition: all 0.18s; }

    .zero-val { color: var(--text-muted); opacity: 0.45; }

    /* ── 教師返回列 ── */

    .modal-close:hover { color: var(--text); background: none; transform: none; }

      body:not(.modal-report-open):not(:has(#printReportModal.open)) #printReportModal {
